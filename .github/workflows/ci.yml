# ==============================================================================
# Toroloom CI — Runs on every push and pull request to the default branch.
#
# Jobs (run in parallel):
#   backend              → TypeScript compilation + unit tests (vitest, no databases)
#   backend-integration  → PostgreSQL + MongoDB integration tests (requires services)
#   frontend             → TypeScript compilation + vitest tests
#   stress               → Long-running WebSocket stress test (separate job, 30 min)
#
# Integration tests spin up PostgreSQL and MongoDB via GitHub Actions service
# containers, then run the *.int.test.ts suites against them.
# ==============================================================================

name: CI

on:
  push:
    branches: ['**']   # every branch push — e2e/coverage-badge jobs self-guard to master/main
  pull_request:
    branches: [master, main]
  workflow_dispatch:           # Allow manual trigger from the Actions tab

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true     # Cancel in-flight runs on the same branch

env:
  NODE_VERSION: '20'

jobs:

  # ── Backend: TypeScript compilation + unit tests ──────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false          # Don't cancel other jobs if this one fails

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Cache node_modules (backend)
        uses: actions/cache@v6
        with:
          path: backend/node_modules
          key: nodes-BACKEND-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            nodes-BACKEND-${{ runner.os }}-node${{ env.NODE_VERSION }}-
        id: nm-cache

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: Verify install-script allowlist (supply-chain)
        run: node "$GITHUB_WORKSPACE/scripts/install-scripts-allowlist.mjs"


      - name: Restore TypeScript build cache
        uses: actions/cache@v6
        with:
          path: |
            *.tsbuildinfo
            backend/tsconfig.tsbuildinfo
          key: tsb-${{ github.job }}-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - name: TypeScript compilation check
        run: npm run typecheck
      - name: Save TypeScript build cache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: |
            *.tsbuildinfo
            backend/tsconfig.tsbuildinfo
          key: tsb-${{ github.job }}-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Lint check
        run: npm run lint

      - name: Run unit tests with coverage (excluding integration tests)
        # Also exclude cross-file isolation tests — they run in a dedicated
        # job (cross-file-isolation) with singleFork=true so the singleton
        # is shared across files. Running them here (separate forks) would
        # produce a false pass trivially.
        # Also exclude the WebSocket stress test — it has its own dedicated
        # job (stress) with a 25-minute timeout and routinely exceeds the
        # global 30s hookTimeout under coverage on slow runners.
        run: npx vitest run --reporter=verbose --coverage --exclude='**/*.int.test.ts' --exclude='**/*CrossFile*.test.ts' --exclude='**/*.stress.test.ts'
        env:
          NODE_ENV: test

      - name: Upload backend coverage report artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 14

      # Post coverage summary to the GitHub Actions job summary (visible in
      # the Actions UI itself, not just on PRs). Reads the already-generated
      # coverage/coverage-summary.json — no need to re-run tests.
      - name: Post coverage summary to job summary
        if: always()
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('coverage/coverage-summary.json','utf8'));
            const t = p.total;
            const fmt = (o) => o.pct + '% (' + o.covered + '/' + o.total + ')';
            const summary = [
              '### Backend Coverage',
              '',
              '| Statements | Branches | Functions | Lines |',
              '|------------|----------|-----------|-------|',
              '| ' + fmt(t.statements) + ' | ' + fmt(t.branches) + ' | ' + fmt(t.functions) + ' | ' + fmt(t.lines) + ' |',
              '',
              '> Thresholds: statements 42% | branches 33% | functions 42% | lines 42%',
              ''
            ].join('\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          "

      # Explicit coverage threshold gate — fails the build if any metric
      # drops below the configured minimum. Threshold values are mirrored
      # from backend/vitest.config.ts coverage.thresholds and must be kept
      # in sync.
      - name: Check coverage thresholds
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('coverage/coverage-summary.json','utf8'));
            const t = p.total;
            const thresholds = {
              statements: 42,
              branches: 33,
              functions: 42,
              lines: 42,
            };
            let failed = false;
            for (const [key, threshold] of Object.entries(thresholds)) {
              const actual = t[key].pct;
              const status = actual >= threshold ? 'PASS' : 'FAIL';
              console.log(status + ': ' + key + ' ' + actual + '% (threshold: ' + threshold + '%)');
              if (actual < threshold) failed = true;
            }
            if (failed) {
              console.log('BACKEND COVERAGE THRESHOLDS NOT MET — failing build');
              process.exit(1);
            }
            console.log('All backend coverage thresholds met!');
          "

      # Generate shields.io-compatible badge JSON from coverage summary.
      # Uploaded as an artifact so the coverage-badge job can combine both
      # frontend and backend badges and deploy them to gh-pages.
      - name: Generate coverage badge JSON
        if: success() || failure()
        shell: bash
        run: |
          mkdir -p badge-artifact
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "Coverage summary not found — skipping badge generation"
            exit 0
          fi
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('coverage/coverage-summary.json','utf8'));
            const lines = p.total.lines.pct;
            const color = lines >= 90 ? 'brightgreen'
              : lines >= 80 ? 'green'
              : lines >= 70 ? 'yellowgreen'
              : lines >= 60 ? 'yellow'
              : lines >= 50 ? 'orange'
              : 'red';
            const badge = {
              schemaVersion: 1,
              label: 'backend',
              message: lines + '%',
              color: color,
            };
            fs.writeFileSync('badge-artifact/backend-coverage.json', JSON.stringify(badge, null, 2) + '\n');
            console.log('Backend coverage badge: ' + lines + '% (' + color + ')');
          "

      # Note: upload-artifact paths are relative to the workspace root,
      # NOT the job's defaults.run.working-directory. The badge JSON was
      # created at backend/badge-artifact/ (because working-directory is
      # backend), so we must specify backend/badge-artifact/ here.
      - name: Upload backend coverage badge
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage-badge
          path: backend/badge-artifact/
          retention-days: 7

  # ── Frontend: TypeScript compilation + lint + i18n parity (static) ─────
  frontend:
    name: Frontend — Static Checks (typecheck, lint, i18n parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: nodes-ROOT-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nodes-ROOT-${{ runner.os }}-node${{ env.NODE_VERSION }}-
        id: nm-cache

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: Verify install-script allowlist (supply-chain)
        run: node "$GITHUB_WORKSPACE/scripts/install-scripts-allowlist.mjs"


      - name: Validate import paths (vi.mock paths must resolve to real files)
        run: node scripts/validate-imports.mjs

      # Vitest globals (`vi`, `describe`, `it`, `expect`) are made available
      # to TypeScript via src/vitest.d.ts  —  no separate test tsconfig needed.
      - name: Restore TypeScript build cache
        uses: actions/cache@v6
        with:
          path: |
            *.tsbuildinfo
            backend/tsconfig.tsbuildinfo
          key: tsb-${{ github.job }}-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: TypeScript compilation check
        run: npm run typecheck

      - name: Save TypeScript build cache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: |
            *.tsbuildinfo
            backend/tsconfig.tsbuildinfo
          key: tsb-${{ github.job }}-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Lint check
        run: npm run lint

      - name: Check locale parity (en/ vs hi/)
        run: node scripts/check-locale-parity.mjs

      # Unit tests run in the parallel frontend-tests matrix (see below).
      # This job intentionally keeps only fast static checks so test shards
      # do not wait behind typecheck + lint. Coverage gates and the badge
      # live in frontend-test-merge after all shard blobs are combined.

  # ── Frontend unit tests: parallel shards with per-shard blob reports ────
  frontend-tests:
    name: Frontend Tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: nodes-ROOT-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nodes-ROOT-${{ runner.os }}-node${{ env.NODE_VERSION }}-
        id: nm-cache

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: Verify install-script allowlist (supply-chain)
        run: node "$GITHUB_WORKSPACE/scripts/install-scripts-allowlist.mjs"

      # Shards each run with coverage enabled so v8 results are embedded in
      # the blob report; frontend-test-merge combines all four and enforces
      # the real thresholds once (per-shard coverage is partial by design,
      # so threshold errors here are expected and ignored).
      - name: Run vitest shard ${{ matrix.shard }}
        run: npx vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=blob --coverage || true

      - name: Upload shard blob report
        uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/
          retention-days: 3
          if-no-files-found: error
          # .vitest-reports is a hidden directory — without this flag the
          # uploader silently matches zero files and the step fails.
          include-hidden-files: true

  # ── Frontend test merge: combines shards, enforces coverage gates ───────
  frontend-test-merge:
    name: Frontend Tests — Merge & Coverage Gates
    runs-on: ubuntu-latest
    needs: [frontend-tests]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: nodes-ROOT-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nodes-ROOT-${{ runner.os }}-node${{ env.NODE_VERSION }}-
        id: nm-cache

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: Verify install-script allowlist (supply-chain)
        run: node "$GITHUB_WORKSPACE/scripts/install-scripts-allowlist.mjs"

      - name: Download all shard blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: vitest-blob-*
          merge-multiple: true
          path: .vitest-reports/

      # Combines all shard blobs (results + v8 coverage) and enforces
      # vitest.config.ts coverage thresholds in one place. Fails the job if
      # any shard failed or any coverage metric drops below threshold.
      - name: Merge shard reports and check coverage
        run: npx vitest --merge-reports --reporter=json --coverage
        env:
          NODE_ENV: test

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 14

      # Post coverage summary to the GitHub Actions job summary (visible in
      # the Actions UI itself, not just on PRs). Reads the already-generated
      # coverage/coverage-summary.json — no need to re-run tests.
      - name: Post coverage summary to job summary
        if: always()
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('coverage/coverage-summary.json','utf8'));
            const t = p.total;
            const fmt = (o) => o.pct + '% (' + o.covered + '/' + o.total + ')';
            const summary = [
              '### Frontend Coverage',
              '',
              '| Statements | Branches | Functions | Lines |',
              '|------------|----------|-----------|-------|',
              '| ' + fmt(t.statements) + ' | ' + fmt(t.branches) + ' | ' + fmt(t.functions) + ' | ' + fmt(t.lines) + ' |',
              '',
              '> Thresholds: statements 48% | branches 40% | functions 42% | lines 48%',
              ''
            ].join('\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          "

      # Explicit coverage threshold gate — fails the build if any metric
      # drops below the configured minimum. Threshold values are mirrored
      # from vitest.config.ts coverage.thresholds and must be kept in sync.
      - name: Check coverage thresholds
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('coverage/coverage-summary.json','utf8'));
            const t = p.total;
            const thresholds = {
              statements: 48,
              branches: 40,
              functions: 42,
              lines: 48,
            };
            let failed = false;
            for (const [key, threshold] of Object.entries(thresholds)) {
              const actual = t[key].pct;
              const status = actual >= threshold ? 'PASS' : 'FAIL';
              console.log(status + ': ' + key + ' ' + actual + '% (threshold: ' + threshold + '%)');
              if (actual < threshold) failed = true;
            }
            if (failed) {
              console.log('FRONTEND COVERAGE THRESHOLDS NOT MET — failing build');
              process.exit(1);
            }
            console.log('All frontend coverage thresholds met!');
          "

      # Post a coverage summary comment on pull requests
      - name: PR coverage comment
        uses: davelosert/vitest-coverage-report-action@v2
        if: github.event_name == 'pull_request'
        with:
          working-directory: ./

      # Generate shields.io-compatible badge JSON from coverage summary.
      # Uploaded as an artifact so the coverage-badge job can deploy them.
      - name: Generate coverage badge JSON
        if: success() || failure()
        shell: bash
        run: |
          mkdir -p badge-artifact
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "Coverage summary not found — skipping badge generation"
            exit 0
          fi
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('coverage/coverage-summary.json','utf8'));
            const lines = p.total.lines.pct;
            const color = lines >= 90 ? 'brightgreen'
              : lines >= 80 ? 'green'
              : lines >= 70 ? 'yellowgreen'
              : lines >= 60 ? 'yellow'
              : lines >= 50 ? 'orange'
              : 'red';
            const badge = {
              schemaVersion: 1,
              label: 'frontend',
              message: lines + '%',
              color: color,
            };
            fs.writeFileSync('badge-artifact/frontend-coverage.json', JSON.stringify(badge, null, 2) + '\n');
            console.log('Frontend coverage badge: ' + lines + '% (' + color + ')');
          "

      - name: Upload frontend coverage badge
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage-badge
          path: badge-artifact/
          retention-days: 7

  # ── Bundle size guard ──────────────────────────────────────────────────
  # Builds the production JS bundle with `expo export` and compares its size
  # against scripts/bundle-size-baseline-<platform>.json (one baseline per
  # matrix leg). Fails when the bundle grew more than 5% vs the baseline —
  # catching accidental dependency bloat before release. Re-baseline
  # intentionally via `BUNDLE_PLATFORM=<p> npm run bundle:size:update`.
  # PRs get one sticky size comment per platform.
  bundle-size:
    name: Frontend — Bundle Size Guard (${{ matrix.platform }})
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write   # sticky PR comment (fork PRs still get a read-only token — handled below)
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    env:
      BUNDLE_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: nodes-ROOT-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nodes-ROOT-${{ runner.os }}-node${{ env.NODE_VERSION }}-
        id: nm-cache

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      # bundle-size runs `expo export` with the Sentry plugin → the real
      # sentry-cli binary is required, so its allowlisted postinstall runs here.
      - name: Run allowlisted install scripts (sentry-cli needed for export)
        run: node scripts/install-scripts-allowlist.mjs --rebuild --only=root

      - name: Check bundle size vs baseline (max +5%)
        id: bundle-size
        run: npm run bundle:size

      # PR comment: size impact before merge. Sticky comment (identified by a
      # hidden nonce marker) so repeat runs EDIT the same comment instead of
      # spamming one per push. Read-only token: create fails silently on
      # forks without write access; the size check itself already failed the
      # job if the limit was exceeded, so no gate is lost.
      - name: Post bundle size PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}
          PLATFORM: ${{ steps.bundle-size.outputs.platform }}
          BASELINE_MB: ${{ steps.bundle-size.outputs.baseline_mb }}
          CURRENT_MB: ${{ steps.bundle-size.outputs.current_mb }}
          GROWTH_PCT: ${{ steps.bundle-size.outputs.growth_pct }}
          THRESHOLD_PCT: ${{ steps.bundle-size.outputs.threshold_pct }}
          VERDICT: ${{ steps.bundle-size.outputs.verdict }}
        with:
          script: |
            // Per-platform marker: each matrix leg keeps its own sticky comment.
            const marker = `<!-- toroloom-bundle-size-${process.env.MATRIX_PLATFORM} -->`;
            const verdict = process.env.VERDICT === 'fail';
            const growth = Number(process.env.GROWTH_PCT);
            const icon = verdict ? '🔴' : (growth < 0 ? '🟢' : '🟡');
            const sign = growth >= 0 ? '+' : '';
            const body = [
              marker,
              `## ${icon} Bundle size report — ${process.env.PLATFORM}`,
              '',
              `| | Size |`,
              `|---|---|`,
              `| Baseline (${process.env.PLATFORM}) | ${process.env.BASELINE_MB} MB |`,
              `| **This PR** | **${process.env.CURRENT_MB} MB** |`,
              `| Growth | **${sign}${growth.toFixed(2)}%** (limit +${process.env.THRESHOLD_PCT}%) |`,
              '',
              verdict
                ? `⚠️ **Over limit** — check recent dependency additions. Intentional change? Re-baseline with \`npm run bundle:size:update\` and include the updated baseline in this PR.`
                : `Within limit. Baseline: \`scripts/bundle-size-baseline.json\` — update via \`npm run bundle:size:update\` when size changes are intentional.`,
              '',
              `<sub>Updated automatically on every push to this PR.</sub>`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            try {
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
                console.log('Updated existing comment #' + existing.id);
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
                console.log('Created new comment');
              }
            } catch (error) {
              // Fork PRs get a read-only token — commenting is impossible there.
              // The size gate already ran in the previous step, so never mask it.
              console.warn('Could not post PR comment (likely fork PR / read-only token): ' + error.message);
            }

  # ── Backend cross-file isolation test ─────────────────────────────────────
  # Runs all 10 cross-file test files (riskEngine, auditTrail, brokerState,
  # circuitBreaker, wsState — each as File A + File B pairs) in the SAME
  # vitest fork to verify that afterAll cleanup properly isolates each
  # singleton across test file boundaries. This would be a false pass if
  # run with the default pool (separate forks = natural isolation).
  cross-file-isolation:
    name: Backend — Cross-File Isolation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Cache node_modules (backend)
        uses: actions/cache@v6
        with:
          path: backend/node_modules
          key: nodes-BACKEND-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            nodes-BACKEND-${{ runner.os }}-node${{ env.NODE_VERSION }}-
        id: nm-cache

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: Verify install-script allowlist (supply-chain)
        run: node "$GITHUB_WORKSPACE/scripts/install-scripts-allowlist.mjs"


      - name: Run cross-file isolation test (singleFork = same process)
        # All 10 cross-file test files (5 singleton pairs) run in the same
        # fork to verify that afterAll cleanup prevents state leakage
        # between test files.
        run: npx vitest run --config vitest.cross-file.config.ts --reporter=verbose src/__tests__/riskCrossFileA.test.ts src/__tests__/riskCrossFileB.test.ts src/__tests__/auditCrossFileA.test.ts src/__tests__/auditCrossFileB.test.ts src/__tests__/brokerCrossFileA.test.ts src/__tests__/brokerCrossFileB.test.ts src/__tests__/circuitCrossFileA.test.ts src/__tests__/circuitCrossFileB.test.ts src/__tests__/wsCrossFileA.test.ts src/__tests__/wsCrossFileB.test.ts
        env:
          NODE_ENV: test

  # ── Backend integration tests (PostgreSQL + MongoDB) ─────────────────────
  backend-integration:
    name: Backend — Integration (PG + Mongo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false

    # Service containers — GitHub Actions makes them reachable via localhost
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: toroloom
          POSTGRES_PASSWORD: toroloom_dev
          POSTGRES_DB: toroloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toroloom -d toroloom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mongodb:
        image: mongo:7-jammy
        env:
          MONGO_INITDB_ROOT_USERNAME: toroloom
          MONGO_INITDB_ROOT_PASSWORD: toroloom_dev
          MONGO_INITDB_DATABASE: toroloom
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet -u toroloom -p toroloom_dev --authenticationDatabase admin --eval 'db.adminCommand(\"ping\")' || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Cache node_modules (backend)
        uses: actions/cache@v6
        with:
          path: backend/node_modules
          key: nodes-BACKEND-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            nodes-BACKEND-${{ runner.os }}-node${{ env.NODE_VERSION }}-
        id: nm-cache

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: Verify install-script allowlist (supply-chain)
        run: node "$GITHUB_WORKSPACE/scripts/install-scripts-allowlist.mjs"


      # Integration tests share databases (MongoDB/PostgreSQL) and
      # singletons (riskEngine, auditTrail).  fileParallelism: false is
      # already set in vitest.config.ts, so there's no need for a CLI flag.
      - name: Run integration tests (PostgreSQL + MongoDB)
        run: npx vitest run --reporter=verbose src/__tests__/*.int.test.ts
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://toroloom:toroloom_dev@localhost:5432/toroloom
          MONGODB_URI: mongodb://toroloom:toroloom_dev@localhost:27017/toroloom?authSource=admin
          MONGODB_DB_NAME: toroloom_test
          # Conservative connect timeout for slow GitHub Actions runners
          CONNECT_TIMEOUT_MS: 25000

  # ── Backend stress test (long-running, independent job) ───────────────────
  # Runs in parallel with backend + frontend + integration. No `needs`
  # dependency because it compiles its own TypeScript via vitest.
  stress:
    name: Backend — WebSocket Stress
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Cache node_modules (backend)
        uses: actions/cache@v6
        with:
          path: backend/node_modules
          key: nodes-BACKEND-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            nodes-BACKEND-${{ runner.os }}-node${{ env.NODE_VERSION }}-
        id: nm-cache

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: Verify install-script allowlist (supply-chain)
        run: node "$GITHUB_WORKSPACE/scripts/install-scripts-allowlist.mjs"


      - name: Run WebSocket PnL bridge stress test
        run: npx vitest run --reporter=verbose src/__tests__/websocketPnLBridge.stress.test.ts
        env:
          NODE_ENV: test
        timeout-minutes: 25

  # ── E2E Tests (Maestro on Android emulator) ───────────────────────────────
  # Runs Maestro E2E flows against an Android emulator via Expo Go.
  #
  # IMPORTANT: The committed Maestro config.yaml targets appId
  # `com.anonymous.Toroloom` (for dev builds). But CI runs via
  # `npx expo start --android` which opens in Expo Go (appId:
  # `host.exp.exponent`). We override the appId via `--app-id` so
  # the flows work against Expo Go in CI.
  #
  # For testing against dev builds locally, use:
  #   npx expo run:android && maestro test .maestro/flows
  #
  # ── E2E — Maestro (Android) Full Suite (master/main only) ────────────────
  # Runs ALL 12 Maestro flows on the default branch for comprehensive coverage.
  # Uses `continue-on-error: true` because full E2E is flaky in CI; failures
  # are logged but don't block the build. For fast PR-level feedback, see the
  # e2e-pr job below.
  #
  # Uses ubuntu-latest with KVM hardware acceleration (GitHub has supported
  # hardware-accelerated Android virtualization on standard Linux runners
  # since April 2024). macos-13 was previously used but has been RETIRED by
  # GitHub (Dec 2025) — jobs on it queue forever waiting for a runner.
  #
  # KVM is enabled via the "Enable KVM" step before booting the emulator.
  #
  # Stabilization levers (ACTIVE today, no code changes needed):
  #   - Repo VARIABLE E2E_RUNNER_LABELS -> run on a self-hosted KVM runner
  #     (Settings -> Secrets and variables -> Actions -> Variables).
  #   - Repo SECRET MAESTRO_CLOUD_API_KEY -> flows run on Maestro Cloud;
  #     the local emulator (primary flake source) is skipped entirely.
  # Unset => GitHub-hosted emulator (default).
  # ───────────────────────────────────────────────────────────────────────
  e2e:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    name: E2E — Full Suite (master)
    # Override via repo variable, e.g. [self-hosted, linux, kvm] for stable
    # hardware KVM. Falls back to the GitHub-hosted runner when unset.
    runs-on: ${{ vars.E2E_RUNNER_LABELS || 'ubuntu-latest' }}
    # 90 min: the release gradle build took 33 min cold on CI (vs ~4 min
    # locally) and boot + smoke gate + 31 flows need ~35 more. A 60-min cap
    # cancelled the run mid-retry (both attempts of 059d3d5 died at exactly
    # the job timeout, long after the app itself was proven healthy).
    timeout-minutes: 90
    continue-on-error: true
    env:
      MAESTRO_CLOUD_API_KEY: ${{ secrets.MAESTRO_CLOUD_API_KEY || '' }}
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: nodes-ROOT-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nodes-ROOT-${{ runner.os }}-node${{ env.NODE_VERSION }}-
        id: nm-cache

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: Verify install-script allowlist (supply-chain)
        run: node "$GITHUB_WORKSPACE/scripts/install-scripts-allowlist.mjs"


      - name: Install Maestro CLI
        run: |
          # Download the install script to a temp file instead of piping to bash
          curl -fsSL "https://get.maestro.mobile.dev" -o /tmp/maestro_install.sh
          # Verify the download succeeded and is non-empty
          if [ ! -s /tmp/maestro_install.sh ]; then
            echo 'ERROR: Maestro install script download failed or is empty'
            exit 1
          fi
          # Execute the verified script
          bash /tmp/maestro_install.sh
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
        shell: bash

      - name: Validate Maestro flows
        run: |
          maestro --version
          echo "Checking flow files..."
          for f in .maestro/flows/**/*.yaml; do
            echo "  ✓ $f"
          done

      - name: Verify E2E secrets are configured
        shell: bash
        run: |
          if [ -z "${{ secrets.TEST_EMAIL }}" ] || [ -z "${{ secrets.TEST_PASSWORD }}" ]; then
            echo "::error::TEST_EMAIL and/or TEST_PASSWORD secrets are not configured."
            echo "::error::Go to: Settings → Secrets and variables → Actions → New repository secret"
            echo "::error::Add both TEST_EMAIL and TEST_PASSWORD before running E2E tests."
            exit 1
          fi
          echo "E2E secrets are configured."

      # Enable KVM hardware acceleration on the Linux runner so the Android
      # emulator can use -accel on (same acceleration macOS HAXM provided).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # Gradle caches: dependency downloads + compiled intermediates. The
      # cold release build measured 33 min on CI; a warm cache cuts it to a
      # fraction, which is what leaves room for boot + flows under the cap.
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/app/build/intermediates
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'gradle.properties', 'package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Wrapped in Wandalen/wretry.action so if the emulator boot times out,
      # it is retried once automatically before failing the step.
      # Maestro Cloud fast-path: when MAESTRO_CLOUD_API_KEY is configured,
      # no local emulator is booted at all. The release APK is built with
      # plain gradle (JS bundle embedded, no device needed) and handed to
      # Maestro Cloud along with the full flow suite; devices, boot and
      # retries are their problem, not a shared GitHub runner's.
      # Self-heal: the test account lives only in the production DB. If the
      # database was reset/recreated (e.g. the Postgres volume restore), every
      # Maestro flow would otherwise die on the login step with a generic
      # "Invalid credentials" error. Login first; on any failure attempt a
      # signup with the same creds so the account is always present.
      - name: Ensure E2E test account exists
        env:
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: |
          set -e
          BASE="${EXPO_PUBLIC_API_URL%/}"
          echo "Ensuring E2E test account on ${BASE} ..."
          STATUS=$(curl -s -o /tmp/login_resp.json -w "%{http_code}" --max-time 30 \
            -X POST "$BASE/auth/login" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$TEST_EMAIL\",\"password\":\"$TEST_PASSWORD\"}") || STATUS=000
          if [ "$STATUS" = "200" ]; then
            echo "Test account already exists (login 200)."
          else
            echo "Login returned $STATUS — attempting signup (self-heal after DB reset)..."
            SU=$(curl -s -o /tmp/signup_resp.json -w "%{http_code}" --max-time 30 \
              -X POST "$BASE/auth/signup" -H 'Content-Type: application/json' \
              -d "{\"name\":\"E2E Test User\",\"email\":\"$TEST_EMAIL\",\"phone\":\"9999999999\",\"password\":\"$TEST_PASSWORD\"}") || SU=000
            if [ "$SU" = "200" ] || [ "$SU" = "201" ]; then
              echo "Test account created via signup ($SU)."
            elif grep -qiE "already|exists|duplicate" /tmp/signup_resp.json 2>/dev/null; then
              echo "::error::Account exists but login failed — credentials drift between secrets and DB."
              exit 1
            else
              echo "::error::Cannot ensure test account. login=$STATUS signup=$SU body=$(head -c 200 /tmp/signup_resp.json 2>/dev/null)"
              exit 1
            fi
          fi

      - name: Build release APK and run full suite on Maestro Cloud
        if: env.MAESTRO_CLOUD_API_KEY != ''
        id: cloud
        env:
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          # Release builds BAKE this in at build time (App.tsx configureApi).
          # Without it the APK ships with baseUrl='' and every API call fails
          # instantly → login never completes → 31/31 flows element-not-found.
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: |
          cd android && ./gradlew :app:assembleRelease -x lint
          cd ..
          maestro cloud \
            --appFile android/app/build/outputs/apk/release/app-release.apk \
            --env TEST_EMAIL="$TEST_EMAIL" \
            --env TEST_PASSWORD="$TEST_PASSWORD" \
            .maestro
      - name: Boot Android emulator and run E2E full suite (retry once on failure)
        # Skipped entirely when Maestro Cloud is configured (see cloud step).
        if: env.MAESTRO_CLOUD_API_KEY == ''
        id: emu
        env:
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          # Baked into the release JS bundle at build time — see cloud step note.
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: reactivecircus/android-emulator-runner@v2
          attempt_limit: 2
          attempt_delay: 5000
          with: |
            api-level: 34
            target: google_apis
            arch: x86_64
            avd-name: pixel
            profile: pixel
            # KVM is enabled by default on GitHub-hosted Linux runners; the
            # 'Enable KVM' step above grants /dev/kvm access. The action's
            # KVM control input is disable-linux-hw-accel (default false = ON).
            # Boot tuning: smaller 'pixel' AVD, -accel auto (falls back if KVM
            # unavailable), -gpu auto (swiftshader on headless), -no-metrics.
            emulator-boot-timeout: 900
            emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu auto -accel auto -memory 1536 -cores 2 -no-metrics
            disable-animations: true
            # Boot/Maestro logic lives in .github/scripts/e2e-boot.sh
            # (standalone file) — inline multi-line scripts with embedded
            # single-quoted bash -c blocks get mangled by wretry.action's
            # YAML-string re-parsing ("Syntax error: expecting done").
            # The script builds the RELEASE APK (embedded JS bundle) and
            # launches it directly — no Metro/dev-client launcher, which
            # previously wedged blank in the headless emulator.
            script: |
              bash .github/scripts/e2e-boot.sh .maestro

      # Failure evidence: the boot script dumps the UI hierarchy + screenshot
      # into the workspace on any non-zero exit. Without this, every opaque
      # "element not found" costs another 40-minute blind run (runs #331-#336).
      - name: Upload E2E failure diagnosis
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-diagnosis-${{ github.run_id }}
          path: |
            e2e-failure.png
            e2e-failure-hierarchy.txt
          if-no-files-found: ignore
          retention-days: 7

      # Soft-fail visibility: this job never blocks the build, but a red
      # E2E must be visible in the run summary — never silently green.
      - name: Record E2E result in run summary
        if: always()
        run: |
          MODE="local emulator (soft-fail, non-blocking)"
          # steps.X.outcome is the literal string 'skipped' for a skipped step,
          # not empty — so test for the exact 'success'/'failure' values only.
          EMU_OUTCOME="${{ steps.emu.outcome || '' }}"
          CLOUD_OUTCOME="${{ steps.cloud.outcome || '' }}"
          RESULT="skipped"
          if [ "$EMU_OUTCOME" = "success" ] || [ "$EMU_OUTCOME" = "failure" ]; then RESULT="$EMU_OUTCOME"; fi
          if [ "$CLOUD_OUTCOME" = "success" ] || [ "$CLOUD_OUTCOME" = "failure" ]; then
            RESULT="$CLOUD_OUTCOME"
            MODE="Maestro Cloud (soft-fail, non-blocking)"
          fi
          if [ "$RESULT" = "failure" ]; then
            echo "::warning::E2E full suite FAILED (soft-fail, non-blocking) — mode: $MODE. See job logs."
            echo "| E2E Full Suite | ❌ failed (soft-fail) | $MODE |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| E2E Full Suite | ✅ $RESULT | $MODE |" >> "$GITHUB_STEP_SUMMARY"
          fi
  # ── E2E — Maestro (Android) PR Critical Flows ───────────────────────────
  # Fast PR-level E2E: runs 5 key flows to catch critical regressions before
  # merge. Blocks the build on failure (continue-on-error: false).
  # Timeout 30 min vs the full suite (90 min) since only essential flows run.
  #
  # Flows executed (in order):
  #   1. smoke/smokeTest.yaml          — Login → Home → Learn → Markets → More → Portfolio → Logout
  #   2. navigation/tabNavigation.yaml  — All 5 bottom tabs load correctly
  #   3. trade/placeOrder.yaml          — Full order placement: Buy/Sell toggle, order types, qty, confirm
  #   4. kyc/bankLinking.yaml           — 3-step bank linking: IFSC verify, account verify, link
  #   5. stock/stockDetail.yaml         — Stock detail: chart, stats, sector context, AI analysis  #   6. settings/twoFactorSetup.yaml   — 2FA setup flow: QR, OTP entry, backup codes
  #   7. trade/fnoOptionsChain.yaml     — F&O Options Chain: strike grid, Greeks, expiry switch
  #   8. ui/calculators.yaml            — SIP Calculator: inputs, calculate, verify results
  #   9. ai/aiInsights.yaml             — AI Insights: market overview, stock analysis cards
  #
  # NOTE: Each flow starts fresh with its own login step. The flows must be
  # self-contained because Maestro does NOT reset app state between flows.
  # ───────────────────────────────────────────────────────────────────────
  e2e-pr:
    if: github.event_name == 'pull_request'
    name: E2E — Critical Flows (PR)
    needs: [frontend, frontend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: false
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: nodes-ROOT-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nodes-ROOT-${{ runner.os }}-node${{ env.NODE_VERSION }}-
        id: nm-cache

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: Verify install-script allowlist (supply-chain)
        run: node "$GITHUB_WORKSPACE/scripts/install-scripts-allowlist.mjs"


      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" -o /tmp/maestro_install.sh
          if [ ! -s /tmp/maestro_install.sh ]; then
            echo 'ERROR: Maestro install script download failed or is empty'
            exit 1
          fi
          bash /tmp/maestro_install.sh
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
        shell: bash

      - name: Validate Maestro PR flows
        run: |
          maestro --version
          for f in \
            .maestro/flows/smoke/smokeTest.yaml \
            .maestro/flows/navigation/tabNavigation.yaml \
            .maestro/flows/trade/placeOrder.yaml \
            .maestro/flows/kyc/bankLinking.yaml \
            .maestro/flows/stock/stockDetail.yaml \
            .maestro/flows/settings/twoFactorSetup.yaml \
            .maestro/flows/trade/fnoOptionsChain.yaml \
            .maestro/flows/ui/calculators.yaml \
            .maestro/flows/ai/aiInsights.yaml; do
            if [ -f "$f" ]; then
              echo "  ✓ $f"
            else
              echo "  ✗ $f not found!"
              exit 1
            fi
          done
          echo "All 9 PR flow files validated."

      - name: Verify E2E secrets are configured
        shell: bash
        run: |
          if [ -z "${{ secrets.TEST_EMAIL }}" ] || [ -z "${{ secrets.TEST_PASSWORD }}" ]; then
            echo "::error::TEST_EMAIL and/or TEST_PASSWORD secrets are not configured."
            echo "::error::Go to: Settings → Secrets and variables → Actions → New repository secret"
            echo "::error::Add both TEST_EMAIL and TEST_PASSWORD before running E2E tests."
            exit 1
          fi
          echo "E2E secrets are configured."

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Boot Android emulator and run E2E critical flows (retry once on failure)
        id: emu
        env:
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: reactivecircus/android-emulator-runner@v2
          attempt_limit: 2
          attempt_delay: 5000
          with: |
            api-level: 34
            target: google_apis
            arch: x86_64
            avd-name: pixel
            profile: pixel
            # KVM is enabled by default on GitHub-hosted Linux runners; the
            # 'Enable KVM' step above grants /dev/kvm access. The action's
            # KVM control input is disable-linux-hw-accel (default false = ON).
            # Boot tuning: smaller 'pixel' AVD, -accel auto (falls back if KVM
            # unavailable), -gpu auto (swiftshader on headless), -no-metrics.
            emulator-boot-timeout: 900
            emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu auto -accel auto -memory 1536 -cores 2 -no-metrics
            disable-animations: true
            # Boot/Maestro logic lives in .github/scripts/e2e-boot.sh
            # (standalone file) — inline multi-line scripts with embedded
            # single-quoted bash -c blocks get mangled by wretry.action's
            # YAML-string re-parsing ("Syntax error: expecting done").
            # The script builds the RELEASE APK (embedded JS bundle) and
            # launches it directly — no Metro/dev-client launcher, which
            # previously wedged blank in the headless emulator.
            script: |
              bash .github/scripts/e2e-boot.sh .maestro/flows/smoke/smokeTest.yaml .maestro/flows/navigation/tabNavigation.yaml .maestro/flows/trade/placeOrder.yaml .maestro/flows/kyc/bankLinking.yaml .maestro/flows/stock/stockDetail.yaml .maestro/flows/settings/twoFactorSetup.yaml .maestro/flows/trade/fnoOptionsChain.yaml .maestro/flows/ui/calculators.yaml .maestro/flows/ai/aiInsights.yaml
      # e2e-pr BLOCKS builds; surface the gate in the run summary too so
      # merge decisions are auditable at a glance.
      - name: Record E2E result in run summary
        if: always()
        run: |
          RESULT="${{ steps.emu.outcome || 'skipped' }}"
          if [ "$RESULT" = "failure" ]; then
            echo "| E2E Critical Flows (PR) | ❌ failed (BLOCKING) | local emulator |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| E2E Critical Flows (PR) | ✅ $RESULT | local emulator |" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Coverage badge deployment ────────────────────────────────────────────
  # Runs after frontend and backend (with their coverage data) finish.
  # Downloads the badge JSONs generated by each job and deploys them to the
  # gh-pages branch so shields.io can read them via raw GitHub URLs.
  coverage-badge:
    name: Coverage Badge
    runs-on: ubuntu-latest
    needs: [frontend-test-merge, backend]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download frontend coverage badge
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage-badge
          path: badges/

      - name: Download backend coverage badge
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage-badge
          path: badges/

      - name: Deploy badges to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./badges
          destination_dir: badges
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

  # ── Dependency vulnerability gate ─────────────────────────────────────────
  # Fails the build when a NEW high/critical CVE appears in the production
  # dependencies of either workspace (root Expo app / backend API). Packages
  # that are build-time-only tooling (Metro bundler chain) are explicitly
  # allowlisted with reasons in scripts/audit-gate.mjs — new runtime deps are
  # never allowlisted silently. The full tree (dev deps included) fails on
  # critical. Runs from package-lock.json alone — no installs, ~30s.
  # Mark this job as a required status check in branch protection so no PR
  # can merge with a fresh vulnerability.
  dependency-audit:
    name: Dependency Audit Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify lockfile integrity (registry-only, sha512)
        run: npm run verify:lockfile

      - name: Run dependency audit gate
        id: audit-gate
        env:
          AUDIT_REPORT_PATH: audit-report.json
        run: npm run audit:gate

      # PR comment: exactly which CVEs appeared, so reviewers see the security
      # impact before merging. Sticky comment (hidden nonce marker) — repeat
      # runs EDIT the same comment instead of spamming one per push. Runs with
      # always() so a FAILING gate still gets its comment posted; the verdict
      # itself is carried by the gate step above and is never masked here.
      - name: Post dependency audit PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let report = null;
            try {
              report = JSON.parse(fs.readFileSync('audit-report.json', 'utf8'));
            } catch {
              // Gate crashed before writing a report (exit 2 = fail-closed).
              // The job is already red from the gate step — say so plainly.
              report = null;
            }
            const verdict = report ? report.verdict : 'fail';
            const icon = verdict === 'pass' ? '🟢' : '🔴';
            const marker = '<!-- toroloom-dependency-audit -->';
            const lines = [marker, `## ${icon} Dependency audit — ${verdict === 'pass' ? 'no blocking CVEs' : 'blocking CVEs found'}`, ''];
            if (report) {
              for (const ws of report.workspaces) {
                const total = ws.blocking.length;
                const status = total === 0 ? '✅' : '❌';
                lines.push(`### ${status} ${ws.label}`);
                lines.push('');
                lines.push('| Severity | Package | Range | Advisory |');
                lines.push('|---|---|---|---|');
                if (total === 0) {
                  lines.push('| — | no blocking vulnerabilities | — | — |');
                } else {
                  for (const b of ws.blocking) {
                    lines.push(`| ${b.severity.toUpperCase()} | \`${b.name}\` | \`${b.range}\` | ${b.via} |`);
                  }
                }
                lines.push('');
                if (ws.allowlisted.length) {
                  lines.push(`<details><summary>${ws.allowlisted.length} build-time-only packages allowlisted (never in runtime)</summary>`);
                  lines.push('');
                  lines.push(ws.allowlisted.map((n) => `- \`${n}\``).join('\n'));
                  lines.push('</details>');
                  lines.push('');
                }
                if (ws.errors.length) {
                  lines.push(`⚠️ audit errors: ${ws.errors.join('; ')}`);
                  lines.push('');
                }
              }
              const blockingTotal = report.workspaces.reduce((n, w) => n + w.blocking.length, 0);
              if (blockingTotal > 0) {
                lines.push('**To unblock:** fix with `npm audit fix` / `package.json` overrides, or — only for build-time-only tooling — add to `ALLOW_HIGH` in `scripts/audit-gate.mjs` with a reason.');
                lines.push('');
              }
            } else {
              lines.push('⚠️ The audit gate crashed before producing a report (fail-closed). Check the job log for the underlying audit error.');
              lines.push('');
            }
            // Sticky comment: find the previous run's comment and EDIT it.
            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              const existing = comments.find((c) => c.body && c.body.includes(marker));
              const body = lines.join('\n');
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
                console.log('Updated existing audit comment #' + existing.id);
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
                console.log('Created new audit comment');
              }
            } catch (error) {
              // Fork PRs get a read-only token — commenting is impossible there.
              // The gate already ran, so never mask its verdict with this error.
              console.warn('Could not post PR comment (likely fork PR / read-only token): ' + error.message);
            }
