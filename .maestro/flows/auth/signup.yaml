# =============================================================================
# Signup Flow
# =============================================================================
# Tests the signup screen: navigates from Login → Signup, fills in all
# fields (including the mandatory Terms acceptance), taps "Create Account",
# and verifies the user lands on the Home screen.
#
# Run-12 evidence: keyboard-dismissal strategy is load-bearing. pressKey
# BACK (with the keyboard up) worked in both attempts, while the hideKeyboard
# flows (deepLink x2) died at "No visible element found: signup-terms-checkbox"
# — hideKeyboard no-ops after number-pad inputs and leaves the row scrolled
# under the keyboard. Use BACK here and in every runFlow-refill below.
#
# Uses testID-based targeting for i18n-independent robustness. The signup
# email is made unique at runtime via evalScript so re-runs don't collide
# with an account persisted by a previous run.
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# Start from the Login screen and navigate to Signup
- tapOn:
    text: "Sign Up"

# Wait for the Signup screen to load — use testID to confirm
- assertVisible:
    id: "signup-name-input"

# Generate a unique email so repeated runs never hit 409 email-exists
# (inline evalScript — runScript rejects every path form on Maestro 2.6.0
# with "Config Field Required", which killed the whole suite)
- evalScript: ${output.SIGNUP_EMAIL = "e2e.maestro." + Date.now() + "@toroloom-test.com"}

# Fill in Full Name
- tapOn:
    id: "signup-name-input"
- inputText: "Rahul Sharma"
- hideKeyboard

# Fill in Email
- tapOn:
    id: "signup-email-input"
- inputText: ${SIGNUP_EMAIL}
- hideKeyboard

# Fill in Phone
- tapOn:
    id: "signup-phone-input"
- inputText: "9876543210"
- hideKeyboard

# Fill in Password
- tapOn:
    id: "signup-password-input"
- inputText: "Secure@123"
- hideKeyboard

# Fill in Confirm Password
- tapOn:
    id: "signup-confirm-password-input"
- inputText: "Secure@123"

# Dismiss keyboard so the Terms row and submit button are reachable.
# pressKey BACK is the reliable dismiss (hideKeyboard can no-op with the
# keyboard up and its swallow leaves scroll gestures dead); the keyboard IS
# open right after the last input, so BACK closes it instead of popping the
# screen. BACK (keyboard-up) is the ONLY dismissal that ever worked here —
# see the run-12 evidence note in the header.
- pressKey: BACK
- waitForAnimationToEnd:
    timeout: 2000

# Defensive: if BACK no-oped (keyboard already dismissed), hideKeyboard
# catches the fallthrough. NEVER add a bare pressKey BACK beyond this —
# with the keyboard closed it pops the Signup screen (run-11 lesson).

# ── Mandatory Terms acceptance (added in the legal-consent release) ─────
# The checkbox sits below the form; scroll to it explicitly
- scrollUntilVisible:
    element:
      id: "signup-terms-checkbox"
    direction: DOWN
    speed: 20
    timeout: 30000
- tapOn:
    id: "signup-terms-checkbox"

# Tap "Create Account" button
- tapOn:
    id: "signup-btn"
- waitForAnimationToEnd:
    timeout: 10000

# If the backend rate-limited the POST (the whole suite logs in ~25+ times
# from one IP; authLimiter = 10 req / 15 min), the form shows an inline
# error and stays put. Cool down past the limiter window and resubmit.
# NOTE: waitForAnimationToEnd returns INSTANTLY when no animation is
# running — it is not a sleep. evalScript busy-waits for a real cooldown.
# Each retry is a separate top-level runFlow so a failing step can never
# abort the remaining retries (a fatal command inside runFlow kills the
# whole flow — run 36221684269's lesson).
# ── Terminal landing recovery (2 run-12 attempts died here) ─────────────
# If the home-greeting never appeared (signup 5m15s both attempts), the
# user IS registered (every POST got through) but the app failed to land:
# re-launch once, dismiss the possible late onboarding walkthrough, and
# tap the Home tab. Everything is guarded so this can never make things
# worse (a fatal command inside runFlow kills the whole flow).
- runFlow:
    when:
      notVisible:
        id: "home-greeting"
    commands:
      - runFlow:
          when:
            visible:
              text: "Skip"
          commands:
            - tapOn:
                text: "Skip"
            - waitForAnimationToEnd:
                timeout: 5000
      - runFlow:
          when:
            visible:
              id: "tab-home"
          commands:
            - tapOn:
                id: "tab-home"
      - waitForAnimationToEnd:
          timeout: 5000
      - runFlow:
          when:
            notVisible:
              id: "home-greeting"
          commands:
            - launchApp
            - waitForAnimationToEnd:
                timeout: 15000
            - runFlow:
                when:
                  visible:
                    text: "Skip"
                commands:
                  - tapOn:
                      text: "Skip"
                  - waitForAnimationToEnd:
                      timeout: 5000
      - runFlow:
          when:
            visible:
              id: "tab-home"
          commands:
            - tapOn:
                id: "tab-home"
            - waitForAnimationToEnd:
                timeout: 5000

- runFlow:
    when:
      visible:
        id: "signup-btn"
    commands:
      - evalScript: ${output.COOLDOWN_A = (function(ms){var e=Date.now()+ms;while(Date.now()<e);return 1;})(65000)}
      - scrollUntilVisible:
          element:
            id: "signup-btn"
          direction: DOWN
          speed: 20
          timeout: 20000
      - tapOn:
          id: "signup-btn"
      - waitForAnimationToEnd:
          timeout: 10000
- runFlow:
    when:
      visible:
        id: "signup-btn"
    commands:
      - evalScript: ${output.COOLDOWN_B = (function(ms){var e=Date.now()+ms;while(Date.now()<e);return 1;})(65000)}
      - scrollUntilVisible:
          element:
            id: "signup-btn"
          direction: DOWN
          speed: 20
          timeout: 20000
      - tapOn:
          id: "signup-btn"
      - waitForAnimationToEnd:
          timeout: 10000
- runFlow:
    when:
      visible:
        id: "signup-btn"
    commands:
      - evalScript: ${output.COOLDOWN_C = (function(ms){var e=Date.now()+ms;while(Date.now()<e);return 1;})(65000)}
      - scrollUntilVisible:
          element:
            id: "signup-btn"
          direction: DOWN
          speed: 20
          timeout: 20000
      - tapOn:
          id: "signup-btn"
      - waitForAnimationToEnd:
          timeout: 10000

# Fresh installs show the onboarding walkthrough after signup — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000

# After successful signup, the user is logged in and sees the Home screen
# (the signup POST can be slow on a cold backend — wait generously)
- extendedWaitUntil:
    visible:
      id: "home-greeting"
    timeout: 60000
# A lazy tab can hide Home behind another tab on a cold emulator — tap the
# Home tab explicitly and wait once more.
- runFlow:
    when:
      notVisible:
        id: "home-greeting"
    commands:
      - runFlow:
          when:
            visible:
              id: "tab-home"
          commands:
            - tapOn:
                id: "tab-home"
            - extendedWaitUntil:
                visible:
                  id: "home-greeting"
                timeout: 60000

# ── Run-14 evidence: logout race after a successful signup ─────────────
# Both run-14 attempts ended with the flow on the LOGIN screen while the
# signup had gone through (all cooldown probes were SKIPPED — no stuck
# form) and the failure-time dump showed login-welcome-back. A post-signup
# bootstrap request lost the race against the auth-rate limiter and its
# 401/429 hit the logout interceptor. Recovery: re-login with the SAME
# just-registered credentials (guarded, so a healthy landing is untouched).
- runFlow:
    when:
      notVisible:
        id: "home-greeting"
    commands:
      - runFlow:
          when:
            visible:
              id: "login-email-input"
          commands:
            # Run-15 evidence: the re-login guard probed BEFORE the late
            # logout landed (dump: login screen AFTER all guards ran
            # SKIPPED) — so first WAIT for the Login screen to actually
            # appear, then fill it.
            - extendedWaitUntil:
                visible:
                  id: "login-welcome-back"
                timeout: 90000
            - tapOn:
                id: "login-email-input"
            - inputText: ${SIGNUP_EMAIL}
            - hideKeyboard
            - tapOn:
                id: "login-password-input"
            - inputText: "Secure@123"
            - hideKeyboard
            - tapOn:
                id: "login-btn"
            - waitForAnimationToEnd:
                timeout: 10000
            # The login POST can ALSO hit the same limiter window — one
            # real cooldown (waitForAnimationToEnd is not a sleep), then
            # resubmit from whatever state the form is in.
            - runFlow:
                when:
                  notVisible:
                    id: "home-greeting"
                commands:
                  - evalScript: ${output.SIGNUP_RELOGIN_COOLDOWN = (function(ms){var e=Date.now()+ms;while(Date.now()<e);return 1;})(65000)}
                  - runFlow:
                      when:
                        visible:
                          id: "login-btn"
                      commands:
                        - tapOn:
                            id: "login-btn"
                        - waitForAnimationToEnd:
                            timeout: 10000
            - runFlow:
                when:
                  visible:
                    text: "Skip"
                commands:
                  - tapOn:
                      text: "Skip"
                  - waitForAnimationToEnd:
                      timeout: 5000
            - runFlow:
                when:
                  visible:
                    id: "tab-home"
                commands:
                  - tapOn:
                      id: "tab-home"
                  - waitForAnimationToEnd:
                      timeout: 5000
