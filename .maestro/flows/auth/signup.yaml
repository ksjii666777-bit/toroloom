# =============================================================================
# Signup Flow
# =============================================================================
# Tests the signup screen: navigates from Login → Signup, fills in all
# fields (including the mandatory Terms acceptance), taps "Create Account",
# and verifies the user lands on the Home screen.
#
# Uses testID-based targeting for i18n-independent robustness. The signup
# email is made unique at runtime via evalScript so re-runs don't collide
# with an account persisted by a previous run.
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# Start from the Login screen and navigate to Signup
- tapOn:
    text: "Sign Up"

# Wait for the Signup screen to load — use testID to confirm
- assertVisible:
    id: "signup-name-input"

# Generate a unique email so repeated runs never hit 409 email-exists
# (inline evalScript — runScript rejects every path form on Maestro 2.6.0
# with "Config Field Required", which killed the whole suite)
- evalScript: ${output.SIGNUP_EMAIL = "e2e.maestro." + Date.now() + "@toroloom-test.com"}

# Fill in Full Name
- tapOn:
    id: "signup-name-input"
- inputText: "Rahul Sharma"
- hideKeyboard

# Fill in Email
- tapOn:
    id: "signup-email-input"
- inputText: ${SIGNUP_EMAIL}
- hideKeyboard

# Fill in Phone
- tapOn:
    id: "signup-phone-input"
- inputText: "9876543210"
- hideKeyboard

# Fill in Password
- tapOn:
    id: "signup-password-input"
- inputText: "Secure@123"
- hideKeyboard

# Fill in Confirm Password
- tapOn:
    id: "signup-confirm-password-input"
- inputText: "Secure@123"

# Dismiss keyboard so the Terms row and submit button are reachable.
# pressKey BACK is the reliable dismiss (hideKeyboard can no-op with the
# keyboard up and its swallow leaves scroll gestures dead); the keyboard IS
# open right after the last input, so BACK closes it instead of popping the
# screen.
- pressKey: BACK
- waitForAnimationToEnd:
    timeout: 2000

# ── Mandatory Terms acceptance (added in the legal-consent release) ─────
# The checkbox sits below the form; scroll to it explicitly
- scrollUntilVisible:
    element:
      id: "signup-terms-checkbox"
    direction: DOWN
    speed: 20
    timeout: 30000
- tapOn:
    id: "signup-terms-checkbox"

# Tap "Create Account" button
- tapOn:
    id: "signup-btn"

# Wait for signup to process
- waitForAnimationToEnd:
    timeout: 10000

# Fresh installs show the onboarding walkthrough after signup — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000

# After successful signup, the user is logged in and sees the Home screen
# (the signup POST can be slow on a cold backend — wait generously)
- extendedWaitUntil:
    visible:
      id: "home-greeting"
    timeout: 45000
