# =============================================================================
# Login Flow
# =============================================================================
# Tests the login screen: fills in email + password, taps "Log In", and
# verifies the user lands on the Home screen.
#
# Uses testID-based targeting for i18n-independent robustness.
# Falls back to text-based targeting for non-i18n elements (stock symbols).
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# Wait for the login screen to load — target the app name text
- assertVisible:
    id: "login-email-input"

# Fill in email field
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
# Dismiss the keyboard so the password field is visible
- hideKeyboard

# Fill in password field
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}

# Dismiss the keyboard so the Log In button is visible
- hideKeyboard

# Tap the "Log In" button
- tapOn:
    id: "login-btn"

# Wait for navigation + home screen loading skeleton (600ms) + render
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000

# Navigate to the Home tab
- tapOn:
    text: "Home"

# Wait for Home screen to render
- waitForAnimationToEnd:
    timeout: 5000

# Assert the Home screen is visible after login
- assertVisible:
    text: "Markets"
