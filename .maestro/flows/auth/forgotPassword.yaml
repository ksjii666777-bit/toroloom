# =============================================================================
# Forgot Password — Edge Case Flow
# =============================================================================
# Tests that tapping "Forgot Password?" on the login screen keeps the app
# in a stable state (no crashes, navigation errors, or blank screens).
# The current implementation shows an Alert dialog — verify it appears and
# that dismissing it returns to a fully functional login screen.
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── Verify login screen is ready ──────────────────────────────────────────
# Cold-start can be slow on the cloud emulator — wait up to 60s
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- assertVisible:
    text: "Forgot Password?"

# ── Tap the Forgot Password link ─────────────────────────────────────────
- tapOn:
    text: "Forgot Password?"

# ── The app shows an Alert with reset guidance — dismiss it ──────────────
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible:
        text: "OK"
    commands:
      - tapOn:
          text: "OK"
      - waitForAnimationToEnd:
          timeout: 3000

# Confirm key login screen elements are still present
# Cold-start can be slow on the cloud emulator — wait up to 60s
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- assertVisible:
    text: "Log In"
# "Don't have an account? Sign In" is ONE text node (nested suffix) —
# a full-node regex matches it; a bare "Sign In" match does NOT exist.
- assertVisible:
    text: "Don't have an account?.*"
- assertVisible:
    text: "Enter your email"
- assertVisible:
    text: "Enter your password"
