# =============================================================================
# Universal Link → Signup Flow (CI runs the scheme-equivalent route)
# =============================================================================
# The CI emulator has no verified-domain association (assetlinks.json points
# at the PRODUCTION domain and needs a Play-Store-signed build), so https
# links open the browser there. This flow drives the SAME React Navigation
# signup route through the custom scheme, then verifies the referral param,
# full registration (incl. mandatory Terms), and the Home landing.
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 1. Pre-warm + open the link ───────────────────────────────────────────
# Cold-start deep-link delivery is racy: if the link lands before the JS
# bundle finishes loading it is dropped. Launch once, wait for the login
# screen (bundle ready), then re-open — React Navigation re-processes it.
- launchApp
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- openLink: toroloom://signup?ref=test123

# ── 2. Wait for the Signup screen to load (lazy screen chunk) ─────────────
- extendedWaitUntil:
    visible:
      id: "signup-name-input"
    timeout: 45000
- assertVisible:
    text: "Start your investment journey today"

# Verify we did NOT land on the Login screen (universal link worked correctly)
# (commented out — with cold-start pre-warm the login screen can still be in
#  the back stack; the Signup assertions above prove the link resolved)
# - assertNotVisible:
#     id: "login-welcome-back"

# ── 3. Verify the referral badge is visible ────────────────────────────────
# The badge reads "🎉 Referred by test123" — confirms route.params.ref was
# received from the universal link and passed to the Signup screen.
- extendedWaitUntil:
    visible:
      text: "🎉 Referred by test123"
    timeout: 20000

# ── 4. Generate a unique email (no 409 collisions on re-runs) ─────────────
# Inline evalScript — runScript rejects every path form on Maestro 2.6.0
# with "Config Field Required", which killed the whole suite.
- evalScript: ${output.SIGNUP_EMAIL = "e2e.uni." + Date.now() + "@toroloom-test.com"}

# ── 5. Fill in Full Name ──────────────────────────────────────────────────
- tapOn:
    text: "Enter your full name"
- inputText: "Priya Patel"

# ── 6. Fill in Email ──────────────────────────────────────────────────────
# testID-based fill (placeholder taps race the keyboard on cloud emulators)
- tapOn:
    id: "signup-email-input"
- inputText: ${SIGNUP_EMAIL}
- hideKeyboard

# ── 7. Fill in Phone ──────────────────────────────────────────────────────
- tapOn:
    text: "Enter your phone number"
- inputText: "8765432109"
- hideKeyboard

# ── 8. Fill in Password ───────────────────────────────────────────────────
- tapOn:
    text: "Create a strong password"
- inputText: "UnivLink@456"
- hideKeyboard

# ── 9. Fill in Confirm Password ───────────────────────────────────────────
- tapOn:
    text: "Re-enter your password"
- inputText: "UnivLink@456"

# ── 10. Dismiss the keyboard ──────────────────────────────────────────────
- hideKeyboard

# ── 11. Mandatory Terms acceptance ────────────────────────────────────────
- assertVisible:
    id: "signup-terms-checkbox"
- tapOn:
    id: "signup-terms-checkbox"

# ── 12. Submit the form ──────────────────────────────────────────────────
# Subtitle "{{count}} digits entered 6/6" on this screen is parameterized
# elsewhere — the button text itself is static, so plain-text is safe.
- tapOn:
    text: "Create Account"

# ── 13. Wait for signup to complete ────────────────────────────────────────
- waitForAnimationToEnd:
    timeout: 10000

# Fresh installs show the onboarding walkthrough after signup — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000

# ── 14. Verify navigation to Home screen ──────────────────────────────────
# Signup POST can take a while on the cold backend — wait generously.
- extendedWaitUntil:
    visible:
      id: "home-greeting"
    timeout: 60000
