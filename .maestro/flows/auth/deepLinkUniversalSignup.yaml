# =============================================================================
# Universal Link → Signup Flow (CI runs the scheme-equivalent route)
# =============================================================================
# The CI emulator has no verified-domain association (assetlinks.json points
# at the PRODUCTION domain and needs a Play-Store-signed build), so https
# links open the browser there. This flow drives the SAME React Navigation
# signup route through the custom scheme, then verifies the referral param,
# full registration (incl. mandatory Terms), and the Home landing.
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 1. Pre-warm + open the link ───────────────────────────────────────────
# Cold-start deep-link delivery is racy: if the link lands before the JS
# bundle finishes loading it is dropped. Launch once, wait for the login
# screen (bundle ready), then re-open — React Navigation re-processes it.
- launchApp
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- openLink: toroloom://signup?ref=test123

# ── 2. Wait for the Signup screen to load (lazy screen chunk) ─────────────
- extendedWaitUntil:
    visible:
      id: "signup-name-input"
    timeout: 45000
- assertVisible:
    text: "Start your investment journey today"

# Verify we did NOT land on the Login screen (universal link worked correctly)
# (commented out — with cold-start pre-warm the login screen can still be in
#  the back stack; the Signup assertions above prove the link resolved)
# - assertNotVisible:
#     id: "login-welcome-back"

# ── 3. Verify the referral badge is visible ────────────────────────────────
# The badge reads "🎉 Referred by test123" — confirms route.params.ref was
# received from the universal link and passed to the Signup screen.
- extendedWaitUntil:
    visible:
      text: "🎉 Referred by test123"
    timeout: 20000

# ── 4. Generate a unique email (no 409 collisions on re-runs) ─────────────
# Inline evalScript — runScript rejects every path form on Maestro 2.6.0
# with "Config Field Required", which killed the whole suite.
- evalScript: ${output.SIGNUP_EMAIL = "e2e.uni." + Date.now() + "@toroloom-test.com"}

# ── 5. Fill in Full Name ──────────────────────────────────────────────────
- tapOn:
    text: "Enter your full name"
- inputText: "Priya Patel"
- hideKeyboard

# ── 6. Fill in Email ──────────────────────────────────────────────────────
# testID-based fill (placeholder taps race the keyboard on cloud emulators)
- tapOn:
    id: "signup-email-input"
- inputText: ${output.SIGNUP_EMAIL}
- hideKeyboard

# ── 7. Fill in Phone ──────────────────────────────────────────────────────
- tapOn:
    text: "Enter your phone number"
- inputText: "8765432109"
- hideKeyboard
# Number-pad keyboards can swallow hideKeyboard — settle before the next field
- waitForAnimationToEnd:
    timeout: 2000

# ── 8. Fill in Password ───────────────────────────────────────────────────
- tapOn:
    text: "Create a strong password"
- inputText: "UnivLink@456"
- hideKeyboard

# ── 9. Fill in Confirm Password ───────────────────────────────────────────
- tapOn:
    text: "Re-enter your password"
- inputText: "UnivLink@456"
- hideKeyboard

# pressKey BACK is the reliable dismiss (hideKeyboard can no-op with the
# keyboard up and its swallow leaves scroll gestures dead) — the keyboard
# IS open right after the last input, so BACK closes it, not the screen.
# Run-12 evidence: signup.yaml (BACK dismissal) reached the checkbox in
# BOTH attempts; both deepLink flows (hideKeyboard dismissal) died at
# "No visible element found: signup-terms-checkbox".
- pressKey: BACK
- waitForAnimationToEnd:
    timeout: 2000

# ── 11. Mandatory Terms acceptance ──────────────────────────────────────
# The checkbox sits below the form; if the keyboard is still up, one more
# BACK closes it (defensive: hideKeyboard catches the no-BACK fallthrough).
- runFlow:
    when:
      notVisible:
        id: "signup-terms-checkbox"
    commands:
      - hideKeyboard
      - waitForAnimationToEnd:
          timeout: 2000
# NO extra pressKey BACK here — with the keyboard already closed BACK
# pops the Signup screen (run 11: both deepLink flows died exactly
# there, hunting the checkbox on the Login screen for 30s). The
# dismissal ABOVE runs while the keyboard is still up, which is why
# BACK is safe there and dangerous here.
# If the checkbox is still missing, the extra BACK dismissed the KEYBOARD
# and then POPPED the Signup screen (pressed the header back-arrow) —
# reopen the deep link and refill the form.
# ⚠️ Run-18 (36383942937) root cause: this openLink must NEVER run while
# the user is already REGISTERED and logged in — the app's logged-in deep-
# link handler records the referral again and raises the blocking
# "🎉 Referral Applied" Alert over Home (both failure-time dumps showed
# exactly that modal). A past BACK-pop already means the FIRST signup
# POST succeeded, so just relaunch and let the healthy-landing lattice
# below finish the flow.
- runFlow:
    when:
      notVisible:
        id: "signup-terms-checkbox"
    commands:
      # Run-19 evidence: launchApp here is DESTRUCTIVE — att2 relaunch
      # killed the UNSENT form (fresh launch showed Login → the trailing
      # checkbox tap died) and att1's relaunch hung 7 min into the 420s
      # flow budget. Disambiguate the two known states instead:
      #   • Login screen visible → BACK already popped Signup and the
      #     signup POST never fired → re-open the deep link (SAFE: not
      #     logged in, so no Referral-Alert race — run-18's lesson) and
      #     refill the whole form.
      #   • Still on the Signup form → the checkbox is merely below the
      #     fold → scroll to it (signup.yaml's proven pattern).
      - runFlow:
          when:
            visible:
              id: "login-welcome-back"
          commands:
            - openLink: toroloom://signup?ref=test123
            - extendedWaitUntil:
                visible:
                  id: "signup-name-input"
                timeout: 45000
            - tapOn:
                id: "signup-name-input"
            - inputText: "Priya Patel"
            - hideKeyboard
            - evalScript: ${output.SIGNUP_EMAIL2 = "e2e.uni." + Date.now() + "@toroloom-test.com"}
            - tapOn:
                id: "signup-email-input"
            - inputText: ${output.SIGNUP_EMAIL2}
            - hideKeyboard
            - tapOn:
                text: "Enter your phone number"
            - inputText: "8765432109"
            - hideKeyboard
            - waitForAnimationToEnd:
                timeout: 2000
            - tapOn:
                text: "Create a strong password"
            - inputText: "UnivLink@456"
            - hideKeyboard
            - tapOn:
                text: "Re-enter your password"
            - inputText: "UnivLink@456"
            - hideKeyboard
            - waitForAnimationToEnd:
                timeout: 2000
      - runFlow:
          when:
            visible:
              id: "signup-name-input"
          commands:
            # Plain scroll first: scrollUntilVisible's 100%-visibility
            # criterion can reject a partially clipped bottom row.
            - scroll
            - waitForAnimationToEnd:
                timeout: 2000
            - scrollUntilVisible:
                element:
                  id: "signup-terms-checkbox"
                direction: DOWN
                speed: 20
                timeout: 20000
      # Run-21 evidence (36448830643, both attempts): the keyboard-guard
      # BACK above ran with the keyboard ALREADY closed — it popped the
      # Signup screen, and a deep-link screen carries no back stack, so
      # the app fell to the LAUNCHER (failure dump = home launcher; no
      # Login, no signup form). Both branches above skipped and the fatal
      # checkbox tap killed the flow. Relaunch (the app is idle here —
      # nothing being typed, so the run-19 mid-typing-relaunch hang does
      # not apply), then reopen the link (SAFE: the signup POST never
      # fired, so no run-18 Referral-Alert race) and refill the fresh
      # form. Handles BOTH relaunch outcomes: resumed onto the old form
      # (name-input already visible → openLink skipped) or fresh Login.
      - runFlow:
          when:
            notVisible:
              id: "signup-name-input"
          commands:
            - launchApp
            - waitForAnimationToEnd:
                timeout: 10000
            - runFlow:
                when:
                  visible:
                    id: "login-welcome-back"
                commands:
                  - openLink: toroloom://signup?ref=test123
            - runFlow:
                when:
                  notVisible:
                    id: "signup-name-input"
                commands:
                  - openLink: toroloom://signup?ref=test123
            - extendedWaitUntil:
                visible:
                  id: "signup-name-input"
                timeout: 45000
            - tapOn:
                id: "signup-name-input"
            - inputText: "Priya Patel"
            - hideKeyboard
            - evalScript: ${output.SIGNUP_EMAIL4 = "e2e.uni." + Date.now() + "@toroloom-test.com"}
            - tapOn:
                id: "signup-email-input"
            - inputText: ${output.SIGNUP_EMAIL4}
            - hideKeyboard
            - tapOn:
                text: "Enter your phone number"
            - inputText: "8765432109"
            - hideKeyboard
            - waitForAnimationToEnd:
                timeout: 2000
            - tapOn:
                text: "Create a strong password"
            - inputText: "UnivLink@456"
            - hideKeyboard
            - tapOn:
                text: "Re-enter your password"
            - inputText: "UnivLink@456"
            - hideKeyboard
            - waitForAnimationToEnd:
                timeout: 2000
            - scrollUntilVisible:
                element:
                  id: "signup-terms-checkbox"
                direction: DOWN
                speed: 20
                timeout: 20000
      # Run-16 evidence: a BACK here never had a keyboard to close — the
      # inputTexts above are tap-based refills with no live focus, so the
      # pressKey dismissed the SCREEN instead. Do NOT press BACK here.
# (Run-14 evidence: the scroll-when-still-missing recovery here was a
# top-level FATAL scroll — when the app process died mid-form, it turned
# a recoverable launchApp restart into an instant flow kill before any
# retry could run, and the flow ended on the device launcher. Recovery
# lives in the keyboard-guard above AND in the guarded pre-submit block
# below; the tapOn after that block is the final gate.)
# Run-21 (36448830643, both attempts): the bare tapOn used to run BEFORE
# the third-state recovery — with Signup already popped to the launcher
# it died with "Element not found" and the recovery never executed. The
# guarded recovery now comes FIRST: a no-op whenever the checkbox is
# already on screen; otherwise it relaunches the IDLE app (nothing being
# typed — the run-19 mid-typing-relaunch hang does not apply here),
# reopens the link (SAFE: the signup POST never fired, so no run-18
# Referral-Alert race) and refills the fresh form, handling both relaunch
# outcomes (resumed onto the old form vs fresh Login).
- runFlow:
    when:
      notVisible:
        id: "signup-terms-checkbox"
    commands:
      - launchApp
      - waitForAnimationToEnd:
          timeout: 10000
      - runFlow:
          when:
            visible:
              id: "login-welcome-back"
          commands:
            - openLink: toroloom://signup?ref=test123
      - runFlow:
          when:
            notVisible:
              id: "signup-name-input"
          commands:
            - openLink: toroloom://signup?ref=test123
      - extendedWaitUntil:
          visible:
            id: "signup-name-input"
          timeout: 45000
      - tapOn:
          id: "signup-name-input"
      - inputText: "Priya Patel"
      - hideKeyboard
      - evalScript: ${output.SIGNUP_EMAIL3 = "e2e.uni." + Date.now() + "@toroloom-test.com"}
      - tapOn:
          id: "signup-email-input"
      - inputText: ${output.SIGNUP_EMAIL3}
      - hideKeyboard
      - tapOn:
          text: "Enter your phone number"
      - inputText: "8765432109"
      - hideKeyboard
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          text: "Create a strong password"
      - inputText: "UnivLink@456"
      - hideKeyboard
      - tapOn:
          text: "Re-enter your password"
      - inputText: "UnivLink@456"
      - hideKeyboard
      - waitForAnimationToEnd:
          timeout: 2000
      - scrollUntilVisible:
          element:
            id: "signup-terms-checkbox"
          direction: DOWN
          speed: 20
          timeout: 20000
- tapOn:
    id: "signup-terms-checkbox"

# ── 12. Submit the form ──────────────────────────────────────────────────
# Subtitle "{{count}} digits entered 6/6" on this screen is parameterized
# elsewhere — the button text itself is static, so plain-text is safe.
# (Run-21 moved the third-state pre-submit recovery ABOVE the fatal tap;
# see the guarded block before it.)
- tapOn:
    text: "Create Account"

# ── 13. Wait for signup to complete ────────────────────────────────────────
- waitForAnimationToEnd:
    timeout: 10000

# If the backend rate-limited the POST (the suite logs in ~25+ times from
# one IP; authLimiter = 10 req / 15 min), the form shows an inline error
# and stays put. waitForAnimationToEnd is NOT a sleep (it returns instantly
# when no animation runs) — evalScript busy-waits for a real cooldown.
- runFlow:
    when:
      visible:
        text: "Create Account"
    commands:
      - evalScript: ${output.UNI_COOLDOWN_A = (function(ms){var e=Date.now()+ms;while(Date.now()<e);return 1;})(65000)}
      - scrollUntilVisible:
          element:
            text: "Create Account"
          direction: DOWN
          speed: 20
          timeout: 20000
      - tapOn:
          text: "Create Account"
      - waitForAnimationToEnd:
          timeout: 10000
- runFlow:
    when:
      visible:
        text: "Create Account"
    commands:
      - evalScript: ${output.UNI_COOLDOWN_B = (function(ms){var e=Date.now()+ms;while(Date.now()<e);return 1;})(65000)}
      - scrollUntilVisible:
          element:
            text: "Create Account"
          direction: DOWN
          speed: 20
          timeout: 20000
      - tapOn:
          text: "Create Account"
      - waitForAnimationToEnd:
          timeout: 10000

# Fresh installs show the onboarding walkthrough after signup — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000

# Run-18 evidence: a repeated deep link after signup raises the blocking
# "🎉 Referral Applied" Alert over Home — dismiss it if present (its
# confirm button text is "AWESOME!"; title/label text is also matched).
- runFlow:
    when:
      visible:
        text: "AWESOME!"
    commands:
      - tapOn:
          text: "AWESOME!"
      - waitForAnimationToEnd:
          timeout: 5000
- runFlow:
    when:
      visible:
        text: ".*Referral Applied.*"
    commands:
      - tapOn:
          text: "AWESOME!"
      - waitForAnimationToEnd:
          timeout: 5000

# The onboarding walkthrough can late-mount AFTER the gates above (run 11:
# signup died exactly here, with Skip covering the landing screen) —
# handle it once more before the final landing wait.
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# ── 14. Verify navigation to Home screen ──────────────────────────────────
# Signup POST can take a while on the cold backend — wait generously.
- extendedWaitUntil:
    visible:
      id: "home-greeting"
    timeout: 60000
