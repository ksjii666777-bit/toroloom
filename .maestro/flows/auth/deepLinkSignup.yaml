# =============================================================================
# Deep Link → Signup Flow
# =============================================================================
# Opens toroloom://signup?ref=test123 via a deep link, verifies the Signup
# screen loads correctly, fills in all registration fields (including the
# mandatory Terms acceptance), submits the form, and confirms the user
# lands on the Home screen.
#
# This validates:
#   1. Custom scheme deep link handling (toroloom://)
#   2. React Navigation linking config resolves 'signup' path to SignupScreen
#   3. route.params.ref is received and passed to signup()
#   4. Full registration flow works from a deep-link origin
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 1. Pre-warm + open the deep link ───────────────────────────────────────
# Cold-start deep-link delivery is racy: if the link lands before the JS
# bundle finishes loading it is dropped. Launch once, wait for the login
# screen (bundle ready), then re-open — React Navigation re-processes it.
- launchApp
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- openLink: toroloom://signup?ref=test123

# ── 2. Wait for the Signup screen to load (lazy screen chunk) ─────────────
- extendedWaitUntil:
    visible:
      id: "signup-name-input"
    timeout: 45000
- assertVisible:
    text: "Start your investment journey today"

# Verify we did NOT land on the Login screen (deep link worked correctly)
# (commented out — with cold-start pre-warm the login screen can still be in
#  the back stack; the Signup assertions above prove the link resolved)
# - assertNotVisible:
#     id: "login-welcome-back"

# ── 3. Verify the referral badge is visible ────────────────────────────────
# The badge reads "🎉 Referred by test123" — confirms route.params.ref was
# received from the deep link and passed to the Signup screen.
- extendedWaitUntil:
    visible:
      text: "🎉 Referred by test123"
    timeout: 20000

# ── 4. Generate a unique email (no 409 collisions on re-runs) ─────────────
# Inline evalScript — runScript rejects every path form on Maestro 2.6.0
# with "Config Field Required", which killed the whole suite.
- evalScript: ${output.SIGNUP_EMAIL = "e2e.dl." + Date.now() + "@toroloom-test.com"}

# ── 5. Fill in Full Name ──────────────────────────────────────────────────
- tapOn:
    text: "Enter your full name"
- inputText: "Rahul Sharma"
- hideKeyboard

# ── 6. Fill in Email ──────────────────────────────────────────────────────
# testID-based fill (placeholder taps race the keyboard on cloud emulators)
- tapOn:
    id: "signup-email-input"
- inputText: ${output.SIGNUP_EMAIL}
- hideKeyboard

# ── 7. Fill in Phone ──────────────────────────────────────────────────────
- tapOn:
    text: "Enter your phone number"
- inputText: "9876543210"
- hideKeyboard
# Number-pad keyboards can swallow hideKeyboard — settle before the next field
- waitForAnimationToEnd:
    timeout: 2000

# ── 8. Fill in Password ───────────────────────────────────────────────────
- tapOn:
    text: "Create a strong password"
- inputText: "Secure@123"
- hideKeyboard

# ── 9. Fill in Confirm Password ───────────────────────────────────────────
- tapOn:
    text: "Re-enter your password"
- inputText: "Secure@123"

# pressKey BACK with the keyboard STILL OPEN closes the keyboard (proven
# signup.yaml main-path pattern). Run-16 evidence: hideKeyboard BEFORE the
# BACK left BACK with nothing to dismiss, so it popped the deep-linked
# screen — deep links carry no back stack, the app backgrounded, and the
# checkbox tap found the launcher (both attempts, empty crash buffer).
- pressKey: BACK
- waitForAnimationToEnd:
    timeout: 2000

# ── 11. Mandatory Terms acceptance ──────────────────────────────────────
# The checkbox sits below the form; if the keyboard is still up, one more
# BACK closes it (defensive: hideKeyboard catches the no-BACK fallthrough).
- runFlow:
    when:
      notVisible:
        id: "signup-terms-checkbox"
    commands:
      - hideKeyboard
      - waitForAnimationToEnd:
          timeout: 2000
# NO extra pressKey BACK here — with the keyboard already closed BACK
# pops the Signup screen (run 11: both deepLink flows died exactly
# there, hunting the checkbox on the Login screen for 30s). The
# dismissal ABOVE runs while the keyboard is still up, which is why
# BACK is safe there and dangerous here.
# If the checkbox is still missing, the extra BACK dismissed the KEYBOARD
# and then POPPED the Signup screen (pressed the header back-arrow).
# ⚠️ Run-18 lesson (from the universal flow): openLink re-entry is only
# safe while NOT yet logged in — after a successful signup POST the
# logged-in handler raises the blocking "Referral Applied" Alert. The
# empty-commands form relaunches instead; the landing lattice below
# finishes the flow.
- runFlow:
    when:
      notVisible:
        id: "signup-terms-checkbox"
    commands:
      # Run-19 evidence (from the universal flow): launchApp here is
      # DESTRUCTIVE — a relaunch kills the UNSENT form and lands on
      # Login, and a cold relaunch can hang for minutes. Disambiguate
      # instead: Login visible → BACK popped Signup and the POST never
      # fired → re-open the deep link (SAFE while logged out) and refill;
      # form still present → just scroll the checkbox into view.
      - runFlow:
          when:
            visible:
              id: "login-welcome-back"
          commands:
            - openLink: toroloom://signup?ref=test123
            - extendedWaitUntil:
                visible:
                  id: "signup-name-input"
                timeout: 45000
            - tapOn:
                id: "signup-name-input"
            - inputText: "Rahul Sharma"
            - hideKeyboard
            - evalScript: ${output.SIGNUP_EMAIL2 = "e2e.dl." + Date.now() + "@toroloom-test.com"}
            - tapOn:
                id: "signup-email-input"
            - inputText: ${output.SIGNUP_EMAIL2}
            - hideKeyboard
            - tapOn:
                text: "Enter your phone number"
            - inputText: "9876543210"
            - hideKeyboard
            - waitForAnimationToEnd:
                timeout: 2000
            - tapOn:
                text: "Create a strong password"
            - inputText: "Secure@123"
            - hideKeyboard
            - tapOn:
                text: "Re-enter your password"
            - inputText: "Secure@123"
            - hideKeyboard
            - waitForAnimationToEnd:
                timeout: 2000
      - runFlow:
          when:
            visible:
              id: "signup-name-input"
          commands:
            # Plain scroll first: scrollUntilVisible's 100%-visibility
            # criterion can reject a partially clipped bottom row.
            - scroll
            - waitForAnimationToEnd:
                timeout: 2000
            - scrollUntilVisible:
                element:
                  id: "signup-terms-checkbox"
                direction: DOWN
                speed: 20
                timeout: 20000
      # Run-21 evidence (universal flow, 36448830643): the keyboard-guard
      # BACK above can run with the keyboard ALREADY closed — it pops the
      # Signup screen and the app falls to the LAUNCHER (no Login, no
      # signup form; both recovery branches above skip and the fatal
      # checkbox tap dies). Relaunch the IDLE app, reopen the link (SAFE:
      # the signup POST never fired, so no run-18 Referral-Alert race) and
      # refill the fresh form. Handles both relaunch outcomes: resumed
      # onto the old form (openLink skipped) or fresh Login.
      - runFlow:
          when:
            notVisible:
              id: "signup-name-input"
          commands:
            - launchApp
            - waitForAnimationToEnd:
                timeout: 10000
            - runFlow:
                when:
                  visible:
                    id: "login-welcome-back"
                commands:
                  - openLink: toroloom://signup?ref=test123
            - runFlow:
                when:
                  notVisible:
                    id: "signup-name-input"
                commands:
                  - openLink: toroloom://signup?ref=test123
            - extendedWaitUntil:
                visible:
                  id: "signup-name-input"
                timeout: 45000
            - tapOn:
                id: "signup-name-input"
            - inputText: "Rahul Sharma"
            - hideKeyboard
            - evalScript: ${output.SIGNUP_EMAIL4 = "e2e.dl." + Date.now() + "@toroloom-test.com"}
            - tapOn:
                id: "signup-email-input"
            - inputText: ${output.SIGNUP_EMAIL4}
            - hideKeyboard
            - tapOn:
                text: "Enter your phone number"
            - inputText: "9876543210"
            - hideKeyboard
            - waitForAnimationToEnd:
                timeout: 2000
            - tapOn:
                text: "Create a strong password"
            - inputText: "Secure@123"
            - hideKeyboard
            - tapOn:
                text: "Re-enter your password"
            - inputText: "Secure@123"
            - hideKeyboard
            - waitForAnimationToEnd:
                timeout: 2000
            - scrollUntilVisible:
                element:
                  id: "signup-terms-checkbox"
                direction: DOWN
                speed: 20
                timeout: 20000
      # Run-16 evidence: this BACK never had a keyboard to close — the
      # inputTexts above are tap-based refills with no live focus, so the
      # pressKey dismissed the SCREEN instead. Deep links carry no back
      # stack, so the app went to the BACKGROUND and the checkbox tap
      # found the launcher in BOTH attempts (crash buffer was empty —
      # no crash, just a backgrounded app). Do NOT press BACK here.
# (Run-14 evidence: the scroll-when-still-missing recovery here was a
# top-level FATAL scroll — when the app process died mid-form, it turned
# a recoverable launchApp restart into an instant flow kill before any
# retry could run, and the flow ended on the device launcher. Recovery
# lives in the keyboard-guard above AND in the guarded pre-submit block
# below; the tapOn after that block is the final gate.)
# Run-21 (universal flow): the bare tapOn used to run BEFORE any
# third-state recovery — with Signup already popped to the launcher it
# died with "Element not found". The guarded recovery below comes FIRST:
# a no-op whenever the checkbox is already on screen; otherwise it
# relaunches the IDLE app (nothing being typed — the run-19
# mid-typing-relaunch hang does not apply), reopens the link (SAFE: the
# signup POST never fired, so no run-18 Referral-Alert race) and refills
# the fresh form, handling both relaunch outcomes (resumed old form vs
# fresh Login).
- runFlow:
    when:
      notVisible:
        id: "signup-terms-checkbox"
    commands:
      - launchApp
      - waitForAnimationToEnd:
          timeout: 10000
      - runFlow:
          when:
            visible:
              id: "login-welcome-back"
          commands:
            - openLink: toroloom://signup?ref=test123
      - runFlow:
          when:
            notVisible:
              id: "signup-name-input"
          commands:
            - openLink: toroloom://signup?ref=test123
      - extendedWaitUntil:
          visible:
            id: "signup-name-input"
          timeout: 45000
      - tapOn:
          id: "signup-name-input"
      - inputText: "Rahul Sharma"
      - hideKeyboard
      - evalScript: ${output.SIGNUP_EMAIL3 = "e2e.dl." + Date.now() + "@toroloom-test.com"}
      - tapOn:
          id: "signup-email-input"
      - inputText: ${output.SIGNUP_EMAIL3}
      - hideKeyboard
      - tapOn:
          text: "Enter your phone number"
      - inputText: "9876543210"
      - hideKeyboard
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          text: "Create a strong password"
      - inputText: "Secure@123"
      - hideKeyboard
      - tapOn:
          text: "Re-enter your password"
      - inputText: "Secure@123"
      - hideKeyboard
      - waitForAnimationToEnd:
          timeout: 2000
      - scrollUntilVisible:
          element:
            id: "signup-terms-checkbox"
          direction: DOWN
          speed: 20
          timeout: 20000
- tapOn:
    id: "signup-terms-checkbox"

# ── 12. Submit the form ────────────────────────────────────────────────────
# (Run-21: the guarded third-state recovery now runs ABOVE this fatal tap
# instead of after it.)
- tapOn:
    text: "Create Account"

# ── 13. Wait for signup to complete ────────────────────────────────────────
- waitForAnimationToEnd:
    timeout: 10000

# If the backend rate-limited the POST (the suite logs in ~25+ times from
# one IP; authLimiter = 10 req / 15 min), the form shows an inline error
# and stays put. waitForAnimationToEnd is NOT a sleep (it returns instantly
# when no animation runs) — evalScript busy-waits for a real cooldown.
- runFlow:
    when:
      visible:
        text: "Create Account"
    commands:
      - evalScript: ${output.DL_COOLDOWN_A = (function(ms){var e=Date.now()+ms;while(Date.now()<e);return 1;})(65000)}
      - scrollUntilVisible:
          element:
            text: "Create Account"
          direction: DOWN
          speed: 20
          timeout: 20000
      - tapOn:
          text: "Create Account"
      - waitForAnimationToEnd:
          timeout: 10000
- runFlow:
    when:
      visible:
        text: "Create Account"
    commands:
      - evalScript: ${output.DL_COOLDOWN_B = (function(ms){var e=Date.now()+ms;while(Date.now()<e);return 1;})(65000)}
      - scrollUntilVisible:
          element:
            text: "Create Account"
          direction: DOWN
          speed: 20
          timeout: 20000
      - tapOn:
          text: "Create Account"
      - waitForAnimationToEnd:
          timeout: 10000

# Fresh installs show the onboarding walkthrough after signup — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000

# Run-18 evidence: a repeated deep link after signup raises the blocking
# "🎉 Referral Applied" Alert over Home — dismiss it if present (confirm
# button text is "AWESOME!"; the wildcard guard catches the title too).
- runFlow:
    when:
      visible:
        text: "AWESOME!"
    commands:
      - tapOn:
          text: "AWESOME!"
      - waitForAnimationToEnd:
          timeout: 5000
- runFlow:
    when:
      visible:
        text: ".*Referral Applied.*"
    commands:
      - tapOn:
          text: "AWESOME!"
      - waitForAnimationToEnd:
          timeout: 5000

# The onboarding walkthrough can late-mount AFTER the gates above (run 11:
# signup died exactly here, with Skip covering the landing screen) —
# handle it once more before the final landing wait.
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# ── 14. Verify navigation to Home screen ──────────────────────────────────
- extendedWaitUntil:
    visible:
      id: "home-greeting"
    timeout: 60000
