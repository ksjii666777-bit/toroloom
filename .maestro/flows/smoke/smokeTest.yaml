# =============================================================================
# Full Smoke Test
# =============================================================================
# A comprehensive smoke test covering the critical user flows:
# 1. Login
# 2. Quick action navigation (Buy, Learn)
# 3. Markets search
# 4. Stock detail
# 5. More screen → Add Funds flow
# 6. Logout
# =============================================================================

# NOTE: Use com.anonymous.Toroloom for dev builds.
# Change to host.exp.exponent when running via Expo Go.
appId: com.anonymous.Toroloom
---
# ── 1. Login ───────────────────────────────────────────────────────────────
- assertVisible:
    id: "login-email-input"
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Navigate to Home tab
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000

# ── 2. Home Screen — Verify portfolio card and quick actions are visible ───
- assertVisible:
    id: "home-greeting"
- assertVisible:
    id: "home-portfolio-label"
- assertVisible:
    id: "home-quick-markets"
- assertVisible:
    id: "home-quick-learn"

# Tap "Learn" quick action to navigate to Learn screen
- tapOn:
    id: "home-quick-learn"
- waitForAnimationToEnd
- assertVisible:
    id: "learn-title"

# Go back to Home via tab
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd
- assertVisible:
    id: "home-greeting"

# ── 3. Markets — Test search ──────────────────────────────────────────────
- tapOn:
    id: "tab-markets"
- waitForAnimationToEnd
- assertVisible:
    id: "markets-title"

# Verify market indices are visible
- assertVisible:
    text: "NIFTY 50"
- assertVisible:
    text: "BSE Sensex"

# ── 4. More Screen — Quick Actions ────────────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- assertVisible:
    id: "more-title"

# Verify key menu items are present
- assertVisible:
    text: "Fund Dashboard"
- assertVisible:
    text: "Mutual Funds"
- assertVisible:
    text: "Trade History"
- scrollUntilVisible:
    element:
      text: "Help & Support"
    direction: DOWN
- assertVisible:
    text: "Help & Support"

# ── 5. Portfolio Screen ────────────────────────────────────────────────────
- tapOn:
    id: "tab-portfolio"
- waitForAnimationToEnd
- assertVisible:
    id: "portfolio-title"
- assertVisible:
    id: "portfolio-invested"
- assertVisible:
    id: "portfolio-current-value"
- assertVisible:
    id: "portfolio-total-returns"

# ── 6. Logout ──────────────────────────────────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Log Out"
    direction: DOWN
- assertVisible:
    text: "Log Out"
- tapOn: "Log Out"
- waitForAnimationToEnd:
    timeout: 3000

# Verify we're back on the login screen
- assertVisible:
    text: "Welcome Back! 👋"
- assertVisible:
    text: "Don't have an account?"
