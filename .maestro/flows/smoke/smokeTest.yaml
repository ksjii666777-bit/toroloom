# =============================================================================
# Full Smoke Test
# =============================================================================
# A comprehensive smoke test covering the critical user flows:
# 1. Login
# 2. Quick action navigation (Buy, Learn)
# 3. Markets search
# 4. Stock detail
# 5. More screen → Add Funds flow
# 6. Logout
# =============================================================================

# NOTE: Use com.toroloom.app for dev builds.
# Change to host.exp.exponent when running via Expo Go.
appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000

# ── 1. Login ───────────────────────────────────────────────────────────────
- assertVisible:
    id: "login-email-input"
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000

# ── Login retry (transient backend blips) ─────────────────────────────────
# A Railway Postgres restart window ("terminating connection due to
# administrator command") returns 5xx for ~a minute; the app maps any
# login failure to a generic error and stays on the login screen. Run
# #335 passed, #336 failed twice exactly like that. So: if we are STILL
# on the login screen, wait for the blip to clear and retry — up to two
# more attempts. extendedWaitUntil notVisible = real cool-down that
# early-exits the moment login lands.
- runFlow:
    when:
      visible:
        id: "login-btn"
    commands:
      - extendedWaitUntil:
          notVisible:
            id: "login-btn"
          timeout: 20000
      - runFlow:
          when:
            visible:
              id: "login-btn"
          commands:
            - tapOn:
                id: "login-btn"
            - extendedWaitUntil:
                notVisible:
                  id: "login-btn"
                timeout: 30000
            - runFlow:
                when:
                  visible:
                    id: "login-btn"
                commands:
                  - tapOn:
                      id: "login-btn"
                  - extendedWaitUntil:
                      notVisible:
                        id: "login-btn"
                      timeout: 30000

# Second onboarding/offline pass — the lazy onboarding screen can mount
# AFTER the first check on a cold emulator (run #336: first check
# skipped, tab bar then unreachable behind the walkthrough).
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000

# Navigate to Home tab — give the post-login screens up to 30s to settle
# before tapping (lazy screens mount asynchronously on cold emulators).
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 30000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000

# ── 2. Home Screen — Verify portfolio card and quick actions are visible ───
- assertVisible:
    id: "home-greeting"
- assertVisible:
    id: "home-portfolio-label"
- assertVisible:
    id: "home-quick-markets"
- assertVisible:
    id: "home-quick-learn"

# Tap "Learn" quick action to navigate to Learn screen
- tapOn:
    id: "home-quick-learn"
- waitForAnimationToEnd
- assertVisible:
    id: "learn-title"

# Learn is a stack screen (no tab bar) — use Android back to return
- back
- waitForAnimationToEnd
- assertVisible:
    id: "home-greeting"

# ── 3. Markets — Test search ──────────────────────────────────────────────
- tapOn:
    id: "tab-markets"
- waitForAnimationToEnd
- assertVisible:
    id: "markets-title"

# Verify market indices are visible (screens render shortNames NIFTY / SENSEX)
- assertVisible:
    text: "NIFTY"
- assertVisible:
    text: "SENSEX"

# ── 4. More Screen — Quick Actions ────────────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- assertVisible:
    id: "more-title"

# Verify key menu items are present (via testIDs — i18n-safe). The menu
# scrolls, so scroll each into view before asserting.
# NOTE: scroll targets must be in STRICT MENU ORDER (top → bottom):
#   TradeHistory (trading section) → FundsDashboard → MutualFunds (portfolio)
#   → Help (support, last section). scrollUntilVisible only scrolls DOWN —
#   an out-of-order target that sits ABOVE the current viewport can never be
#   found again and the flow dies with "No visible element found" (run #335).
# Off-screen sections are unmounted (removeClippedSubviews) with entering
# animations replaying on re-mount — slow speed + generous timeout lets each
# section mount/settle before the next scroll.
- scrollUntilVisible:
    element:
      id: "menu-TradeHistory"
    direction: DOWN
    speed: 20
    timeout: 60000
- assertVisible:
    id: "menu-TradeHistory"
- scrollUntilVisible:
    element:
      id: "menu-FundsDashboard"
    direction: DOWN
    speed: 20
    timeout: 60000
- assertVisible:
    id: "menu-FundsDashboard"
- scrollUntilVisible:
    element:
      id: "menu-MutualFunds"
    direction: DOWN
    speed: 20
    timeout: 60000
- assertVisible:
    id: "menu-MutualFunds"
- scrollUntilVisible:
    element:
      id: "menu-Help"
    direction: DOWN
    speed: 20
    timeout: 60000
- assertVisible:
    id: "menu-Help"

# ── 5. Portfolio Screen ────────────────────────────────────────────────────
- tapOn:
    id: "tab-portfolio"
- waitForAnimationToEnd
- extendedWaitUntil:
    timeout: 30000
    visible:
      id: "portfolio-title"
- assertVisible:
    id: "portfolio-invested"
- assertVisible:
    id: "portfolio-current-value"
- assertVisible:
    id: "portfolio-total-returns"

# ── 6. Logout ──────────────────────────────────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "more-logout-btn"
    direction: DOWN
    speed: 20
    timeout: 60000
- assertVisible:
    id: "more-logout-btn"
- tapOn:
    id: "more-logout-btn"
- waitForAnimationToEnd:
    timeout: 3000

# Verify we're back on the login screen (signup row is below the fold on
# smaller screens — let the logout transition settle, then scroll it in)
# Cold-start can be slow on the cloud emulator — wait up to 60s
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "login-no-account"
    direction: DOWN
    speed: 20
    timeout: 15000
- assertVisible:
    id: "login-no-account"
