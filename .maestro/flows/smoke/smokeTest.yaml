# =============================================================================
# Full Smoke Test
# =============================================================================
# A comprehensive smoke test covering the critical user flows:
# 1. Login
# 2. Quick action navigation (Buy, Learn)
# 3. Markets search
# 4. Stock detail
# 5. More screen → Add Funds flow
# 6. Logout
# =============================================================================

# NOTE: Use com.toroloom.app for dev builds.
# Change to host.exp.exponent when running via Expo Go.
appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000

# ── 1. Login ───────────────────────────────────────────────────────────────
- assertVisible:
    id: "login-email-input"
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000

# Navigate to Home tab
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000

# ── 2. Home Screen — Verify portfolio card and quick actions are visible ───
- assertVisible:
    id: "home-greeting"
- assertVisible:
    id: "home-portfolio-label"
- assertVisible:
    id: "home-quick-markets"
- assertVisible:
    id: "home-quick-learn"

# Tap "Learn" quick action to navigate to Learn screen
- tapOn:
    id: "home-quick-learn"
- waitForAnimationToEnd
- assertVisible:
    id: "learn-title"

# Learn is a stack screen (no tab bar) — use Android back to return
- back
- waitForAnimationToEnd
- assertVisible:
    id: "home-greeting"

# ── 3. Markets — Test search ──────────────────────────────────────────────
- tapOn:
    id: "tab-markets"
- waitForAnimationToEnd
- assertVisible:
    id: "markets-title"

# Verify market indices are visible (screens render shortNames NIFTY / SENSEX)
- assertVisible:
    text: "NIFTY"
- assertVisible:
    text: "SENSEX"

# ── 4. More Screen — Quick Actions ────────────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- assertVisible:
    id: "more-title"

# Verify key menu items are present (via testIDs — i18n-safe). The menu
# scrolls, so scroll each into view before asserting.
# NOTE: scrolling on this emulator is slow (~350px/s regardless of speed
# setting), and off-screen sections are unmounted (removeClippedSubviews)
# with entering animations replaying on re-mount — use a slow speed and a
# generous timeout so each section can mount/settle before the next scroll.
- scrollUntilVisible:
    element:
      id: "menu-FundsDashboard"
    direction: DOWN
    speed: 20
    timeout: 60000
- assertVisible:
    id: "menu-FundsDashboard"
- scrollUntilVisible:
    element:
      id: "menu-MutualFunds"
    direction: DOWN
    speed: 20
    timeout: 60000
- assertVisible:
    id: "menu-MutualFunds"
- scrollUntilVisible:
    element:
      id: "menu-TradeHistory"
    direction: DOWN
    speed: 20
    timeout: 60000
- assertVisible:
    id: "menu-TradeHistory"
- scrollUntilVisible:
    element:
      id: "menu-Help"
    direction: DOWN
    speed: 20
    timeout: 60000
- assertVisible:
    id: "menu-Help"

# ── 5. Portfolio Screen ────────────────────────────────────────────────────
- tapOn:
    id: "tab-portfolio"
- waitForAnimationToEnd
- assertVisible:
    id: "portfolio-title"
- assertVisible:
    id: "portfolio-invested"
- assertVisible:
    id: "portfolio-current-value"
- assertVisible:
    id: "portfolio-total-returns"

# ── 6. Logout ──────────────────────────────────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "more-logout-btn"
    direction: DOWN
    speed: 20
    timeout: 60000
- assertVisible:
    id: "more-logout-btn"
- tapOn:
    id: "more-logout-btn"
- waitForAnimationToEnd:
    timeout: 3000

# Verify we're back on the login screen (signup row is below the fold on
# smaller screens — let the logout transition settle, then scroll it in)
- assertVisible:
    id: "login-welcome-back"
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "login-no-account"
    direction: DOWN
    speed: 20
    timeout: 15000
- assertVisible:
    id: "login-no-account"
