# =============================================================================
# Behavioural Journal Flow — Trading Psychology
# =============================================================================
# Tests the behavioural journal with dashboard, entries, and reports:
#   1. Login with test credentials
#   2. Navigate: More → Trading Journal (menu label for BehavioralJournal)
#   3. Verify Dashboard tab: metrics, streaks, Emotional Breakdown, Mistakes
#   4. Switch to Entries tab → entry list renders (empty state is valid)
#   5. Switch to Reports tab
#   6. Navigate back
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 1. Login ───────────────────────────────────────────────────────────────
# Cold-start can be slow on the cloud emulator — wait up to 60s
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000

# ── 2. Navigate: More → Trading Journal ─────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd:
    timeout: 10000
# Target the AI-section item by its stable testID — the screen's own header
# repeats the menu label, so text targeting cannot distinguish "navigated"
# from "still on the More menu".
- scrollUntilVisible:
    element:
      id: "menu-trading-psychology"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    id: "menu-trading-psychology"
- waitForAnimationToEnd:
    timeout: 15000

# ── 3/4. Screen mount proof ──────────────────────────────────────────────
# The screen is a lazy chunk. Its SegmentedTabs (Dashboard / Entries /
# Reports) renders unconditionally once mounted, so "Entries" is the one
# unambiguous mount proof — the header title text repeats the More menu
# label and cannot tell "journal screen" from "More menu". One guarded
# re-tap heals a press fired before the lazy chunk wired its pressables;
# every interior step stays NON-fatal (a failing command inside runFlow
# kills the whole flow — run 36221684269's lesson).
- runFlow:
    when:
      notVisible:
        text: "Entries"
    commands:
      - runFlow:
          when:
            visible:
              id: "menu-trading-psychology"
          commands:
            - tapOn:
                id: "menu-trading-psychology"
            - waitForAnimationToEnd:
                timeout: 15000
      - waitForAnimationToEnd:
          timeout: 10000
- assertVisible:
    text: "Entries"
- assertVisible:
    text: "Dashboard"
- assertVisible:
    text: "Reports"

# ── 5. Verify Dashboard Metrics ────────────────────────────────────────────
# Metrics sit below the fold in the Dashboard scroll view — scroll to them
- scrollUntilVisible:
    element:
      text: "Performance Overview"
    direction: DOWN
    speed: 20
    timeout: 30000
- assertVisible:
    text: "Win Rate"
- assertVisible:
    text: "Profit Factor"
- scrollUntilVisible:
    element:
      text: "Plan Compliance"
    direction: DOWN
    speed: 20
    timeout: 30000

# ── 6. Switch to Entries Tab ───────────────────────────────────────────────
- tapOn:
    text: "Entries"
- waitForAnimationToEnd:
    timeout: 10000

# Entries is a FlatList tab — assert its EMPTY-STATE text (a bare "Entries"
# assert adds nothing: the tap above already proved the tab label).
- assertVisible:
    text: "No journal entries yet"

# ── 7. Switch to Reports Tab ───────────────────────────────────────────────
- tapOn:
    text: "Reports"
- waitForAnimationToEnd:
    timeout: 10000

- assertVisible:
    text: "Reports"

# ── 8. Navigate back ───────────────────────────────────────────────────────
# BehavioralJournal pushes as a root-stack screen ABOVE MainTabs — the tab
# bar is covered. Hardware BACK pops to the More tab underneath.
- pressKey: BACK
- waitForAnimationToEnd:
    timeout: 10000
# More keeps its previous scroll offset after BACK (and a re-tap on the
# active tab does not reset it), so more-title can sit OFF-SCREEN — scroll
# it back into view, re-anchoring via the tab bar first.
- runFlow:
    when:
      notVisible:
        id: "more-title"
    commands:
      - tapOn:
          id: "tab-more"
      - waitForAnimationToEnd:
          timeout: 5000
      - scrollUntilVisible:
          element:
            id: "more-title"
          direction: UP
          speed: 20
          timeout: 15000
- assertVisible:
    id: "more-title"
