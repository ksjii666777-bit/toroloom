# =============================================================================
# Behavioural Journal Flow — Trading Psychology
# =============================================================================
# Tests the behavioural journal with dashboard, entries, and reports:
#   1. Login with test credentials
#   2. Navigate: More → Trading Journal (menu label for BehavioralJournal)
#   3. Verify Dashboard tab: metrics, streaks, Emotional Breakdown, Mistakes
#   4. Switch to Entries tab → entry list renders (empty state is valid)
#   5. Switch to Reports tab
#   6. Navigate back
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 1. Login ───────────────────────────────────────────────────────────────
# Cold-start can be slow on the cloud emulator — wait up to 60s
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000

# ── 2. Navigate: More → Trading Journal ─────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Trading Journal"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    text: "Trading Journal"
- waitForAnimationToEnd

# ── 3. Verify Header (menu label repeats as the screen title) ────────────
- assertVisible:
    text: "Behavioural Journal"
- assertVisible:
    text: "Track your trading psychology"

# ── 4. Verify Tab Bar ──────────────────────────────────────────────────────
- assertVisible:
    text: "Dashboard"
- assertVisible:
    text: "Entries"
- assertVisible:
    text: "Reports"

# ── 5. Verify Dashboard Metrics ────────────────────────────────────────────
- assertVisible:
    text: "Performance Overview"
- assertVisible:
    text: "Win Rate"
- assertVisible:
    text: "Profit Factor"
- assertVisible:
    text: "Plan Compliance"
- assertVisible:
    text: "Emotional State Breakdown"

# ── 6. Switch to Entries Tab ───────────────────────────────────────────────
- tapOn:
    text: "Entries"
- waitForAnimationToEnd

# Entries list may be empty for a fresh test account — either way the
# tab must render without crashing (symbol rows or the empty note).
- assertVisible:
    text: "Entries"

# ── 7. Switch to Reports Tab ───────────────────────────────────────────────
- tapOn:
    text: "Reports"
- waitForAnimationToEnd

- assertVisible:
    text: "Reports"

# ── 8. Navigate back ───────────────────────────────────────────────────────
# The screen has no back button; use Android back key
- pressKey: BACK
- waitForAnimationToEnd

- assertVisible:
    id: "more-title"
