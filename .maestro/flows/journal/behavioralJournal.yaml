# =============================================================================
# Behavioural Journal Flow — Trading Psychology
# =============================================================================
# Tests the behavioural journal with dashboard, entries, and reports:
#   1. Login with test credentials
#   2. Navigate: More → Trading Journal (menu label for BehavioralJournal)
#   3. Verify Dashboard tab: metrics, streaks, Emotional Breakdown, Mistakes
#   4. Switch to Entries tab → entry list renders (empty state is valid)
#   5. Switch to Reports tab
#   6. Navigate back
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 1. Login ───────────────────────────────────────────────────────────────
# Cold-start can be slow on the cloud emulator — wait up to 60s
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000

# ── 2. Navigate: More → Trading Journal ─────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Trading Journal"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    text: "Trading Journal"
- waitForAnimationToEnd

# ── 3. Verify Header (menu label repeats as the screen title) ────────────
# Both are lazy-chunk renders — the assert can beat the mount, so wait
- extendedWaitUntil:
    visible:
      text: "Behavioural Journal"
    timeout: 30000
- assertVisible:
    text: "Track your trading psychology"

# ── 4. Verify Tab Bar ──────────────────────────────────────────────────────
# SegmentedTabs labels are plain text nodes; the journal is a lazy-loaded
# chunk, so give it a generous settle window. "Dashboard" is ALSO the More
# menu's Portfolio-Accessories section header visible before the screen
# mounts — accept the journal's own peer tab ("Entries") as the mount proof.
- extendedWaitUntil:
    visible:
      text: "Entries"
    timeout: 30000
- assertVisible:
    text: "Dashboard"
- assertVisible:
    text: "Reports"

# ── 5. Verify Dashboard Metrics ────────────────────────────────────────────
# Metrics sit below the fold in the Dashboard scroll view — scroll to them
- scrollUntilVisible:
    element:
      text: "Performance Overview"
    direction: DOWN
    speed: 20
    timeout: 30000
- assertVisible:
    text: "Win Rate"
- assertVisible:
    text: "Profit Factor"
- scrollUntilVisible:
    element:
      text: "Plan Compliance"
    direction: DOWN
    speed: 20
    timeout: 30000

# ── 6. Switch to Entries Tab ───────────────────────────────────────────────
- tapOn:
    text: "Entries"
- waitForAnimationToEnd

# Entries is a FlatList tab — assert its EMPTY-STATE text (a bare "Entries"
# assert adds nothing: the tap above already proved the tab label).
- assertVisible:
    text: "No journal entries yet"

# ── 7. Switch to Reports Tab ───────────────────────────────────────────────
- tapOn:
    text: "Reports"
- waitForAnimationToEnd

- assertVisible:
    text: "Reports"

# ── 8. Navigate back ───────────────────────────────────────────────────────
# BehavioralJournal pushes as a root-stack screen ABOVE MainTabs — the tab
# bar is covered. Hardware BACK pops to the More tab underneath.
- pressKey: BACK
- waitForAnimationToEnd
# More keeps its previous scroll offset after BACK — scroll the title back
# into view, then recover via the tab bar if needed.
- scrollUntilVisible:
    element:
      id: "more-title"
    direction: UP
    speed: 20
    timeout: 10000
- runFlow:
    when:
      notVisible:
        id: "more-title"
    commands:
      - tapOn:
          id: "tab-more"
      - waitForAnimationToEnd:
          timeout: 5000
      - scrollUntilVisible:
          element:
            id: "more-title"
          direction: UP
          speed: 20
          timeout: 10000

- assertVisible:
    id: "more-title"
