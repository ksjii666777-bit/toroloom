# =============================================================================
# AI Insights Flow — Market Analysis
# =============================================================================
# Tests AI insights screen with market overview and stock analysis cards:
#   1. Login with test credentials
#   2. Navigate: More → AI Insights
#   3. Verify header + AI Market Overview card
#   4. Verify stock analysis cards with symbol, sentiment, confidence
#   5. Scroll to see all insights
#   6. Navigate back
# =============================================================================

appId: com.toroloom.app
---
# ── 0. Kill app → relaunch fresh (prevents state leakage between sequential flows) ──
- stopApp

# ── 1. Login ───────────────────────────────────────────────────────────────
- assertVisible:
    id: "login-email-input"
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000

# ── 2. Navigate: More → AI Insights ──────────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "menu-AIInsights"
    direction: DOWN
- tapOn:
    id: "menu-AIInsights"
- waitForAnimationToEnd

# ── 3. Verify Header ───────────────────────────────────────────────────────
- assertVisible:
    text: "AI Insights"
- assertVisible:
    text: "Powered by advanced market analysis"

# ── 4. Verify AI Market Overview Card ──────────────────────────────────────
- assertVisible:
    text: "AI Market Overview"
- assertVisible:
    text: "bullish"
- assertVisible:
    text: "bearish"
- assertVisible:
    text: "neutral"
- assertVisible:
    text: "Always do your own research"

# ── 5. Verify Stock Analysis Section ───────────────────────────────────────
- assertVisible:
    text: "Stock Analysis"

# Scroll down to see all insight cards
- scroll:
    direction: DOWN
- waitForAnimationToEnd

# Each insight card shows symbol, sentiment, confidence, and target levels
- assertVisible:
    text: "Confidence"
- assertVisible:
    text: "Target 1"
    optional: true

- scroll:
    direction: DOWN
- waitForAnimationToEnd

# ── 6. Navigate back ───────────────────────────────────────────────────────
# The screen has no visible back button; use Android back key
- pressKey: BACK
- waitForAnimationToEnd

- assertVisible:
    id: "more-title"
