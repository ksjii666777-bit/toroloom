# =============================================================================
# AI Insights Flow
# =============================================================================
# Tests the AI Insights screen:
#   1. Login with test credentials
#   2. Navigate: More → AI Insights (menu-AIInsights)
#   3. Verify header + subtitle
#   4. Verify Market Overview card (bullish/bearish/neutral counts)
#   5. Verify Stock Analysis section renders (insights or generating state)
#   6. Navigate back to More
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 1. Login ───────────────────────────────────────────────────────────────
# Cold-start can be slow on the cloud emulator — wait up to 60s
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000

# ── 2. Navigate: More → AI Insights ────────────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "menu-AIInsights"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    id: "menu-AIInsights"
- waitForAnimationToEnd

# ── 3. Verify Header ───────────────────────────────────────────────────────
- assertVisible:
    text: "AI Insights"
- assertVisible:
    text: "Powered by advanced market analysis"

# ── 4. Verify Market Overview Card ─────────────────────────────────────────
- assertVisible:
    text: "AI Market Overview"
# Overview sub line is ONE text node: "N bullish · N bearish · N neutral"
# (lowercase counts) — match it as a full-node regex.
- assertVisible:
    text: ".*bullish.*bearish.*"
- assertVisible:
    text: ".*neutral.*"
- assertVisible:
    text: ".*Always do your own research.*"

# ── 5. Verify Stock Analysis Section ───────────────────────────────────────
- assertVisible:
    text: "Stock Analysis"

# Insight cards may still be generating for a fresh account — the
# generating state is a valid render.
- assertVisible:
    text: "Generating analysis..."
    optional: true

# ── 6. Navigate Back to More ──────────────────────────────────────────
# AIInsights pushes as a root-stack screen — BACK pops to the More tab.
# Give the pop a moment, then recover via the tab bar if needed.
- pressKey: BACK
- waitForAnimationToEnd
# More keeps its previous scroll offset after BACK (scrollUntilVisible to the
# menu left it scrolled) — scroll the title back into view, then recover via
# the tab bar if needed.
- scrollUntilVisible:
    element:
      id: "more-title"
    direction: UP
    speed: 20
    timeout: 10000
- runFlow:
    when:
      notVisible:
        id: "more-title"
    commands:
      - tapOn:
          id: "tab-more"
      - waitForAnimationToEnd:
          timeout: 5000
      - scrollUntilVisible:
          element:
            id: "more-title"
          direction: UP
          speed: 20
          timeout: 10000

- assertVisible:
    id: "more-title"
