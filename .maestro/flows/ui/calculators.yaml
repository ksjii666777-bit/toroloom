# =============================================================================
# Calculators — E2E Test
# =============================================================================
# Tests the SIP Calculator (reachable from Home quick actions):
#   1. Login
#   2. Navigate: Home → SIP Calculator quick action
#   3. Verify calculator renders with live results + presets
#   4. Change an input via preset chip → results update live
#   5. Navigate back
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 0. Kill app → relaunch fresh (prevents state leakage between sequential flows) ──

# ── 1. Login ───────────────────────────────────────────────────────────────
- assertVisible:
    id: "login-email-input"
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
# After login the app hydrates onboarding state from AsyncStorage and may
# show a blank Loading screen briefly — wait for the tab bar to appear
# before interacting further.
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 60000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000

# ── 2. Navigate: Home → SIP Calculator quick action ───────────────────────
# (SIP Calculator is only reachable from Home quick actions / Wealth Dashboard —
#  the More menu's "My SIPs" entry opens the Mutual Funds screen instead)
- scrollUntilVisible:
    element:
      id: "home-quick-sipcalculator"
    direction: DOWN
    speed: 20
    timeout: 30000

# ── 3. SIP Calculator ─────────────────────────────────────────────────────
- tapOn:
    id: "home-quick-sipcalculator"
- waitForAnimationToEnd
- assertVisible:
    text: "SIP Calculator"

# Result card is live-computed from default inputs (₹10K/mo, 12%, 10Y)
- assertVisible:
    text: "Maturity Value"
- assertVisible:
    text: "Total Investment"
- assertVisible:
    text: "Total Returns"

# Input labels match the real screen
- assertVisible:
    text: "Monthly Investment (₹)"
- assertVisible:
    text: "Expected Return (% p.a.)"
- assertVisible:
    text: "Investment Period (Years)"

# ── 4. Change investment via preset chip → results update live ────────────
- tapOn:
    text: "₹5K"
- waitForAnimationToEnd
- assertVisible:
    text: "Yearly Growth"
- assertVisible:
    text: "Quick Summary"
- assertVisible:
    text: "Returns / Invested Ratio"

# ── 5. Go back ────────────────────────────────────────────────────────────
- pressKey: back
- waitForAnimationToEnd
- assertVisible:
    id: "home-greeting"
