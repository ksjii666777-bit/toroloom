# =============================================================================
# Calculators Flow
# =============================================================================
# Tests the SIP calculator from the Home quick actions:
#   1. Login with test credentials
#   2. Home → SIP Calculator quick action
#   3. Verify fields + preset chips + result cards
#   4. Tap the ₹5K preset → verify Yearly Growth / Quick Summary
#   5. Back to Home
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 1. Login ───────────────────────────────────────────────────────────────
- assertVisible:
    id: "login-welcome-back"
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 60000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000

# ── 2. Home → SIP Calculator Quick Action ──────────────────────────────────
- scrollUntilVisible:
    element:
      id: "home-quick-sipcalculator"
    direction: DOWN
    speed: 20
    timeout: 30000

- tapOn:
    id: "home-quick-sipcalculator"
- waitForAnimationToEnd
- assertVisible:
    text: "SIP Calculator"

# ── 3. Verify Result Cards ─────────────────────────────────────────────────
- assertVisible:
    text: "Maturity Value"
- assertVisible:
    text: "Total Investment"
- assertVisible:
    text: "Total Returns"

# ── 4. Verify Input Fields ─────────────────────────────────────────────────
- assertVisible:
    text: "Monthly Investment (₹)"
- assertVisible:
    text: "Expected Return (% p.a.)"
- assertVisible:
    text: "Investment Period (Years)"

# Preset chips render as "₹5K" "₹10K" "₹25K" "₹50K"
- tapOn:
    text: "₹5K"
- waitForAnimationToEnd

# ── 5. Verify Growth Summary ───────────────────────────────────────────────
- scrollUntilVisible:
    element:
      text: "Yearly Growth"
    direction: DOWN
    speed: 20
    timeout: 30000
- assertVisible:
    text: "Yearly Growth"
- scrollUntilVisible:
    element:
      text: "Quick Summary"
    direction: DOWN
    speed: 20
    timeout: 30000
- assertVisible:
    text: "Quick Summary"
- assertVisible:
    text: "Returns / Invested Ratio"

# ── 6. Back to Home ────────────────────────────────────────────────────────
- pressKey: back
- waitForAnimationToEnd
- assertVisible:
    id: "home-greeting"
