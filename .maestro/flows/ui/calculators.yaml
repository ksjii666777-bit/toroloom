# =============================================================================
# Calculators Flow
# =============================================================================
# Tests the SIP calculator from the Home quick actions:
#   1. Login with test credentials
#   2. Home → SIP Calculator quick action
#   3. Verify fields + preset chips + result cards
#   4. Tap the ₹5K preset → verify Yearly Growth / Quick Summary
#   5. Back to Home
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 1. Login ───────────────────────────────────────────────────────────────
# Cold-start can be slow on the cloud emulator — wait up to 60s
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# If we are STILL on the login screen, a transient backend blip swallowed
# the first login — cool down and retry up to two more times (smoke-test
# pattern; a Railway Postgres restart window returns 5xx for ~a minute).
- runFlow:
    when:
      visible:
        id: "login-btn"
    commands:
      - extendedWaitUntil:
          notVisible:
            id: "login-btn"
          timeout: 20000
      - runFlow:
          when:
            visible:
              id: "login-btn"
          commands:
            - tapOn:
                id: "login-btn"
            - extendedWaitUntil:
                notVisible:
                  id: "login-btn"
                timeout: 30000
            - runFlow:
                when:
                  visible:
                    id: "login-btn"
                commands:
                  - tapOn:
                      id: "login-btn"
                  - extendedWaitUntil:
                      notVisible:
                        id: "login-btn"
                      timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# Second onboarding/offline pass — the lazy onboarding screen can mount
# AFTER the first check on a cold emulator
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "home-greeting"

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000

# ── 2. Home → SIP Calculator Quick Action ──────────────────────────────────
- scrollUntilVisible:
    element:
      id: "home-quick-sipcalculator"
    direction: DOWN
    speed: 20
    timeout: 30000

- tapOn:
    id: "home-quick-sipcalculator"
- waitForAnimationToEnd
- assertVisible:
    text: "SIP Calculator"

# ── 3. Verify Result Cards ─────────────────────────────────────────────────
- assertVisible:
    text: "Maturity Value"
- assertVisible:
    text: "Total Investment"
- assertVisible:
    text: "Total Returns"

# ── 4. Input Form ──────────────────────────────────────────────────────────
# The Yearly Growth chart sits between the result card and the input form,
# so the fields are BELOW the fold — scroll to each before asserting.
- scrollUntilVisible:
    element:
      text: "Monthly Investment (₹)"
    direction: DOWN
    speed: 20
    timeout: 20000
- assertVisible:
    text: "Monthly Investment (₹)"

# Preset chips render as "₹5K" "₹10K" "₹25K" "₹50K" — they sit below the
# first fields, so scroll them into view before tapping (CI run
# 36129120557: the chip was off-screen and the tap found nothing).
- scrollUntilVisible:
    element:
      text: "₹5K"
    direction: DOWN
    speed: 20
    timeout: 20000
- tapOn:
    text: "₹5K"
- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      text: "Expected Return (% p.a.)"
    direction: DOWN
    speed: 20
    timeout: 20000
- assertVisible:
    text: "Expected Return (% p.a.)"
- scrollUntilVisible:
    element:
      text: "Investment Period (Years)"
    direction: DOWN
    speed: 20
    timeout: 20000
- assertVisible:
    text: "Investment Period (Years)"

# ── 5. Verify Growth Summary ───────────────────────────────────────────────
# Content order: Result Card → Yearly Growth chart → Investment Details →
# Quick Summary. We are at the input fields now, so scroll UP to the chart,
# then DOWN to the summary.
- scrollUntilVisible:
    element:
      text: "Yearly Growth"
    direction: UP
    speed: 20
    timeout: 30000
- assertVisible:
    text: "Yearly Growth"
- scrollUntilVisible:
    element:
      text: "Quick Summary"
    direction: DOWN
    speed: 20
    timeout: 30000
- assertVisible:
    text: "Quick Summary"
- assertVisible:
    text: "Returns / Invested Ratio"

# ── 6. Back to Home ────────────────────────────────────────────────────────
# SIPCalculator is a root-stack screen ABOVE MainTabs — the tab bar is
# covered there, so tap-back/tab-home both fail. Hardware BACK pops to the
# underlying tab (Home).
- pressKey: BACK
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "home-greeting"
    commands:
      - tapOn:
          id: "tab-home"
      - waitForAnimationToEnd:
          timeout: 5000
- assertVisible:
    id: "home-greeting"
