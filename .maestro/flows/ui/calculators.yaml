# =============================================================================
# Calculators — E2E Test
# =============================================================================
# Tests the financial calculators:
#   1. Login
#   2. Navigate: More → Calculators
#   3. Test SIP Calculator
#   4. Test Lumpsum Calculator
#   5. Navigate back
# =============================================================================

appId: com.anonymous.Toroloom
---
# ── 0. Kill app → relaunch fresh (prevents state leakage between sequential flows) ──
- stopApp

# ── 1. Login ───────────────────────────────────────────────────────────────
- assertVisible:
    id: "login-email-input"
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000

# ── 2. Navigate: More → Calculators ───────────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "menu-SIPCalculator"
    direction: DOWN

# ── 3. SIP Calculator ─────────────────────────────────────────────────────
- tapOn:
    id: "menu-SIPCalculator"
- waitForAnimationToEnd
- assertVisible:
    text: "SIP Calculator"

# Enter monthly investment
- tapOn:
    text: "Monthly Investment"
- inputText: "5000"

# Enter expected return
- tapOn:
    text: "Expected Return"
- inputText: "12"

# Enter time period
- tapOn:
    text: "Time Period"
- inputText: "10"

# Calculate
- tapOn:
    text: "Calculate"
- waitForAnimationToEnd

# Verify result is shown
- assertVisible:
    text: "Invested Amount"
- assertVisible:
    text: "Total Value"

# ── 4. Go back ────────────────────────────────────────────────────────────
- tapOn:
    accessibilityLabel: "Go back"
- waitForAnimationToEnd
- assertVisible:
    text: "More"
