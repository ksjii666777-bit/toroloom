# =============================================================================
# Empty States Flow
# =============================================================================
# Verifies the empty-state designs of key screens:
#   1. Login with test credentials
#   2. Watchlist: "Empty Watchlist" + subtitle
#   3. Portfolio: "No Holdings Yet" + Explore Markets CTA
#   4. Trade History: "0 total trades" + "No Trades Found"
#   5. Mutual Funds → My SIPs: "No Active SIPs"
#   6. Funds Dashboard: "No transactions yet" + Add Funds
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 1. Login ───────────────────────────────────────────────────────────────
- assertVisible:
    id: "login-welcome-back"
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 5000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000

- assertVisible:
    id: "home-greeting"

# ── 2. Watchlist Empty State ───────────────────────────────────────────────
- tapOn:
    id: "tab-watchlist"
- waitForAnimationToEnd
- assertVisible:
    text: "Watchlist"
- assertVisible:
    text: "Monitor your favorite stocks"
- assertVisible:
    text: "Empty Watchlist"
- assertVisible:
    text: "Add stocks from the Markets tab to track them here"

# ── 3. Portfolio Empty State ───────────────────────────────────────────────
- tapOn:
    id: "tab-portfolio"
- waitForAnimationToEnd
- assertVisible:
    text: "Portfolio"
- assertVisible:
    text: "Track your investments"
- assertVisible:
    text: "No Holdings Yet"
- assertVisible:
    text: "Start investing to build your portfolio"
- assertVisible:
    text: "Explore Markets"

# ── 4. Trade History Empty State ───────────────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "menu-TradeHistory"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    id: "menu-TradeHistory"
- waitForAnimationToEnd
- assertVisible:
    text: "Trade History"
- assertVisible:
    text: "0 total trades"
- assertVisible:
    text: "No Trades Found"
- assertVisible:
    text: "Start trading to see your history here"

- tapOn:
    text: "Go back"
- waitForAnimationToEnd
- assertVisible:
    id: "more-title"

# ── 5. Mutual Funds → My SIPs Empty State ──────────────────────────────────
- scrollUntilVisible:
    element:
      id: "menu-MutualFunds"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    id: "menu-MutualFunds"
- waitForAnimationToEnd
- assertVisible:
    text: "Mutual Funds"

# SIPs tab: "My SIPs ({{count}})" — assert the stable prefix
- tapOn:
    text: "My SIPs"
- waitForAnimationToEnd

- assertVisible:
    text: "No Active SIPs"
- assertVisible:
    text: "Start a SIP to invest regularly and build wealth over time"

- tapOn:
    text: "Go back"
- waitForAnimationToEnd
- assertVisible:
    id: "more-title"

# ── 6. Funds Dashboard Empty State ─────────────────────────────────────────
- scrollUntilVisible:
    element:
      id: "menu-FundsDashboard"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    id: "menu-FundsDashboard"
- waitForAnimationToEnd
- assertVisible:
    text: "Funds Dashboard"

- scrollUntilVisible:
    element:
      text: "No transactions yet"
    direction: DOWN

- assertVisible:
    text: "No transactions yet"
- assertVisible:
    text: "Add Funds"

- tapOn:
    text: "Go back"
- waitForAnimationToEnd
- assertVisible:
    id: "more-title"
