# =============================================================================
# Empty States Flow
# =============================================================================
# Verifies the empty-state designs of key screens:
#   1. Login with test credentials
#   2. Watchlist: "Empty Watchlist" + subtitle
#   3. Portfolio: "No Holdings Yet" + Explore Markets CTA
#   4. Trade History: "0 total trades" + "No Trades Found"
#   5. Mutual Funds → My SIPs: "No Active SIPs"
#   6. Funds Dashboard: "No transactions yet" + Add Funds
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 1. Login ───────────────────────────────────────────────────────────────
# Cold-start can be slow on the cloud emulator — wait up to 60s
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 5000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000

- assertVisible:
    id: "home-greeting"

# ── 2. Watchlist Empty State ───────────────────────────────────────────────
- tapOn:
    id: "tab-watchlist"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Watchlist"
    timeout: 20000
# The E2E account's backend store may have NO default watchlists (fresh
# account → empty array), in which case the "All" tab shows NO list and the
# empty state never renders — the design shows the empty card only for an
# existing (but empty) list or the "All" aggregate. Recover by creating a
# watchlist via the UI when no list chips are visible.
- runFlow:
    when:
      notVisible:
        text: "No Stocks Yet"
    commands:
      # No lists yet — create one so its (empty) view can render
      - runFlow:
          when:
            notVisible:
              text: "My Watchlist"
          commands:
            - tapOn:
                id: "watchlist-add-btn"
            - waitForAnimationToEnd:
                timeout: 5000
            # The create input autoFocuses; type the name and confirm
            - inputText: "My Watchlist"
            - hideKeyboard
            - tapOn:
                text: "Create"
            - waitForAnimationToEnd:
                timeout: 5000

# The empty state renders after the suggested-stocks query resolves — use
# waits, not hard asserts, for the lazy content
- extendedWaitUntil:
    visible:
      text: "No Stocks Yet"
    timeout: 20000
- assertVisible:
    text: "Add stocks to any watchlist to see them here"

# ── 3. Portfolio Empty State ───────────────────────────────────────────────
- tapOn:
    id: "tab-portfolio"
- waitForAnimationToEnd
# The store seeds mock holdings and the screen only refetches on
# pull-to-refresh (mount-fetch crashed the release build in CI), so swipe
# down to load the fresh account's real (empty) portfolio before asserting.
- swipe:
    direction: DOWN
    duration: 1000
- waitForAnimationToEnd:
    timeout: 5000
# One fling may release above the RefreshControl threshold — retry while
# the empty state has not appeared yet (capped so the flow cannot hang).
- runFlow:
    when:
      notVisible:
        text: "No Holdings Yet"
    commands:
      - swipe:
          direction: DOWN
          duration: 1200
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    visible:
      text: "No Holdings Yet"
    timeout: 30000
- assertVisible:
    text: "Start investing to build your portfolio"
- assertVisible:
    text: "Explore Markets"

# ── 4. Trade History Empty State ───────────────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "menu-TradeHistory"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    id: "menu-TradeHistory"
- waitForAnimationToEnd
# The subtitle is "{{count}} total trades" — parameterized full node
- extendedWaitUntil:
    visible:
      text: "Trade History"
    timeout: 20000
- extendedWaitUntil:
    visible:
      text: ".*total trades"
    timeout: 20000
- assertVisible:
    text: "No Trades Found"
- assertVisible:
    text: "Start trading to see your history here"

# The back control is an icon-only button (accessibilityLabel "Go back") —
# tap by accessibility, not visible text
- tapOn:
    point: "8%,12%"
- waitForAnimationToEnd
- assertVisible:
    id: "more-title"

# ── 5. Mutual Funds → My SIPs Empty State ──────────────────────────────────
- scrollUntilVisible:
    element:
      id: "menu-MutualFunds"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    id: "menu-MutualFunds"
- waitForAnimationToEnd
- assertVisible:
    text: "Mutual Funds"

# SIPs tab: "My SIPs ({{count}})" — tap the stable prefix, then assert the
# empty state
- tapOn:
    text: "My SIPs.*"
- waitForAnimationToEnd

- assertVisible:
    text: "No Active SIPs"
- assertVisible:
    text: "Start a SIP to invest regularly and build wealth over time"

# Back is the icon-only button (accessibilityLabel "Go back")
- tapOn:
    point: "8%,12%"
- waitForAnimationToEnd
- assertVisible:
    id: "more-title"

# ── 6. Funds Dashboard Empty State ─────────────────────────────────────────
- scrollUntilVisible:
    element:
      id: "menu-FundsDashboard"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    id: "menu-FundsDashboard"
- waitForAnimationToEnd
- assertVisible:
    text: "Funds Dashboard"

- scrollUntilVisible:
    element:
      text: "No transactions yet"
    direction: DOWN

- assertVisible:
    text: "No transactions yet"
- assertVisible:
    text: "Add Funds"

# Back is the icon-only button (accessibilityLabel "Go back")
- tapOn:
    point: "8%,12%"
- waitForAnimationToEnd
- assertVisible:
    id: "more-title"
