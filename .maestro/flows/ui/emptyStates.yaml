# =============================================================================
# Empty States Flow
# =============================================================================
# Verifies the empty-state designs of key screens:
#   1. Login with test credentials
#   2. Watchlist: "Empty Watchlist" + subtitle
#   3. Portfolio: "No Holdings Yet" + Explore Markets CTA
#   4. Trade History: "0 total trades" + "No Trades Found"
#   5. Mutual Funds → My SIPs: "No Active SIPs"
#   6. Funds Dashboard: "No transactions yet" + Add Funds
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 1. Login ───────────────────────────────────────────────────────────────
# Cold-start can be slow on the cloud emulator — wait up to 60s
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 5000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000

- assertVisible:
    id: "home-greeting"

# ── 2. Watchlist Empty State ───────────────────────────────────────────────
- tapOn:
    id: "tab-watchlist"
- waitForAnimationToEnd:
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: "Watchlist"
    timeout: 20000
# The E2E account's backend store may have NO default watchlists (fresh
# account → empty array), in which case the "All" tab shows NO list and the
# empty state never renders — the design shows the empty card only for an
# existing (but empty) list or the "All" aggregate. Recover by creating a
# watchlist via the UI when no list chips are visible.
- runFlow:
    when:
      notVisible:
        text: "No Stocks Yet"
    commands:
      # No lists yet — create one so its (empty) view can render
      - runFlow:
          when:
            notVisible:
              text: "My Watchlist"
          commands:
            - tapOn:
                id: "watchlist-add-btn"
            - waitForAnimationToEnd:
                timeout: 5000
            # The create input autoFocuses; type the name and confirm
            - inputText: "My Watchlist"
            - hideKeyboard
            - tapOn:
                text: "Create"
            - waitForAnimationToEnd:
                timeout: 5000

# The empty state renders after the suggested-stocks query resolves — use
# waits, not hard asserts, for the lazy content
- extendedWaitUntil:
    visible:
      text: "No Stocks Yet"
    timeout: 20000
- assertVisible:
    text: "Add stocks to any watchlist to see them here"

# ── 3. Portfolio Empty State ───────────────────────────────────────────────
- tapOn:
    id: "tab-portfolio"
- waitForAnimationToEnd:
    timeout: 10000
# The store seeds mock holdings, but pull-to-refresh replaces them with
# the test account's REAL backend portfolio — which is NON-deterministic
# in CI (placeOrder creates real orders; the backend may also return an
# empty list for a fresh account). Accept either state:
#   populated → TCS card visible (scroll it into view)
#   empty     → "No Holdings Yet" + "Explore Markets" empty state
- runFlow:
    when:
      notVisible:
        text: "No Holdings Yet"
    commands:
      - swipe:
          direction: DOWN
          duration: 1000
      - waitForAnimationToEnd:
          timeout: 5000
      # One fling can release above the RefreshControl threshold —
      # retry while NEITHER the empty state NOR holdings have appeared.
      - runFlow:
          when:
            notVisible:
              text: "No Holdings Yet"
          commands:
            - runFlow:
                when:
                  notVisible:
                    text: "TCS"
                commands:
                  - swipe:
                      direction: DOWN
                      duration: 1200
                  - waitForAnimationToEnd:
                      timeout: 5000
- runFlow:
    when:
      visible:
        text: "No Holdings Yet"
    commands:
      - assertVisible:
          text: "Explore Markets"
- runFlow:
    when:
      notVisible:
        text: "No Holdings Yet"
    commands:
      - runFlow:
          when:
            notVisible:
              text: "TCS"
          commands:
            - scrollUntilVisible:
                element:
                  text: "TCS"
                direction: DOWN
                speed: 20
                timeout: 30000
      - assertVisible:
          text: "TCS"
# ── 4. Trade History Empty State ───────────────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd:
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "menu-TradeHistory"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    id: "menu-TradeHistory"
- waitForAnimationToEnd:
    timeout: 10000
# The subtitle is "{{count}} total trades" — parameterized full node
- extendedWaitUntil:
    visible:
      text: "Trade History"
    timeout: 20000
- extendedWaitUntil:
    visible:
      text: ".*total trades"
    timeout: 20000
# The store seeds 5 mock trades (backend mock broker mirrors them) — the
# empty state is unreachable; assert real rows instead.
- scrollUntilVisible:
    element:
      text: "RELIANCE"
    direction: DOWN
    speed: 20
    timeout: 20000
- assertVisible:
    text: "RELIANCE"
- assertVisible:
    text: "TCS"

# The back control is an icon-only button (accessibilityLabel "Go back") —
# tap by accessibility, not visible text
- tapOn:
    point: "8%,12%"
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible:
    id: "more-title"

# ── 5. Mutual Funds → My SIPs Empty State ──────────────────────────────────
- scrollUntilVisible:
    element:
      id: "menu-MutualFunds"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    id: "menu-MutualFunds"
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible:
    text: "Mutual Funds"

# SIPs tab: "My SIPs ({{count}})" — tap the stable prefix, then assert the
# empty state
- tapOn:
    text: "My SIPs.*"
- waitForAnimationToEnd:
    timeout: 10000

# The store seeds two SIP plans (mockSIPs) — assert seeded fund rows
# instead of the unreachable empty state.
- extendedWaitUntil:
    visible:
      text: "Parag Parikh Flexi Cap Fund"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "SBI Bluechip Fund"
    direction: DOWN
    speed: 20
    timeout: 20000
- assertVisible:
    text: "SBI Bluechip Fund"

# Back is the icon-only button (accessibilityLabel "Go back")
- tapOn:
    point: "8%,12%"
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible:
    id: "more-title"

# ── 6. Funds Dashboard Empty State ─────────────────────────────────────────
- scrollUntilVisible:
    element:
      id: "menu-FundsDashboard"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    id: "menu-FundsDashboard"
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible:
    text: "Funds Dashboard"

# The store seeds fund transactions (seedTransactions) — assert a seeded
# row type instead of the unreachable empty state.
- scrollUntilVisible:
    element:
      text: "Funds Added"
    direction: DOWN
    speed: 20
    timeout: 45000
- assertVisible:
    text: "Funds Added"
- scrollUntilVisible:
    element:
      text: "Add Funds"
    direction: UP
    speed: 20
    timeout: 20000
- assertVisible:
    text: "Add Funds"

# Back is the icon-only button (accessibilityLabel "Go back")
- tapOn:
    point: "8%,12%"
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible:
    id: "more-title"
