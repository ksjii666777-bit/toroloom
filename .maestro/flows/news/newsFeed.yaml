# =============================================================================
# News Feed Flow
# =============================================================================
# Tests the Market News screen:
#   1. Login with test credentials
#   2. Navigate: More → Market News
#   3. Verify header, category chips and result count line
#   4. Switch category (Corporate → All)
#   5. Navigate back to More
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 1. Login ───────────────────────────────────────────────────────────────
# Cold-start can be slow on the cloud emulator — wait up to 60s
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If we are STILL on the login screen, a transient backend blip swallowed
# the first login — cool down and retry up to two more times (smoke-test
# pattern; a Railway Postgres restart window returns 5xx for ~a minute).
- runFlow:
    when:
      visible:
        id: "login-btn"
    commands:
      - extendedWaitUntil:
          notVisible:
            id: "login-btn"
          timeout: 20000
      - runFlow:
          when:
            visible:
              id: "login-btn"
          commands:
            - tapOn:
                id: "login-btn"
            - extendedWaitUntil:
                notVisible:
                  id: "login-btn"
                timeout: 30000
            - runFlow:
                when:
                  visible:
                    id: "login-btn"
                commands:
                  - tapOn:
                      id: "login-btn"
                  - extendedWaitUntil:
                      notVisible:
                        id: "login-btn"
                      timeout: 30000

# Second onboarding/offline pass — the lazy onboarding screen can mount
# AFTER the first check on a cold emulator
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "home-greeting"

# ── 2. Navigate: More → Market News ───────────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Market News"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    text: "Market News"
- waitForAnimationToEnd

# ── 3. Verify Header + Category Chips ─────────────────────────────────────
- assertVisible:
    text: "Market News"

# Category chips (CATEGORIES constant)
- assertVisible:
    text: "All"
- assertVisible:
    text: "Markets"
- assertVisible:
    text: "Corporate"

# Result count line: "Showing N articles" — full node, so use a regex
- assertVisible:
    text: ".*Showing.*article.*"

# ── 4. Switch Category ─────────────────────────────────────────────────────
- tapOn:
    text: "Corporate"
- waitForAnimationToEnd

- assertVisible:
    text: "Corporate"

- tapOn:
    text: "All"
- waitForAnimationToEnd

- assertVisible:
    text: ".*Showing.*article.*"

# ── 5. Navigate Back to More ──────────────────────────────────────────────
# NewsFeed pushes as a ROOT-stack screen ABOVE MainTabs (headerShown:false,
# no in-app back button) — the tab bar is covered, so tab taps fail there.
# Hardware BACK pops back to the More tab underneath.
- pressKey: BACK
- waitForAnimationToEnd
# The More list keeps its previous scroll offset after BACK — menu items
# tapped via scrollUntilVisible left it scrolled, so more-title can sit
# ABOVE the viewport. Scroll it back into view; if the title still isn't
# visible, recover via the tab bar (and accept the peer "AI Insights" label).
- scrollUntilVisible:
    element:
      id: "more-title"
    direction: UP
    speed: 20
    timeout: 10000
- runFlow:
    when:
      notVisible:
        id: "more-title"
    commands:
      - tapOn:
          id: "tab-more"
      - waitForAnimationToEnd:
          timeout: 5000
      - scrollUntilVisible:
          element:
            id: "more-title"
          direction: UP
          speed: 20
          timeout: 10000

- assertVisible:
    id: "more-title"
