# =============================================================================
# News Feed Flow
# =============================================================================
# Tests the Market News screen:
#   1. Login with test credentials
#   2. Navigate: More → Market News
#   3. Verify header, category chips and result count line
#   4. Switch category (Corporate → All)
#   5. Navigate back to More
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 1. Login ───────────────────────────────────────────────────────────────
# Cold-start can be slow on the cloud emulator — wait up to 60s
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "home-greeting"

# ── 2. Navigate: More → Market News ───────────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Market News"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    text: "Market News"
- waitForAnimationToEnd

# ── 3. Verify Header + Category Chips ─────────────────────────────────────
- assertVisible:
    text: "Market News"

# Category chips (CATEGORIES constant)
- assertVisible:
    text: "All"
- assertVisible:
    text: "Markets"
- assertVisible:
    text: "Corporate"

# Result count line: "Showing N articles" — full node, so use a regex
- assertVisible:
    text: ".*Showing.*article.*"

# ── 4. Switch Category ─────────────────────────────────────────────────────
- tapOn:
    text: "Corporate"
- waitForAnimationToEnd

- assertVisible:
    text: "Corporate"

- tapOn:
    text: "All"
- waitForAnimationToEnd

- assertVisible:
    text: ".*Showing.*article.*"

# ── 5. Navigate Back to More ──────────────────────────────────────────────
# Market News is a TAB-level screen with NO back button — go to the tab bar
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd

- assertVisible:
    id: "more-title"
