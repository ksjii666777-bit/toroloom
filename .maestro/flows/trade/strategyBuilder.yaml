# =============================================================================
# Strategy Builder — E2E Test
# =============================================================================
# Tests the Strategy Builder screen:
#   1. Login
#   2. Navigate: More → Op. Strategies (menu label for StrategyBuilder)
#   3. Verify strategy templates list
#   4. Select a strategy and view details
#   5. Navigate back
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 1. Login ───────────────────────────────────────────────────────────────
# Cold-start can be slow on the cloud emulator — wait up to 60s
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "home-greeting"

# ── 2. Navigate: More → Op. Strategies ────────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Op. Strategies"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    text: "Op. Strategies"
- waitForAnimationToEnd

# ── 3. Verify Strategy Builder Screen ─────────────────────────────────────
- assertVisible:
    text: "Strategy Builder"
# The header subtitle shows the SELECTED TEMPLATE name (defaults to the
# template list heading, not a static tagline) — assert only stable texts
- assertVisible:
    text: "Strategy Templates"

# Verify the pre-built strategy templates section (async load — wait, then
# scroll the row into view). The chips are a horizontal row: the leftmost
# chip (Long Call) must be fully visible; the rightmost (Bull Call Spread,
# Iron Condor) can stay horizontally clipped on narrow viewports, so those
# two asserts are optional.
- extendedWaitUntil:
    visible:
      text: "Strategy Templates"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Long Call"
    direction: DOWN
    speed: 20
    timeout: 20000
- assertVisible:
    text: "Long Call"
- assertVisible:
    text: "Bull Call Spread"
    optional: true
- assertVisible:
    text: "Iron Condor"
    optional: true

# ── 4. Select a strategy to view details ──────────────────────────────────
# Selecting a template HIDES the templates section and auto-populates the
# strategy legs — assert the legs section that replaces it.
- tapOn:
    text: "Long Call"
- waitForAnimationToEnd

- assertVisible:
    text: "Strategy Legs (1)"
- assertVisible:
    text: "Add Leg"
# ── 5. Navigate Back ──────────────────────────────────────────────────────
# StrategyBuilder is a root-stack screen — hardware BACK pops to More
- pressKey: BACK
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "more-title"
    commands:
      - tapOn:
          id: "tab-more"
      - waitForAnimationToEnd:
          timeout: 5000
- assertVisible:
    id: "more-title"
