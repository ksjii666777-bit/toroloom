# =============================================================================
# F&O Options Chain — E2E Test
# =============================================================================
# Tests the F&O Options Chain screen:
#   1. Login
#   2. Navigate to F&O Options Chain
#   3. Verify options chain renders with strikes and Greeks
#   4. Switch expiry
#   5. Navigate back
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 0. Kill app → relaunch fresh (prevents state leakage between sequential flows) ──

# ── 1. Login ───────────────────────────────────────────────────────────────
- assertVisible:
    id: "login-email-input"
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000

# ── 2. Navigate: More → F&O Options Chain ─────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "menu-FnOOptionsChain"
    direction: DOWN
- tapOn:
    id: "menu-FnOOptionsChain"
- waitForAnimationToEnd

# ── 3. Verify Options Chain Screen ─────────────────────────────────────────
- assertVisible:
    text: "F&O Trading"

# Verify underlying selector
- assertVisible:
    text: "NIFTY"

# Verify view tabs (static — always rendered)
- assertVisible:
    text: "Option Chain"
- assertVisible:
    text: "Futures"

# Verify side filters (static — always rendered)
- assertVisible:
    text: "CE"
- assertVisible:
    text: "PE"

# Verify data rows are visible (backend-dependent — optional when no
# backend/chain data is available, e.g. local dev & CI)
- assertVisible:
    text: "Strike"
    optional: true
- assertVisible:
    text: "OI"
    optional: true
- assertVisible:
    text: "IV"
    optional: true

# ── 4. Switch symbol ──────────────────────────────────────────────────────
- tapOn:
    text: "NIFTY"
- waitForAnimationToEnd
- tapOn:
    text: "BANKNIFTY"
- waitForAnimationToEnd
- assertVisible:
    text: "BANKNIFTY"

# ── 5. Navigate Back (header back button is icon-only — use system back) ──
- back
- waitForAnimationToEnd
- assertVisible:
    id: "more-title"
