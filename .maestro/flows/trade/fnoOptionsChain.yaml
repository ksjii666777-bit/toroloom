# =============================================================================
# F&O Options Chain — E2E Test
# =============================================================================
# Tests the F&O Options Chain screen:
#   1. Login
#   2. Navigate to F&O Options Chain
#   3. Verify options chain renders with strikes and Greeks
#   4. Switch expiry
#   5. Navigate back
# =============================================================================

appId: com.anonymous.Toroloom
---
# ── 0. Kill app → relaunch fresh (prevents state leakage between sequential flows) ──
- stopApp

# ── 1. Login ───────────────────────────────────────────────────────────────
- assertVisible:
    id: "login-email-input"
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000

# ── 2. Navigate: More → F&O Options Chain ─────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "menu-FnOOptionsChain"
    direction: DOWN
- tapOn:
    id: "menu-FnOOptionsChain"
- waitForAnimationToEnd

# ── 3. Verify Options Chain Screen ─────────────────────────────────────────
- assertVisible:
    text: "Options Chain"

# Verify underlying selector
- assertVisible:
    text: "NIFTY"

# Verify key columns/headers
- assertVisible:
    text: "Strike"
- assertVisible:
    text: "CE"
- assertVisible:
    text: "PE"

# Verify data rows are visible
- assertVisible:
    text: "OI"
- assertVisible:
    text: "IV"

# ── 4. Switch symbol ──────────────────────────────────────────────────────
- tapOn:
    text: "NIFTY"
- waitForAnimationToEnd
- tapOn:
    text: "BANKNIFTY"
- waitForAnimationToEnd
- assertVisible:
    text: "BANKNIFTY"

# ── 5. Navigate Back ──────────────────────────────────────────────────────
- tapOn:
    accessibilityLabel: "Go back"
- waitForAnimationToEnd
- assertVisible:
    text: "More"
