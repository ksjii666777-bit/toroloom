# =============================================================================
# Stock Detail Screen Flow — Market Data
# =============================================================================
# Tests stock detail view with chart, stats, sector context, and AI insight:
#   1. Login with test credentials
#   2. Navigate: Home → Markets tab
#   3. Tap first stock card to open Stock Detail
#   4. Verify stock info: symbol, name, price, change badge
#   5. Verify key stats grid: Open, Day High, Day Low, Volume, Market Cap, P/E
#   6. Scroll down → verify About Company, Sector Context, Peer Comparison
#   7. Verify AI Insight card
#   8. Navigate back
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 0. Kill app → relaunch fresh (prevents state leakage between sequential flows) ──

# ── 1. Login ───────────────────────────────────────────────────────────────
- assertVisible:
    id: "login-email-input"
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000

# ── 2. Navigate to Markets tab ─────────────────────────────────────────────
- tapOn:
    id: "tab-markets"
- waitForAnimationToEnd
- assertVisible:
    id: "markets-title"

# ── 3. Open a stock detail (RELIANCE is below the fold — scroll it in) ─────
- scrollUntilVisible:
    element:
      text: "RELIANCE"
    direction: DOWN
    speed: 20
    timeout: 30000
- tapOn:
    text: "RELIANCE"
- waitForAnimationToEnd:
    timeout: 5000

# ── 4. Verify Stock Detail Screen Elements (About is below the fold) ───────
- scrollUntilVisible:
    element:
      text: "About Company"
    direction: DOWN
    speed: 20
    timeout: 30000
- assertVisible:
    text: "About Company"
- assertVisible:
    text: "Open"
- assertVisible:
    text: "Day High"
- assertVisible:
    text: "Day Low"
- assertVisible:
    text: "Volume"
- assertVisible:
    text: "Market Cap"
- assertVisible:
    text: "P/E Ratio"

# Verify price display
- assertVisible:
    text: "LTP"

# ── 5. Scroll to verify Sector Context and Peer Comparison ─────────────────
- scroll
- waitForAnimationToEnd

# Verify sector context section
- assertVisible:
    text: "Sector Context"
    optional: true

- scroll
- waitForAnimationToEnd

# Verify Peer Comparison section
- assertVisible:
    text: "Peer Comparison"
    optional: true

# ── 6. Verify AI Analysis section ──────────────────────────────────────────
- scroll
- waitForAnimationToEnd

- assertVisible:
    text: "AI Analysis"
    optional: true

# ── 7. Go back to Markets (Android back — the header back button is
# scrolled off-screen and its label is "Close", not "Go back") ──────────────
- back
- waitForAnimationToEnd

# Markets restores its previous scroll position — scroll back up to the title
- scrollUntilVisible:
    element:
      id: "markets-title"
    direction: UP
    speed: 20
    timeout: 15000
- assertVisible:
    id: "markets-title"
