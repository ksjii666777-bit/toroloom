# =============================================================================
# DigiLocker Verification Flow — KYC
# =============================================================================
# Tests DigiLocker document fetch flow:
#   1. Login with test credentials
#   2. Navigate: More → Profile → KYC → DigiLocker
#   3. Verify info screen with document types + benefits
#   4. Tap "Connect DigiLocker" → handle consent alert
#   5. Verify documents are fetched and displayed
#   6. Tap "Complete Verification" → navigate back
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 1. Login ───────────────────────────────────────────────────────────────
- assertVisible:
    id: "login-welcome-back"
- tapOn:
    text: "Enter your email"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    text: "Enter your password"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    text: "Log In"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn: "Home"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "home-greeting"

# ── 2. Navigate: More → Profile ──────────────────────────────────────────
- tapOn: "More"
- waitForAnimationToEnd
- tapOn:
    text: "Profile"
- waitForAnimationToEnd
- assertVisible:
    text: "Profile"

# ── 3. Navigate to KYC section ────────────────────────────────────────────
- scrollUntilVisible:
    element:
      text: "KYC Verification"
    direction: DOWN
- tapOn:
    text: "KYC Verification"
- waitForAnimationToEnd

# ── 4. Navigate to DigiLocker ─────────────────────────────────────────────
- scrollUntilVisible:
    element:
      text: "DigiLocker"
    direction: DOWN
- tapOn:
    text: "DigiLocker"
- waitForAnimationToEnd

# ── 5. Verify DigiLocker screen ───────────────────────────────────────────
- assertVisible:
    text: "DigiLocker"
- assertVisible:
    text: "Verify via DigiLocker"
- assertVisible:
    text: "Aadhaar Card"
- assertVisible:
    text: "PAN Card"
- assertVisible:
    text: "Driving License"
- assertVisible:
    text: "Benefits"
- assertVisible:
    text: "Instant document verification"

# ── 6. Tap Connect DigiLocker ─────────────────────────────────────────────
- assertVisible:
    text: "Connect DigiLocker"
- tapOn:
    text: "Connect DigiLocker"
- waitForAnimationToEnd

# ── 7. Handle consent alert ───────────────────────────────────────────────
# The alert shows "DigiLocker Consent" title with Authorize/Cancel options
- assertVisible:
    text: "DigiLocker Consent"
- tapOn:
    text: "Authorize"
- waitForAnimationToEnd:
    timeout: 10000

# ── 8. Verify documents fetched ───────────────────────────────────────────
- assertVisible:
    text: "Documents Fetched"
- assertVisible:
    text: "Complete Verification"
- assertVisible:
    text: "Verified"

# ── 9. Tap Complete Verification ──────────────────────────────────────────
- tapOn:
    text: "Complete Verification"
- waitForAnimationToEnd

# ── 10. Verify back on KYC screen ─────────────────────────────────────────
- assertVisible:
    text: "KYC Verification"
