# =============================================================================
# DigiLocker KYC Flow
# =============================================================================
# Tests the KYC → DigiLocker verification path:
#   1. Login with test credentials
#   2. Navigate: More → Profile & KYC
#   3. Switch to the "KYC & Banks" tab
#   4. Open DigiLocker from the KYC step list
#   5. Verify DigiLocker screen (hero, document types, benefits)
#   6. Connect → consent alert → Authorize → documents fetched
#   7. Complete Verification → back on KYC
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 1. Login ───────────────────────────────────────────────────────────────
# Cold-start can be slow on the cloud emulator — wait up to 60s
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "home-greeting"

# ── 2. Navigate: More → Profile & KYC ─────────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd:
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Profile & KYC"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    text: "Profile & KYC"
- waitForAnimationToEnd:
    timeout: 10000

# ── 3. Switch to the KYC & Banks Tab ──────────────────────────────────────
- assertVisible:
    text: "Profile"
- tapOn:
    text: "KYC & Banks"
- waitForAnimationToEnd:
    timeout: 10000

# ── 4. Open DigiLocker from the KYC Steps ─────────────────────────────────
- assertVisible:
    text: "KYC Verification"
- scrollUntilVisible:
    element:
      text: "DigiLocker"
    direction: DOWN
- tapOn:
    text: "DigiLocker"
- waitForAnimationToEnd:
    timeout: 10000

# ── 5. Verify DigiLocker Screen ───────────────────────────────────────────
- assertVisible:
    text: "DigiLocker"
- assertVisible:
    text: "Verify via DigiLocker"
- assertVisible:
    text: "Aadhaar Card"
- assertVisible:
    text: "PAN Card"
- assertVisible:
    text: "Driving License"
- assertVisible:
    text: "Benefits"
- assertVisible:
    text: "Instant document verification"

# ── 6. Connect DigiLocker ──────────────────────────────────────────────────
- assertVisible:
    text: "Connect DigiLocker"
- tapOn:
    text: "Connect DigiLocker"
- waitForAnimationToEnd:
    timeout: 10000

# Consent alert: "DigiLocker Consent" with Authorize/Cancel
- assertVisible:
    text: "DigiLocker Consent"
- tapOn:
    text: "Authorize"
- waitForAnimationToEnd:
    timeout: 10000

# ── 7. Verify Documents Fetched ────────────────────────────────────────────
# documentsFetched: "{{count}} Document{{plural}} Fetched" — parameterized
# full text node, so match with a regex. "Verified" appears inside the
# documents subtitle ("Verified documents from DigiLocker…") — assert that
# full node instead of the bare word. The documents card + CTA render
# below the hero — scroll to them instead of hard-asserting.
- extendedWaitUntil:
    visible:
      text: ".*Document.*Fetched"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Complete Verification"
    direction: DOWN
    speed: 20
    timeout: 20000
- assertVisible:
    text: "Complete Verification"
- assertVisible:
    text: "Verified documents from DigiLocker are used for your KYC verification."

# ── 8. Complete Verification ───────────────────────────────────────────────
- tapOn:
    text: "Complete Verification"
- waitForAnimationToEnd:
    timeout: 10000

# ── 9. Verify Back on KYC Screen ───────────────────────────────────────────
- assertVisible:
    text: "KYC Verification"
