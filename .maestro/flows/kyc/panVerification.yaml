# =============================================================================
# PAN Verification KYC Flow
# =============================================================================
# Tests the KYC → PAN verification path:
#   1. Login with test credentials
#   2. Navigate: More → Profile & KYC → KYC & Banks tab
#   3. Open PAN Verification from the KYC step list
#   4. Enter a valid PAN → Verify → "PAN Verified ✓" result
#   5. Go back to KYC
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 1. Login ───────────────────────────────────────────────────────────────
- assertVisible:
    id: "login-welcome-back"
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "home-greeting"

# ── 2. Navigate: More → Profile & KYC → KYC & Banks ───────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Profile & KYC"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    text: "Profile & KYC"
- waitForAnimationToEnd

- tapOn:
    text: "KYC & Banks"
- waitForAnimationToEnd

# ── 3. Open PAN Verification ───────────────────────────────────────────────
- assertVisible:
    text: "KYC Verification"
- scrollUntilVisible:
    element:
      text: "PAN Verification"
    direction: DOWN
- tapOn:
    text: "PAN Verification"
- waitForAnimationToEnd

# ── 4. Verify PAN Screen ───────────────────────────────────────────────────
- assertVisible:
    text: "PAN Verification"
- assertVisible:
    text: "PAN (Permanent Account Number) is a 10-character alphanumeric identifier issued by the Income Tax Department."
- assertVisible:
    text: "Enter PAN Number"

# The input placeholder is the format example "ABCDE1234F"
- tapOn:
    text: "ABCDE1234F"
- inputText: "ABCDE1234F"
- hideKeyboard
- tapOn:
    text: "Verify PAN"
- waitForAnimationToEnd:
    timeout: 10000

# ── 5. Verify Result ───────────────────────────────────────────────────────
- assertVisible:
    text: "PAN Verified"
- assertVisible:
    text: "ABCDE1234F"
- assertVisible:
    text: "Verified"

# ── 6. Back to KYC ─────────────────────────────────────────────────────────
- tapOn:
    text: "Go back"
- waitForAnimationToEnd
- assertVisible:
    text: "KYC Verification"
