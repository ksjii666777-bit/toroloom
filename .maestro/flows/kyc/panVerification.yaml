# =============================================================================
# PAN Verification Flow — KYC
# =============================================================================
# Tests PAN verification flow:
#   1. Login with test credentials
#   2. Navigate: More → Profile → Verify PAN
#   3. Enter a valid PAN number
#   4. Verify PAN verification success
#   5. Test invalid PAN validation
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 1. Login ───────────────────────────────────────────────────────────────
- assertVisible:
    id: "login-welcome-back"
- tapOn:
    text: "Enter your email"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    text: "Enter your password"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    text: "Log In"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn: "Home"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "home-greeting"

# ── 2. Navigate: More → Profile ──────────────────────────────────────────
- tapOn: "More"
- waitForAnimationToEnd
- tapOn:
    text: "Profile"
- waitForAnimationToEnd
- assertVisible:
    text: "Profile"

# ── 3. Navigate to KYC section ────────────────────────────────────────────
- scrollUntilVisible:
    element:
      text: "KYC Verification"
    direction: DOWN
- tapOn:
    text: "KYC Verification"
- waitForAnimationToEnd

# ── 4. Verify PAN screen ──────────────────────────────────────────────────
- assertVisible:
    text: "PAN Verification"
- assertVisible:
    text: "Verify your PAN to start trading"
- assertVisible:
    text: "Enter PAN Number"

# ── 5. Enter valid PAN and submit ─────────────────────────────────────────
- tapOn:
    text: "Enter your 10-digit PAN"
- inputText: "ABCDE1234F"
- hideKeyboard
- tapOn:
    text: "Verify PAN"
- waitForAnimationToEnd:
    timeout: 10000

# ── 6. Verify success ─────────────────────────────────────────────────────
- assertVisible:
    text: "PAN Verified"
- assertVisible:
    text: "ABCDE1234F"
- assertVisible:
    text: "Verified"

# ── 7. Navigate Back ──────────────────────────────────────────────────────
- tapOn:
    text: "Go back"
- waitForAnimationToEnd
- assertVisible:
    text: "KYC Verification"
