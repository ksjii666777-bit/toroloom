# =============================================================================
# PAN Verification KYC Flow
# =============================================================================
# Tests the KYC → PAN verification path:
#   1. Login with test credentials
#   2. Navigate: More → Profile & KYC → KYC & Banks tab
#   3. Open PAN Verification from the KYC step list
#   4. Enter a valid PAN → Verify → "PAN Verified ✓" result
#   5. Go back to KYC
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 1. Login ───────────────────────────────────────────────────────────────
# Cold-start can be slow on the cloud emulator — wait up to 60s
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "home-greeting"

# ── 2. Navigate: More → Profile & KYC → KYC & Banks ───────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Profile & KYC"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    text: "Profile & KYC"
- waitForAnimationToEnd

- tapOn:
    text: "KYC & Banks"
- waitForAnimationToEnd

# ── 3. Open PAN Verification ───────────────────────────────────────────────
- assertVisible:
    text: "KYC Verification"
- scrollUntilVisible:
    element:
      text: "PAN Verification"
    direction: DOWN
- tapOn:
    text: "PAN Verification"
- waitForAnimationToEnd

# ── 4. Verify PAN Screen ───────────────────────────────────────────────────
- assertVisible:
    text: "PAN Verification"
# panInfo is ONE long text node ending with the NSDL sentence — full-node
# regex on a stable prefix (a plain-text match requires the ENTIRE node)
- assertVisible:
    text: "PAN \\(Permanent Account Number\\) is a 10-character alphanumeric identifier issued by the Income Tax Department\\..*"
- assertVisible:
    text: "Enter PAN Number"

# The input is targeted by its stable testID (the placeholder text is ALSO
# rendered as the format example above the input, so a placeholder tap can
# hit the wrong node). The TEST PAN must pass BOTH regexes: frontend
# ^[A-Z]{5}\d{4}[A-Z]$ AND backend ^[A-Z]{3}[ABCEFGHLJPT][A-Z]\d{4}[A-Z]$
# (4th char class) — "ABCDE1234F" fails the backend one (4th char 'D').
# "PQRST5678G" passes both and is in the backend mock database.
- tapOn:
    id: "pan-input"
- inputText: "PQRST5678G"
- hideKeyboard
- tapOn:
    text: "Verify PAN"
- waitForAnimationToEnd:
    timeout: 10000

# ── 5. Verify Result ───────────────────────────────────────────────────────
# Result title is "PAN Verified ✓" (one node with the checkmark) — regex.
# Result section renders below the fold — scroll to it first. The verify
# POST can hit a slow backend window, so wait for the result card rather
# than racing it.
- extendedWaitUntil:
    visible:
      text: "PAN Verified.*"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "PAN Verified.*"
    direction: DOWN
    speed: 20
    timeout: 20000
- assertVisible:
    text: "PQRST5678G"

# ── 6. Back to KYC ────────────────────────────────────────────────────────
# PanVerification is a root-stack screen ABOVE MainTabs — hardware BACK
# pops to the underlying tab (More).
- pressKey: BACK
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        text: "KYC Verification"
    commands:
      - tapOn:
          id: "tab-more"
      - waitForAnimationToEnd:
          timeout: 5000
- assertVisible:
    text: "KYC Verification"
