# =============================================================================
# Bank Account Linking Flow — KYC
# =============================================================================
# Tests 3-step bank linking flow:
#   1. Login with test credentials
#   2. Navigate: More → Profile → KYC → Link Bank Account
#   3. Step 1: Enter IFSC → Verify IFSC → confirm bank info
#   4. Step 2: Enter account number + holder name → Verify Account
#   5. Step 3: Select account type → Set primary → Link → verify success
#   6. Navigate: Done → back
# =============================================================================

appId: com.anonymous.Toroloom
---
# ── 0. Kill app → relaunch fresh (prevents state leakage between sequential flows) ──
- stopApp

# ── 1. Login ───────────────────────────────────────────────────────────────
- assertVisible:
    id: "login-email-input"
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000

# ── 2. Navigate: More → Profile ──────────────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- tapOn:
    id: "more-profile-card"
- waitForAnimationToEnd
- assertVisible:
    id: "kyc-status-card"

# ── 3. Navigate to KYC section via step row (testID — i18n-safe) ─────────
- scrollUntilVisible:
    element:
      id: "kyc-step-bank"
    direction: DOWN
- tapOn:
    id: "kyc-step-bank"
- waitForAnimationToEnd

# ── 4. Verify Bank Linking Screen ─────────────────────────────────────────
- assertVisible:
    text: "Step 1 of 3 — IFSC"
- assertVisible:
    text: "Enter IFSC Code"
- assertVisible:
    text: "Format:"

# ── 6. Step 1: Enter IFSC and Verify ──────────────────────────────────────
- tapOn:
    text: "HDFC0001234"
- inputText: "HDFC0001234"
- waitForAnimationToEnd

# Verify button via testID — i18n-safe
- tapOn:
    id: "bank-verify-ifsc-btn"
- waitForAnimationToEnd:
    timeout: 10000

# ── 7. Verify IFSC Result → Step 2 ────────────────────────────────────────
- assertVisible:
    text: "Step 2 of 3 — Account Details"
- assertVisible:
    text: "HDFC Bank"          # mock data — not i18n'd ✅
- assertVisible:
    text: "Andheri West"       # mock data — not i18n'd ✅
- assertVisible:
    text: "IFSC: HDFC0001234"  # mock data — not i18n'd ✅
- assertVisible:
    text: "Account Number"     # hardcoded — not i18n'd ✅

# ── 8. Step 2: Enter Account Number + Holder Name ─────────────────────────
- tapOn:
    text: "Enter account number"
- inputText: "123456789012"
- hideKeyboard

- tapOn:
    text: "As per bank records"
- inputText: "RAHUL SHARMA"
- hideKeyboard

# Tap Verify Account via testID — i18n-safe
- tapOn:
    id: "bank-verify-account-btn"
- waitForAnimationToEnd:
    timeout: 10000

# ── 9. Verify Account Verification → Step 3 ───────────────────────────────
- assertVisible:
    text: "Account Verified"       # i18n'd -> keep but optional
    optional: true
- assertVisible:
    text: "Account holder name matches bank records"  # i18n'd
    optional: true
- assertVisible:
    text: "Account Type"          # hardcoded — not i18n'd ✅

# ── 10. Step 3: Select Account Type + Primary + Link ──────────────────────
# Savings is already selected by default, just proceed
# Toggle set as primary via testID — i18n-safe
- tapOn:
    id: "bank-set-primary-toggle"
- waitForAnimationToEnd

# Tap link bank via testID — i18n-safe
- tapOn:
    id: "bank-link-btn"
- waitForAnimationToEnd:
    timeout: 10000

# ── 11. Verify Account Linked Successfully ────────────────────────────────
- assertVisible:
    text: "HDFC Bank"             # mock data ✅
- assertVisible:
    text: "Savings"               # hardcoded type ✅
- assertVisible:
    text: "Primary Account"       # hardcoded label ✅

# ── 12. Tap Done and navigate back via testID — i18n-safe ─────────────────
- tapOn:
    id: "bank-done-btn"
- waitForAnimationToEnd

- assertVisible:
    id: "kyc-status-card"
