# =============================================================================
# Aadhaar eKYC Flow
# =============================================================================
# Tests the KYC → Aadhaar verification path:
#   1. Login with test credentials
#   2. Navigate: More → Profile & KYC → KYC & Banks tab
#   3. Open Aadhaar eKYC from the KYC step list
#   4. Enter Aadhaar → give consent → Send OTP
#   5. Enter demo OTP (123456) → Verify OTP → "Aadhaar Verified ✓"
#   6. Go back to KYC
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 1. Login ───────────────────────────────────────────────────────────────
# Cold-start can be slow on the cloud emulator — wait up to 60s
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "home-greeting"

# ── 2. Navigate: More → Profile & KYC → KYC & Banks ───────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Profile & KYC"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    text: "Profile & KYC"
- waitForAnimationToEnd

- tapOn:
    text: "KYC & Banks"
- waitForAnimationToEnd

# ── 3. Open Aadhaar eKYC ───────────────────────────────────────────────────
- assertVisible:
    text: "KYC Verification"
- scrollUntilVisible:
    element:
      text: "Aadhaar Verification"
    direction: DOWN
- tapOn:
    text: "Aadhaar Verification"
- waitForAnimationToEnd

# ── 4. Step 1: Aadhaar + Consent + OTP ─────────────────────────────────────
- assertVisible:
    text: "Aadhaar eKYC"
- assertVisible:
    text: "Step 1 of 2"
- assertVisible:
    text: "Enter Aadhaar Number"

# Input placeholder is "XXXX XXXX XXXX"
- tapOn:
    text: "XXXX XXXX XXXX"
- inputText: "123412341234"
- hideKeyboard

# Consent checkbox text is a long sentence — match its stable prefix
- assertVisible:
    text: "I consent to verify my Aadhaar"
- tapOn:
    text: "I consent to verify my Aadhaar"

- assertVisible:
    text: "Send OTP"
- tapOn:
    text: "Send OTP"
- waitForAnimationToEnd:
    timeout: 10000

# ── 5. Step 2: OTP Entry ───────────────────────────────────────────────────
- assertVisible:
    text: "Step 2 of 2"
# Demo hint tells the OTP to use
- assertVisible:
    text: "123456"

# The OTP is 6 single-digit boxes; tap the first box and type the full
# code — the screen's handleChange auto-advances focus.
- tapOn:
    index: 0
- inputText: "123456"
- hideKeyboard
- waitForAnimationToEnd

- assertVisible:
    text: "Verify OTP"
- tapOn:
    text: "Verify OTP"
- waitForAnimationToEnd:
    timeout: 10000

# ── 6. Verify Result ───────────────────────────────────────────────────────
- assertVisible:
    text: "Aadhaar Verified"
- assertVisible:
    text: "Verified"

# ── 7. Back to KYC ─────────────────────────────────────────────────────────
- tapOn:
    text: "Go back"
- waitForAnimationToEnd
- assertVisible:
    text: "KYC Verification"
