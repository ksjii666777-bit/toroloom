# =============================================================================
# Aadhaar eKYC Flow
# =============================================================================
# Tests the KYC → Aadhaar verification path:
#   1. Login with test credentials
#   2. Navigate: More → Profile & KYC → KYC & Banks tab
#   3. Open Aadhaar eKYC from the KYC step list
#   4. Enter Aadhaar → give consent → Send OTP
#   5. Enter demo OTP (123456) → Verify OTP → "Aadhaar Verified ✓"
#   6. Go back to KYC
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 1. Login ───────────────────────────────────────────────────────────────
# Cold-start can be slow on the cloud emulator — wait up to 60s
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "home-greeting"

# ── 2. Navigate: More → Profile & KYC → KYC & Banks ───────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd:
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Profile & KYC"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    text: "Profile & KYC"
- waitForAnimationToEnd:
    timeout: 10000

- tapOn:
    text: "KYC & Banks"
- waitForAnimationToEnd:
    timeout: 10000

# ── 3. Open Aadhaar eKYC ───────────────────────────────────────────────────
- assertVisible:
    text: "KYC Verification"
- scrollUntilVisible:
    element:
      text: "Aadhaar Verification"
    direction: DOWN
- tapOn:
    text: "Aadhaar Verification"
- waitForAnimationToEnd:
    timeout: 10000

# ── 4. Step 1: Aadhaar + Consent + OTP ─────────────────────────────────────
- assertVisible:
    text: "Aadhaar eKYC"
- assertVisible:
    text: "Step 1 of 2"
- assertVisible:
    text: "Enter Aadhaar Number"

# Input placeholder is "XXXX XXXX XXXX". Aadhaar format: 12 digits, no
# leading 0/1 (backend regex ^[2-9]\d{11}$) — 234123412341 passes it
# (1234... starts with 1 and is rejected).
- tapOn:
    text: "XXXX XXXX XXXX"
- inputText: "234123412341"
- hideKeyboard

# Consent checkbox text is ONE long hardcoded sentence — full-node regex on
# its stable prefix (plain text would need the ENTIRE sentence)
- assertVisible:
    text: "I consent to verify my Aadhaar.*"
- tapOn:
    text: "I consent to verify my Aadhaar.*"

- assertVisible:
    text: "Send OTP"
- tapOn:
    text: "Send OTP"
- waitForAnimationToEnd:
    timeout: 10000

# ── 5. Step 2: OTP Entry ───────────────────────────────────────────────────
# The OTP screen mounts after the Send OTP POST returns — wait for it
# rather than racing the network round-trip.
- extendedWaitUntil:
    visible:
      text: "Step 2 of 2"
    timeout: 30000
# Demo hint text is one inline node: "For demo/mock: use 123456" —
# regex on the stable prefix (the bare "123456" node does not exist)
- assertVisible:
    text: "For demo/mock: use.*"

# The OTP is 6 single-digit boxes; tap the FIRST box (stable testID) and
# type the full code — the screen distributes the digits across the boxes.
- tapOn:
    id: "aadhaar-otp-0"
- inputText: "123456"
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 10000

# Verify button is disabled (dimmed) until all 6 digits are filled — the
# input above fills all of them, so the button is tappable now. Give the
# lazy screen a moment before asserting the label.
- extendedWaitUntil:
    visible:
      text: "Verify OTP"
    timeout: 20000
- tapOn:
    text: "Verify OTP"
- waitForAnimationToEnd:
    timeout: 10000

# ── 6. Verify Result ───────────────────────────────────────────────────
# Result title is "Aadhaar Verified ✓" (one node with the checkmark) — regex
- extendedWaitUntil:
    visible:
      text: "Aadhaar Verified.*"
    timeout: 60000
- assertVisible:
    text: "Your Aadhaar has been verified successfully via UIDAI"

# ── 7. Back to KYC ────────────────────────────────────────────────────────
# AadhaarVerification is a root-stack screen ABOVE MainTabs — hardware BACK
# pops to the underlying tab (More).
- pressKey: BACK
- waitForAnimationToEnd:
    timeout: 10000
- runFlow:
    when:
      notVisible:
        text: "KYC Verification"
    commands:
      - tapOn:
          id: "tab-more"
      - waitForAnimationToEnd:
          timeout: 5000
- assertVisible:
    text: "KYC Verification"
