# =============================================================================
# Achievements & Gamification Flow
# =============================================================================
# Tests achievements screen with level card, badges grid, and badge detail:
#   1. Login with test credentials
#   2. Navigate: More → Achievements
#   3. Verify header: title + subtitle (unlocked/total count)
#   4. Verify Level Card: Total XP
#   5. Verify Stats Grid: Total Badges, Unlocked, Locked, Completion
#   6. Verify Tab Toggle: All Badges / Unlocked (N)
#   7. Tap a badge → verify modal with Requirement/Status
#   8. Dismiss modal → navigate back
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 1. Login ───────────────────────────────────────────────────────────────
# Cold-start can be slow on the cloud emulator — wait up to 60s
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "home-greeting"

# ── 2. Navigate: More → Achievements ──────────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Achievements"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    text: "Achievements"
- waitForAnimationToEnd

# ── 3. Verify Header ───────────────────────────────────────────────────────
- assertVisible:
    text: "Achievements"
# Subtitle is parameterized: "{{unlocked}} of {{total}} badges unlocked"
# — one text node, so match with a full-node regex.
- assertVisible:
    text: ".*badges unlocked"

# ── 4. Verify Level Card ───────────────────────────────────────────────────
# "{{xp}} Total XP" — parameterized, full-node regex
- assertVisible:
    text: ".*Total XP"

# ── 5. Verify Stats Grid ───────────────────────────────────────────────────
- assertVisible:
    text: "Total Badges"
- assertVisible:
    text: "Unlocked"
- assertVisible:
    text: "Locked"
- assertVisible:
    text: "Completion"

# ── 6. Verify Tab Toggle ───────────────────────────────────────────────────
- assertVisible:
    text: "All Badges"
# "Upcoming Challenges" section sits BELOW the badges grid — scroll to it
- scrollUntilVisible:
    element:
      text: "Upcoming Challenges"
    direction: DOWN
    speed: 20
    timeout: 30000

# ── 7. Verify Badges Grid ──────────────────────────────────────────────────
# Mock badges (mockData.ts): b1 unlocked by default
- assertVisible:
    text: "First Trade"
    optional: true
- assertVisible:
    text: "Learning Streak"
    optional: true

# ── 8. Tap first unlocked badge → verify detail modal ──────────────────────
- tapOn:
    text: "First Trade"
    optional: true
- waitForAnimationToEnd

# Verify modal content
- assertVisible:
    text: "Requirement"
    optional: true
- assertVisible:
    text: "Status"
    optional: true
- assertVisible:
    text: "Got it!"
    optional: true

# ── 9. Dismiss modal ──────────────────────────────────────────────────────
- tapOn:
    text: "Got it!"
    optional: true
- waitForAnimationToEnd

# ── 10. Navigate back ─────────────────────────────────────────────────────
# Achievements pushes as a root-stack screen ABOVE MainTabs — the tab bar
# is covered. Hardware BACK pops to the More tab underneath.
- pressKey: BACK
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "more-title"
    commands:
      - tapOn:
          id: "tab-more"
      - waitForAnimationToEnd:
          timeout: 5000

- assertVisible:
    id: "more-title"
