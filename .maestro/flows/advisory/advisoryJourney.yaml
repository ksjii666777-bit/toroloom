# =============================================================================
# Advisory Marketplace Flow — Browse Advisors & View Profile
# =============================================================================
# Tests the Advisory Marketplace screens:
#   1. Login with test credentials
#   2. Navigate: More → Advisors
#   3. Verify Advisor List renders (title, SEBI compliance note, advisor cards)
#   4. Search filter (e.g., "khanna") and clear
#   5. Filter by type chip (RIA / RA)
#   6. Open an advisor profile → verify SEBI badge + Book a Session
#   7. Navigate back to the list, then back to More
#
# Uses testID-based targeting for i18n/time-independent robustness
# (login + tab + greeting assertions), with text fallbacks for content.
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 1. Login ───────────────────────────────────────────────────────────────
# Wait for the login screen to load (testID — app text includes an emoji:
# "Welcome Back! 👋", so text matchers are unreliable here)
- assertVisible:
    id: "login-email-input"
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
# Dismiss the keyboard so the password field is visible again (the
# keyboard pushes it off-screen on smaller emulator viewports)
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000

# Navigate to the Home tab (greeting is time-dependent — "Good Morning/"
# "Good Afternoon/"Good Evening" — so assert the testID, not the text)
- tapOn:
    text: "Home"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "home-greeting"

# ── 2. Navigate: More → Advisors ──────────────────────────────────────────
- tapOn:
    text: "More"
- waitForAnimationToEnd
- assertVisible:
    id: "more-title"
- scrollUntilVisible:
    element:
      id: "menu-AdvisorList"
    direction: DOWN
    speed: 80
    timeout: 30000
- tapOn:
    id: "menu-AdvisorList"
- waitForAnimationToEnd

# ── 3. Verify Advisor List Screen ─────────────────────────────────────────
- assertVisible:
    text: "Advisors"

# SEBI compliance note (partial regex — the note is a full sentence)
- assertVisible:
    text: ".*SEBI-registered.*"

# An approved advisor card renders with name and fee (fee is "₹1500")
- assertVisible:
    text: "Dr. Rajesh Khanna"
- assertVisible:
    text: ".*₹1500.*"

# ── 4. Search filter ──────────────────────────────────────────────────────
- tapOn:
    id: "advisory-search"
- inputText: "khanna"
- hideKeyboard
- waitForAnimationToEnd

# Only the matching advisor remains (list reloads async — wait for it)
- extendedWaitUntil:
    visible:
      text: "Dr. Rajesh Khanna"
    timeout: 20000
- assertNotVisible:
    text: "Priya Sharma"

# Clear the search
- eraseText
- waitForAnimationToEnd

# ── 5. Filter by type chip (RA) ───────────────────────────────────────────
- tapOn:
    id: "chip-RA"
- waitForAnimationToEnd

# RA advisors (Amit Verma) visible, RIA (Dr. Rajesh Khanna) hidden
- assertVisible:
    text: "Amit Verma"
- assertNotVisible:
    text: "Dr. Rajesh Khanna"

# Reset back to All
- tapOn:
    id: "chip-all"
- waitForAnimationToEnd
- assertVisible:
    text: "Dr. Rajesh Khanna"

# ── 6. Open an Advisor Profile ────────────────────────────────────────────
- tapOn:
    text: "Dr. Rajesh Khanna"
- waitForAnimationToEnd

# Verify detail screen (SEBI badge text is "SEBI RIA Reg. · INA000001234")
- assertVisible:
    text: "Advisor Profile"
- assertVisible:
    text: ".*SEBI RIA Reg.*"

# The Book a Session card is below the fold — scroll to it
- scrollUntilVisible:
    element:
      text: "Book a Session"
    direction: DOWN
    speed: 60
    timeout: 15000
- assertVisible:
    text: "Book a Session"

# ── 7. Navigate back to the list, then back to More ───────────────────────
# The header (with the back button) scrolled off-screen — scroll back up
- scrollUntilVisible:
    element:
      text: "Go back"
    direction: UP
    speed: 60
    timeout: 15000
- tapOn:
    text: "Go back"
- waitForAnimationToEnd
- assertVisible:
    text: "Advisors"

- tapOn:
    text: "Go back"
- waitForAnimationToEnd
- assertVisible:
    text: "More"
