# =============================================================================
# Chat Room Flow — Messages & Chat
# =============================================================================
# Tests the Chat (Messages) feature:
#   1. Login with test credentials
#   2. Navigate: More → Messages
#   3. Verify Chat Room List screen ("Chat Rooms" header + search box)
#   4. Tap on the first room ("Trading Discussion")
#   5. Verify Chat Room screen renders
#   6. Type and send a message
#   7. Verify message appears in the chat
#   8. Navigate back to the room list, then to More
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 1. Login ───────────────────────────────────────────────────────────────
# Cold-start can be slow on the cloud emulator — wait up to 60s
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000

# ── 2. Navigate: More → Messages ──────────────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Messages"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    text: "Messages"
- waitForAnimationToEnd

# ── 3. Verify Chat Room List Screen ────────────────────────────────────────
# Header title is community.chatRooms = "Chat Rooms"
- assertVisible:
    text: "Chat Rooms"

# Verify the first mock room card
- assertVisible:
    text: "Trading Discussion"

# ── 4. Tap on the First Room Card ─────────────────────────────────────────
- tapOn:
    text: "Trading Discussion"
- waitForAnimationToEnd

# ── 5. Verify Chat Room Screen ────────────────────────────────────────────
# Input bar is rendered on the room screen (placeholder = typeMessage)
- assertVisible:
    text: "Type a message..."

# ── 6. Type and Send a Message ────────────────────────────────────────────
- tapOn:
    text: "Type a message..."
- inputText: "Hello team! Testing chat from E2E."
- hideKeyboard

# Send button has no testID — it is the icon button in the input bar
- tapOn:
    id: "com.toroloom.app:id/send"
    optional: true
- runFlow:
    when:
      notVisible:
        text: "Hello team! Testing chat from E2E."
    commands:
      # Fallback: tap the send icon area (right edge of the input bar)
      - tapOn:
          point: "92%,94%"
- waitForAnimationToEnd

# ── 7. Verify Message Appears ─────────────────────────────────────────────
- assertVisible:
    text: "Hello team! Testing chat from E2E."

# ── 8. Navigate Back to Room List ─────────────────────────────────────────
- tapOn:
    text: "Go back"
- waitForAnimationToEnd

# Verify back on the room list
- assertVisible:
    text: "Chat Rooms"

# ── 9. Navigate Back to More Screen ───────────────────────────────────────
- tapOn:
    text: "Go back"
- waitForAnimationToEnd

- assertVisible:
    id: "more-title"
