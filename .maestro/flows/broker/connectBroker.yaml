# =============================================================================
# Broker Connection Flow — SnapTrade OAuth Gateway
# =============================================================================
# Tests the broker connection experience:
#   1. Login with test credentials
#   2. Navigate to Connect Broker (from More screen)
#   3. Verify ConnectBrokerView renders correctly:
#      - Header + SnapTrade subtitle
#      - Status pills: O AUTH 2.0, 20+ BROKERS, SECURE
#      - Broker grid with 3 cards (Angel One, Zerodha, Groww) + taglines
#      - SnapTrade info card
#   4. Tapping a broker now opens the DEVICE BROWSER (SnapTrade OAuth
#      portal via Linking.openURL) — no in-app WebView anymore. The E2E
#      emulator has no browser session to complete OAuth, so we only
#      verify the "Connection Failed" error alert path (no oauthUrl in
#      test env → API error → alert) and dismiss it.
#   5. Verify no connected-state elements are visible
#   6. Navigate back to More screen
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ═══════════════════════════════════════════════════════════════════════════
# 1. Login
# ═══════════════════════════════════════════════════════════════════════════
# Cold-start can be slow on the cloud emulator — wait up to 60s
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000

# Navigate to Home tab
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "home-greeting"

# ═══════════════════════════════════════════════════════════════════════════
# 2. Navigate: More → Connect Broker
# ═══════════════════════════════════════════════════════════════════════════
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Connect Broker"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    text: "Connect Broker"
- waitForAnimationToEnd:
    timeout: 10000

# ═══════════════════════════════════════════════════════════════════════════
# 3. Verify ConnectBrokerView Renders Correctly
# ═══════════════════════════════════════════════════════════════════════════
# Header
- assertVisible:
    text: "Connect Broker"
- assertVisible:
    text: "1-tap OAuth — powered by SnapTrade"

# Status pills
- assertVisible:
    text: "O AUTH 2.0"
- assertVisible:
    text: "20+ BROKERS"
- assertVisible:
    text: "SECURE"

# Section + broker grid
- assertVisible:
    text: "Choose Your Broker"
- assertVisible:
    text: "Select a broker — no API keys needed"
- assertVisible:
    text: "Angel One"
- assertVisible:
    text: "Zerodha"
# Groww is row 2 of the 2-col grid — below the fold on the emulator viewport,
# so scroll it into view before asserting.
- scrollUntilVisible:
    element:
      text: "Groww"
    direction: DOWN
    speed: 20
    timeout: 20000
- assertVisible:
    text: "Groww"

# Verify broker taglines — each card's tagline sits BELOW the fold in the
# 2-col grid, and scrolling to a lower card pushes the upper cards' taglines
# off the TOP of the viewport. Scroll to each tagline right before asserting
# it.
- scrollUntilVisible:
    element:
      text: "India's largest retail broking house"
    direction: DOWN
    speed: 20
    timeout: 20000
- assertVisible:
    text: "India's largest retail broking house"
- scrollUntilVisible:
    element:
      text: "India's biggest stock broker"
    direction: DOWN
    speed: 20
    timeout: 20000
- assertVisible:
    text: "India's biggest stock broker"
- scrollUntilVisible:
    element:
      text: "Simple, modern investing platform"
    direction: DOWN
    speed: 20
    timeout: 20000
- assertVisible:
    text: "Simple, modern investing platform"

# SnapTrade info card (scroll down if needed)
- scrollUntilVisible:
    element:
      text: "SnapTrade OAuth Gateway"
    direction: DOWN
- assertVisible:
    text: "SnapTrade OAuth Gateway"

# ═══════════════════════════════════════════════════════════════════════════
# 4. Broker tap → device-browser OAuth (no in-app WebView)
# ═══════════════════════════════════════════════════════════════════════════
# The connect call needs the SnapTrade backend; on failure (or when no
# oauthUrl is returned) an error alert appears. Accept either outcome:
# an alert ("Connection Failed") or the screen staying put.
- scrollUntilVisible:
    element:
      text: "Zerodha"
    direction: UP
- tapOn:
    text: "Zerodha"
- waitForAnimationToEnd:
    timeout: 10000

- runFlow:
    when:
      visible:
        text: "Connection Failed"
    commands:
      - assertVisible:
          text: "Please check your internet connection and try again."
      - tapOn:
          text: "OK"
      - waitForAnimationToEnd:
          timeout: 3000

# ═══════════════════════════════════════════════════════════════════════════
# 5. Verify No Connected State
# ═══════════════════════════════════════════════════════════════════════════
# Since we never completed a real OAuth, no session should be stored and
# no connection banner should appear.
- assertNotVisible:
    text: "Test API"
- assertNotVisible:
    text: "Session Active"
- assertVisible:
    text: "Choose Your Broker"

# ═════════════════════════════════════════════════════════════════════
# 6. Navigate Back to More Screen
# ═════════════════════════════════════════════════════════════════════
# BrokerConnect is a root-stack screen ABOVE MainTabs — the tab bar is
# covered there, so tab taps fail. Hardware BACK pops to the More tab.
- pressKey: BACK
- waitForAnimationToEnd
# More keeps its previous scroll offset after BACK — scroll the title back
# into view, then recover via the tab bar if needed.
- scrollUntilVisible:
    element:
      id: "more-title"
    direction: UP
    speed: 20
    timeout: 10000
- runFlow:
    when:
      notVisible:
        id: "more-title"
    commands:
      - tapOn:
          id: "tab-more"
      - waitForAnimationToEnd:
          timeout: 5000
      - scrollUntilVisible:
          element:
            id: "more-title"
          direction: UP
          speed: 20
          timeout: 10000

# Confirm we're back on the More screen
- assertVisible:
    id: "more-title"
