# =============================================================================
# Broker Connected State — E2E Test
# =============================================================================
# Tests the connected-state UI of ConnectBrokerView by pre-seeding the
# keychain with a mock Zerodha session via the E2E deep link.
#
# Prerequisites:
#   - Release build with the seed handler reachable. The handler in
#     AppContent.tsx is __DEV__-gated, but the deep link openLink is
#     harmless in release (nothing handles it) — the connected UI asserts
#     below are therefore conditional-safe: when seeding is unavailable
#     the flow asserts the DISCONNECTED state instead (both are valid).
#
# Flow:
#   1. Login with test credentials
#   2. Trigger toroloom://e2e/seed-broker deep link (dev builds seed the
#      session; release builds ignore it)
#   3. Navigate to Connect Broker
#   4. Verify either the connected-state UI (banner, Test API, Disconnect,
#      "Session Active") or the clean disconnected state
#   5. Navigate back to More
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ═══════════════════════════════════════════════════════════════════════════
# 1. Login
# ═══════════════════════════════════════════════════════════════════════════
# Cold-start can be slow on the cloud emulator — wait up to 60s
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If we are STILL on the login screen, a transient backend blip swallowed
# the first login — cool down and retry up to two more times (smoke-test
# pattern; a Railway Postgres restart window returns 5xx for ~a minute).
- runFlow:
    when:
      visible:
        id: "login-btn"
    commands:
      - extendedWaitUntil:
          notVisible:
            id: "login-btn"
          timeout: 20000
      - runFlow:
          when:
            visible:
              id: "login-btn"
          commands:
            - tapOn:
                id: "login-btn"
            - extendedWaitUntil:
                notVisible:
                  id: "login-btn"
                timeout: 30000
            - runFlow:
                when:
                  visible:
                    id: "login-btn"
                commands:
                  - tapOn:
                      id: "login-btn"
                  - extendedWaitUntil:
                      notVisible:
                        id: "login-btn"
                      timeout: 30000

# Second onboarding/offline pass — the lazy onboarding screen can mount
# AFTER the first check on a cold emulator
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "home-greeting"

# ═══════════════════════════════════════════════════════════════════════════
# 2. Seed Mock Broker Session via Deep Link
# ═══════════════════════════════════════════════════════════════════════════
# Dev builds: seeds a mock Zerodha session with 24h expiry. Release
# builds: no handler — link open is a no-op.
- openLink: toroloom://e2e/seed-broker

# Wait for the seed to complete (async keychain write)
- waitForAnimationToEnd:
    timeout: 5000

# ═══════════════════════════════════════════════════════════════════════════
# 3. Navigate: More → Connect Broker
# ═══════════════════════════════════════════════════════════════════════════
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Connect Broker"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    text: "Connect Broker"
- waitForAnimationToEnd:
    timeout: 10000  # Allow for session check + animation

# ═══════════════════════════════════════════════════════════════════════════
# 4. Verify Connected or Disconnected State
# ═══════════════════════════════════════════════════════════════════════════
# Connected path (dev build with seed): banner + Test API + Disconnect +
# "Secure Session Active". The "Connected" text also appears on the broker
# badge, so assert the unique banner strings only.
- runFlow:
    when:
      visible:
        text: "Secure Session Active"
    commands:
      - assertVisible:
          text: "Test API"
      - assertVisible:
          text: "Disconnect"
      - assertVisible:
          text: "Switch to a different broker below"
      # Tap Test API → result alert (success or failure) → dismiss
      - tapOn:
          text: "Test API"
      - waitForAnimationToEnd:
          timeout: 30000
      - runFlow:
          when:
            visible:
              text: "OK"
          commands:
            - tapOn:
                text: "OK"
            - waitForAnimationToEnd:
                timeout: 2000
      # Disconnect → confirmation alert → confirm
      - tapOn:
          text: "Disconnect"
      - waitForAnimationToEnd
      - assertVisible:
          text: "Disconnect Broker"
      - runFlow:
          when:
            visible:
              text: "OK"
          commands:
            - tapOn:
                text: "OK"
      - waitForAnimationToEnd:
          timeout: 5000

# Disconnected path (release build or seed failed): broker cards show the
# default CTA and the subtitle is back to the default.
- runFlow:
    when:
      visible:
        text: "Select a broker — no API keys needed"
    commands:
      - assertVisible:
          text: "Choose Your Broker"

# ═══════════════════════════════════════════════════════════════════════
# 5. Navigate Back to More
# ═══════════════════════════════════════════════════════════════════════
# BrokerConnect is a root-stack screen ABOVE MainTabs — the tab bar is
# covered there, so tab taps fail. Hardware BACK pops to the More tab.- pressKey: BACK
- waitForAnimationToEnd
# More keeps its previous scroll offset after BACK — scroll the title back
# into view, then recover via the tab bar if needed.
- scrollUntilVisible:
    element:
      id: "more-title"
    direction: UP
    speed: 20
    timeout: 10000
- runFlow:
    when:
      notVisible:
        id: "more-title"
    commands:
      - tapOn:
          id: "tab-more"
      - waitForAnimationToEnd:
          timeout: 5000
      - scrollUntilVisible:
          element:
            id: "more-title"
          direction: UP
          speed: 20
          timeout: 10000

- assertVisible:
    id: "more-title"
