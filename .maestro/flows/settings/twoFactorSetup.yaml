# =============================================================================
# Two-Factor Authentication Setup Flow — Security Settings
# =============================================================================
# Tests full 2FA setup flow:
#   1. Login with test credentials
#   2. Navigate: More → Security → Two-Factor Auth
#   3. View the setup info with benefits
#   4. Tap "Set Up Two-Factor Auth" → generate QR + secret
#   5. Enter mock 6-digit code → "Verify & Enable 2FA"
#   6. View backup codes → tap "I've Saved My Backup Codes"
#   7. Tap "Done" → navigate back
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 0. Kill app → relaunch fresh (prevents state leakage between sequential flows) ──

# ── 1. Login ───────────────────────────────────────────────────────────────
- assertVisible:
    id: "login-email-input"
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000

# ── 2. Navigate: More → Security ──────────────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "menu-SecuritySettings"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    id: "menu-SecuritySettings"
- waitForAnimationToEnd
- assertVisible:
    text: "Security Settings"

# ── 3. Navigate to Two-Factor Auth ─────────────────────────────────────────
# The 2FA card is uniquely identified by its subtitle (the section header and
# card share the "Two-Factor Authentication" title, so tapping that text is
# ambiguous).
- scrollUntilVisible:
    element:
      text: "TOTP-based 2FA via authenticator app"
    direction: DOWN
    speed: 20
    timeout: 10000
- tapOn:
    text: "TOTP-based 2FA via authenticator app"
- waitForAnimationToEnd

# ── 4. Verify 2FA Setup Screen Info ────────────────────────────────────────
- assertVisible:
    text: "Two-Factor Authentication"
- assertVisible:
    text: "Protects against unauthorized access"
- assertVisible:
    text: "Set Up Two-Factor Auth"

# ── 5. Tap Set Up Two-Factor Auth ──────────────────────────────────────────
- assertVisible:
    text: "Set Up Two-Factor Auth"
- tapOn:
    text: "Set Up Two-Factor Auth"
- waitForAnimationToEnd:
    timeout: 10000

# ── 6. Verify QR + Code Input ──────────────────────────────────────────────
- assertVisible:
    text: "Scan with Authenticator App"
- assertVisible:
    text: "Can't scan? Enter key manually"

# The 6-digit code input should be visible
- assertVisible:
    text: "Enter the 6-digit code from your authenticator app"

# ── 7. Enter mock verification code ────────────────────────────────────────
# Tap the first OTP box to focus the hidden input, then type the code
- tapOn:
    id: "otp-input"
- inputText: "123456"
- waitForAnimationToEnd

# ── 8. Verify all 6 digits show in OTP boxes ────────────────────────────────
- assertVisible:
    text: "6/6 digits entered"
- assertVisible:
    text: "Verify & Enable 2FA"
- tapOn:
    text: "Verify & Enable 2FA"
- waitForAnimationToEnd:
    timeout: 10000

# ── 9. Verify Backup Codes Screen ──────────────────────────────────────────
- assertVisible:
    text: "2FA Enabled"
- assertVisible:
    text: "Backup Codes"
- assertVisible:
    text: "Save these one-time recovery codes"
- assertVisible:
    text: "I've Saved My Backup Codes"

# ── 10. Confirm Backup Codes Saved ─────────────────────────────────────────
- tapOn:
    text: "I've Saved My Backup Codes"
- waitForAnimationToEnd

# ── 11. Tap Done to go back ────────────────────────────────────────────────
- tapOn:
    text: "Done"
- waitForAnimationToEnd

- assertVisible:
    text: "Security Settings"
