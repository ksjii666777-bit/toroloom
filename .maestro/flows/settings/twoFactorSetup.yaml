# =============================================================================
# Two-Factor Setup Flow
# =============================================================================
# Tests the 2FA enable journey:
#   1. Login with test credentials
#   2. More → Security → Two-Factor Authentication
#   3. Set Up Two-Factor Auth → QR screen
#   4. Enter demo code 123456 → Verify & Enable 2FA
#   5. Backup codes screen → confirm saved → Done
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 1. Login ───────────────────────────────────────────────────────────────
# Cold-start can be slow on the cloud emulator — wait up to 60s
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000

# ── 2. More → Security ─────────────────────────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "menu-SecuritySettings"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    id: "menu-SecuritySettings"
- waitForAnimationToEnd
- assertVisible:
    text: "Security Settings"

# ── 3. Open Two-Factor Authentication ──────────────────────────────────────
# The 2FA card row shows the TOTP subtitle
- scrollUntilVisible:
    element:
      text: "TOTP-based 2FA via authenticator app"
    direction: DOWN
    speed: 20
    timeout: 10000
- tapOn:
    text: "TOTP-based 2FA via authenticator app"
- waitForAnimationToEnd

- assertVisible:
    text: "Two-Factor Authentication"
- assertVisible:
    text: "Protects against unauthorized access"

# The setup button appears only when 2FA is not yet enabled — the test
# account starts disabled, so it should be there. (If a previous run
# somehow enabled 2FA the account shows the manage view instead; the
# enable-state is recoverable by DB reset, not by UI.)
- assertVisible:
    text: "Set Up Two-Factor Auth"
- tapOn:
    text: "Set Up Two-Factor Auth"
- waitForAnimationToEnd:
    timeout: 10000

# ── 4. QR + Code Entry ─────────────────────────────────────────────────────
# generate2FASetup creates the QR section — give it time to resolve
- extendedWaitUntil:
    visible:
      text: "Scan with Authenticator App"
    timeout: 20000
- assertVisible:
    text: "Can't scan? Enter key manually"

# Code hint: "Enter the 6-digit code shown in your authenticator app" —
# shown only while the field is EMPTY; after typing it flips to
# "digits entered N/6", so assert BEFORE the input
- assertVisible:
    text: "Enter the 6-digit code shown in your authenticator app"

# Type the code but DO NOT verify: the backend uses REAL TOTP verification
# (no demo bypass), so "123456" can never succeed and the enable step is
# untestable end-to-end. Asserting the input state is the reachable depth.
- tapOn:
    id: "otp-input"
- inputText: "123456"
- waitForAnimationToEnd

# "{{digits}} digits entered" progress line — parameterized full node
- assertVisible:
    text: ".*digits entered 6/6"
- assertVisible:
    text: "Verify & Enable 2FA"

# ── 5. Exit without enabling (BACK pops to Security Settings) ──────────────
- pressKey: BACK
- waitForAnimationToEnd

# ── 6. Back on Security Settings ───────────────────────────────────────────
- assertVisible:
    text: "Security Settings"
