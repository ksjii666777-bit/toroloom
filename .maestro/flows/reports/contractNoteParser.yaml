# =============================================================================
# Contract Note Parser Flow
# =============================================================================
# Tests the Reports → Contract Note Parser tool:
#   1. Login with test credentials
#   2. Navigate: More → Reports (Analytics) → Contract Note Parser
#   3. Verify upload/paste action cards
#   4. Paste-text empty parse → "Empty" alert
#   5. Paste a sample Zerodha contract note → parse → verify extracted stats
#   6. Clear → verify form reset
#   7. Navigate back to Analytics
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# Cold-start can be slow on the cloud emulator — wait up to 60s
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "home-greeting"

# ── 2. Navigate: More → Reports ────────────────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd:
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Reports"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    text: "Reports"
- waitForAnimationToEnd:
    timeout: 10000

# ── 3. Reports Screen (Analytics) ──────────────────────────────────────────
- assertVisible:
    text: "Analytics"

# Tools tile at the top of the scroll content
- scrollUntilVisible:
    element:
      text: "Contract Note Parser"
    direction: DOWN
- tapOn:
    text: "Contract Note Parser"
- waitForAnimationToEnd:
    timeout: 10000

# ── 4. Verify Parser Screen ────────────────────────────────────────────────
- assertVisible:
    text: "Contract Note Parser"
- assertVisible:
    text: "Extract trades from broker contract notes automatically"

# Action cards are titled "Upload PDF" / "Batch Upload" (subtitles "Parse a
# single contract note PDF" / "Process multiple contract notes at once");
# lower cards sit below the fold — scroll to them
- assertVisible:
    text: "Upload PDF"
- assertVisible:
    text: "Parse a single contract note PDF"
- scrollUntilVisible:
    element:
      text: "Batch Upload"
    direction: DOWN
    speed: 20
    timeout: 30000
- assertVisible:
    text: "Batch Upload"
- assertVisible:
    text: "Process multiple contract notes at once"

# Paste card is titled "Paste Text" with subtitle "Paste raw contract note
# text" (reports namespace) — below the Batch card, scroll to it
- scrollUntilVisible:
    element:
      text: "Paste Text"
    direction: DOWN
    speed: 20
    timeout: 30000
- assertVisible:
    text: "Paste Text"
- assertVisible:
    text: "Paste raw contract note text"

# ── 5. Paste Mode: Empty Parse ─────────────────────────────────────────────
- tapOn:
    text: "Paste Text"
- waitForAnimationToEnd:
    timeout: 10000

- assertVisible:
    text: "Paste contract note text here…"

- assertVisible:
    text: "Parse Text"

# Parse with empty input → alert (title "Empty" from the contractNoteUpload
# namespace, message "Please paste your contract note text first.")
- tapOn:
    text: "Parse Text"
- waitForAnimationToEnd:
    timeout: 10000

- runFlow:
    when:
      visible:
        text: "Please paste your contract note text first."
    commands:
      - tapOn:
          text: "OK"
      - waitForAnimationToEnd:
          timeout: 3000

# Empty-parse alert dismissed — the paste screen must still be up
- assertVisible:
    text: "Paste contract note text here…"

# ── 6. Paste a Sample Note and Parse ───────────────────────────────────────
- tapOn:
    text: "Paste contract note text here…"
# Build the note LINE BY LINE (block-scalar inputText collapses newlines on
# the Android IME — each line must end with an explicit ENTER keypress so
# the row-based parser sees real line breaks).
- inputText: "ZERODHA BROKING LTD"
- pressKey: ENTER
- inputText: "Contract Note"
- pressKey: ENTER
- inputText: "Scrip Name Buy/Sell Qty Rate Value"
- pressKey: ENTER
- inputText: "15-06-2026 10:30:00 NSE RELIANCE BUY 50 2890.50 144525.00"
- pressKey: ENTER
- inputText: "15-06-2026 14:45:00 NSE TCS SELL 20 3890.00 77800.00"
- pressKey: ENTER
- inputText: "16-06-2026 09:15:00 NSE HDFCBANK BUY 100 1680.25 168025.00"
- pressKey: ENTER
- inputText: "Total 1000000.00"
- pressKey: ENTER
- inputText: "Brokerage 150.00"
- pressKey: ENTER
- inputText: "STT 200.00"
- hideKeyboard

- tapOn:
    text: "Parse Text"
- waitForAnimationToEnd:
    timeout: 15000

# ── 7. Verify Extracted Trades ─────────────────────────────────────────────
# The result card renders below the input — scroll to it first
- scrollUntilVisible:
    element:
      text: "Trades extracted"
    direction: DOWN
    speed: 20
    timeout: 30000
- assertVisible:
    text: "Trades extracted"

- assertVisible:
    text: "Buys"
- assertVisible:
    text: "Sells"

- assertVisible:
    text: "Parsed Trades"
# Result rows sit below the fold — bring them in before asserting.
# Run-29 (109850376496) evidence: BOTH attempts failed here. The failure
# hierarchy stopped at the "Parsed Trades" title (rows below the fold) and
# 31s of `scrollUntilVisible ... direction: DOWN` never moved the page:
# that command (and plain `scroll`) swipes from the SCREEN CENTRE, which on
# this screen is inside the big paste TextInput — an EditText consumes the
# vertical drag, so the outer ScrollView never scrolls (Maestro docs: "the
# swipe may miss the scrollable region"). Fix: an explicit slow drag that
# starts BELOW the paste box (y=72%), plus a guarded second drag (swipes can
# never fail) for the case where the first one is dropped. The step is kept
# SHORT (15% of the screen ≈ the row height) so the summary card's Zerodha /
# Export CSV rows stay on screen for the asserts below. The fatal gate then
# still does its own fine-tuning, now accepting a partially visible row.
- swipe:
    start: "50%, 72%"
    end: "50%, 57%"
    duration: 700
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      notVisible:
        text: "RELIANCE"
    commands:
      - swipe:
          start: "50%, 72%"
          end: "50%, 57%"
          duration: 700
      - waitForAnimationToEnd:
          timeout: 3000
- scrollUntilVisible:
    element:
      text: "RELIANCE"
    direction: DOWN
    speed: 20
    timeout: 30000
    visibilityPercentage: 50
- assertVisible:
    text: "RELIANCE"
    optional: true
# Zerodha lives in the summary card ABOVE the trades table, so the nudge
# above moves it UP: search UP (only when it is off screen) instead of the
# old blind DOWN search, which would scroll away from it.
- runFlow:
    when:
      notVisible:
        text: "Zerodha"
    commands:
      - scrollUntilVisible:
          element:
            text: "Zerodha"
          direction: UP
          speed: 20
          timeout: 20000
- assertVisible:
    text: "Zerodha"

# Device-side fallback parse source
- assertVisible:
    text: "Extracted on device (fallback)"

- assertVisible:
    text: "Export CSV"

# ── 8. Clear and Verify Reset ──────────────────────────────────────────────
- tapOn:
    id: "clearBtn"
- waitForAnimationToEnd:
    timeout: 10000

- assertVisible:
    text: "Upload PDF"
- assertVisible:
    text: "Batch Upload"
- assertVisible:
    text: "Paste Text"

# "Trades extracted" is a substring of the result header line — use regex
- assertNotVisible:
    text: ".*Trades extracted.*"
- assertNotVisible:
    text: "Export CSV"

# ── 9. Navigate Back to Analytics ──────────────────────────────────────────
# Contract Note Parser is a root-stack screen ABOVE MainTabs — the tab bar
# is covered and the header back icon is custom-positioned. Hardware BACK
# pops to the underlying tab (Reports came from More).
- pressKey: BACK
- waitForAnimationToEnd:
    timeout: 10000

- assertVisible:
    text: "Analytics"
