# =============================================================================
# Contract Note Parser Flow
# =============================================================================
# Tests the Reports → Contract Note Parser tool:
#   1. Login with test credentials
#   2. Navigate: More → Reports (Analytics) → Contract Note Parser
#   3. Verify upload/paste action cards
#   4. Paste-text empty parse → "Empty" alert
#   5. Paste a sample Zerodha contract note → parse → verify extracted stats
#   6. Clear → verify form reset
#   7. Navigate back to Analytics
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
- assertVisible:
    id: "login-welcome-back"
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "home-greeting"

# ── 2. Navigate: More → Reports ────────────────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Reports"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    text: "Reports"
- waitForAnimationToEnd

# ── 3. Reports Screen (Analytics) ──────────────────────────────────────────
- assertVisible:
    text: "Analytics"

# Tools tile at the top of the scroll content
- scrollUntilVisible:
    element:
      text: "Contract Note Parser"
    direction: DOWN
- tapOn:
    text: "Contract Note Parser"
- waitForAnimationToEnd

# ── 4. Verify Parser Screen ────────────────────────────────────────────────
- assertVisible:
    text: "Contract Note Parser"
- assertVisible:
    text: "Extract trades from broker contract notes automatically"

- assertVisible:
    text: "Upload PDF Contract Note"
- assertVisible:
    text: "Select a PDF from your device"

- assertVisible:
    text: "Batch Upload (Multi)"
- assertVisible:
    text: "Select multiple PDFs to process at once"

- assertVisible:
    text: "Paste Contract Note Text"
- assertVisible:
    text: "Copy-paste from your broker's email or portal"

# ── 5. Paste Mode: Empty Parse ─────────────────────────────────────────────
- tapOn:
    text: "Paste Contract Note Text"
- waitForAnimationToEnd

- assertVisible:
    text: "Paste your contract note text here..."

- assertVisible:
    text: "Parse Text"

# Parse with empty input → "Empty" alert
- tapOn:
    text: "Parse Text"
- waitForAnimationToEnd

- assertVisible:
    text: "Empty"
- assertVisible:
    text: "Please paste your contract note text first."

- tapOn:
    text: "OK"
- waitForAnimationToEnd

# ── 6. Paste a Sample Note and Parse ───────────────────────────────────────
- tapOn:
    text: "Paste your contract note text here..."
- inputText: |
    ZERODHA BROKING LTD
    Contract Note

    Scrip Name             Buy/Sell  Qty    Rate    Value
    15-06-2026 10:30:00 NSE RELIANCE BUY    50      2890.50 144525.00
    15-06-2026 14:45:00 NSE TCS      SELL   20      3890.00 77800.00
    16-06-2026 09:15:00 NSE HDFCBANK BUY    100     1680.25 168025.00

    Total                                 1000000.00
    Brokerage                             150.00
    STT                                   200.00
- hideKeyboard

- tapOn:
    text: "Parse Text"
- waitForAnimationToEnd:
    timeout: 15000

# ── 7. Verify Extracted Trades ─────────────────────────────────────────────
- assertVisible:
    text: "Trades extracted"

- assertVisible:
    text: "Buys"
- assertVisible:
    text: "Sells"

- assertVisible:
    text: "Parsed Trades"
- assertVisible:
    text: "RELIANCE"

- assertVisible:
    text: "Zerodha"

# Device-side fallback parse source
- assertVisible:
    text: "Extracted on device (fallback)"

- assertVisible:
    text: "Export CSV"

# ── 8. Clear and Verify Reset ──────────────────────────────────────────────
- tapOn:
    id: "clearBtn"
- waitForAnimationToEnd

- assertVisible:
    text: "Upload PDF Contract Note"
- assertVisible:
    text: "Batch Upload (Multi)"
- assertVisible:
    text: "Paste Contract Note Text"

- assertNotVisible:
    text: "Trades extracted"
- assertNotVisible:
    text: "Export CSV"

# ── 9. Navigate Back to Analytics ──────────────────────────────────────────
- tapOn:
    text: "Go back"
- waitForAnimationToEnd

- assertVisible:
    text: "Analytics"
