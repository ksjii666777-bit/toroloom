# =============================================================================
# Tab Navigation Flow
# =============================================================================
# Tests bottom tab navigation: logs in first, then navigates through all 5
# tabs (Home, Markets, Watchlist, Portfolio, More) and verifies each screen's
# title is visible.
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 0. Kill app → relaunch fresh (prevents state leakage between sequential flows) ──

# ── Step 1: Login ──────────────────────────────────────────────────────────
- assertVisible:
    id: "login-email-input"
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 5000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000

# ── Step 2: Home Tab ───────────────────────────────────────────────────────
- assertVisible:
    id: "home-greeting"

# ── Step 3: Markets Tab ────────────────────────────────────────────────────
- tapOn:
    id: "tab-markets"
- waitForAnimationToEnd
- assertVisible:
    id: "markets-title"
- assertVisible:
    id: "markets-subtitle"

# ── Step 4: Portfolio Tab ──────────────────────────────────────────────────
- tapOn:
    id: "tab-portfolio"
- waitForAnimationToEnd
- assertVisible:
    id: "portfolio-title"
- assertVisible:
    id: "portfolio-subtitle"

# ── Step 5: Watchlist Tab ──────────────────────────────────────────────────
- tapOn:
    id: "tab-watchlist"
- waitForAnimationToEnd
- assertVisible:
    id: "watchlist-title"
- assertVisible:
    id: "watchlist-subtitle"

# ── Step 6: More Tab ───────────────────────────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- assertVisible:
    id: "more-title"
# Menu sections sit below the fold — scroll the target item into view
# (slow scroll: this emulator scrolls slowly on the More screen).
- scrollUntilVisible:
    element:
      id: "menu-MutualFunds"
    direction: DOWN
    speed: 20
    timeout: 30000
- assertVisible:
    id: "menu-MutualFunds"

# ── Step 7: Back to Home ───────────────────────────────────────────────────
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd
- assertVisible:
    id: "home-greeting"
