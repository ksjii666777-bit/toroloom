# =============================================================================
# Tab Navigation Flow
# =============================================================================
# Tests bottom tab navigation: logs in first, then navigates through all 5
# tabs (Home, Markets, Watchlist, Portfolio, More) and verifies each screen's
# title is visible.
# =============================================================================

appId: com.anonymous.Toroloom
---
# ── 0. Kill app → relaunch fresh (prevents state leakage between sequential flows) ──
- stopApp

# ── Step 1: Login ──────────────────────────────────────────────────────────
- assertVisible:
    id: "login-email-input"
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 5000

# ── Step 2: Home Tab ───────────────────────────────────────────────────────
- assertVisible:
    id: "home-greeting"

# ── Step 3: Markets Tab ────────────────────────────────────────────────────
- tapOn:
    id: "tab-markets"
- waitForAnimationToEnd
- assertVisible:
    id: "markets-title"
- assertVisible:
    id: "markets-subtitle"

# ── Step 4: Portfolio Tab ──────────────────────────────────────────────────
- tapOn:
    id: "tab-portfolio"
- waitForAnimationToEnd
- assertVisible:
    id: "portfolio-title"
- assertVisible:
    id: "portfolio-subtitle"

# ── Step 5: Watchlist Tab ──────────────────────────────────────────────────
- tapOn:
    id: "tab-watchlist"
- waitForAnimationToEnd
- assertVisible:
    id: "watchlist-title"
- assertVisible:
    id: "watchlist-subtitle"

# ── Step 6: More Tab ───────────────────────────────────────────────────────
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- assertVisible:
    id: "more-title"
- assertVisible:
    id: "menu-MutualFunds"

# ── Step 7: Back to Home ───────────────────────────────────────────────────
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd
- assertVisible:
    id: "home-greeting"
