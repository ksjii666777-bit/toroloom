# =============================================================================
# Order Edge Cases Flow
# =============================================================================
# Tests the order form edge cases:
#   1. Login with test credentials
#   2. Markets → search RELIANCE → Stock Detail
#   3. Buy → "Buy Securities" form
#   4. Max quick-qty with empty balance → error / clamp behaviour
#   5. Order Summary, order types, balance info
#   6. Back to stock detail
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# Cold-start can be slow on the cloud emulator — wait up to 60s
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- assertVisible:
    id: "home-greeting"

# ═══════════════════════════════════════════════════════════════════════════
# 1. Navigate to Markets → Stock Detail
# ═══════════════════════════════════════════════════════════════════════════
- tapOn:
    id: "tab-markets"
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible:
    id: "markets-title"

# RELIANCE is always in the markets list but may sit below the fold —
# scroll it in and tap (same proven path as placeOrder; the search-focused
# suggestion dashboard races the tap on slow emulators, so avoid it).
- scrollUntilVisible:
    element:
      text: "RELIANCE"
    direction: DOWN
    speed: 20
    timeout: 30000
- tapOn:
    text: "RELIANCE"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    text: "RELIANCE"

# ═══════════════════════════════════════════════════════════════════════════
# 2. Open Buy Order Form
# ═══════════════════════════════════════════════════════════════════════════
# Bottom action bar Buy button (testID stock-buy-btn)
- tapOn:
    id: "stock-buy-btn"
- waitForAnimationToEnd:
    timeout: 10000

# Verify the order form screen loaded
- assertVisible:
    text: "Buy Securities"

# ═══════════════════════════════════════════════════════════════════════════
# 3. Test Max Quantity Button
# ═══════════════════════════════════════════════════════════════════════════
# Quick quantity chips: 10 / 50 / 100 / Max (testID quickQty_Max)
- tapOn:
    id: "quickQty_Max"
- waitForAnimationToEnd:
    timeout: 10000

# The Order Summary card appears when qty is set — bring it in with a
# bare scroll (can never fail) and gate on the card; this was the LAST
# fatal-first scrollUntilVisible left in the flow.
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      text: "Order Summary"
    timeout: 30000
- assertVisible:
    text: "Order Summary"

# (Balance verification moved AFTER the order-type chips — run-24 att2
# evidence: downward scrolls virtualize the ORDER TYPE section away;
# see section 5.)

# ═══════════════════════════════════════════════════════════════════════════
# 4. Verify Order Form Shows Order Types (BEFORE the balance scrolls)
# ═══════════════════════════════════════════════════════════════════════════
# Order-type chips carry stable testIDs (orderType_MARKET/LIMIT/SL/SL-M) —
# use them instead of the text "Market": the chip renders UPPERCASE
# ("MARKET") and run-16's case-sensitive text scroll hunted the wrong
# string for the full 20s in BOTH attempts.
# Run-23 att1: the first UP-scroll here was top-level fatal (heal below it
# never ran) — fixed with a guarded lattice. Run-24 att2 (109462685063)
# exposed two more traps: (a) runFlow.when guards only the CONDITION — a
# scrollUntilVisible failing INSIDE the guard still kills the flow (the
# guarded 20s UP-scroll FAILED and took the whole flow with it); (b) after
# the DOWN-scrolls to the balance line the dump showed the order form alive
# but the ORDER TYPE section gone — the list virtualized it away. Chips are
# always mounted at FORM-TOP (att1 asserted them instantly), so assert them
# FIRST, before any downward scroll. Heal is a bare swipe (a downward drag
# reveals content above the viewport and can never fail); the bounded EWU
# is the only fatal step.
- runFlow:
    when:
      notVisible:
        id: "orderType_MARKET"
    commands:
      - swipe:
          start: "50%, 40%"
          end: "50%, 80%"
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: "orderType_MARKET"
    timeout: 30000
- assertVisible:
    id: "orderType_MARKET"

# ═══════════════════════════════════════════════════════════════════════════
# 5. Balance line (AFTER the chips — plain-scroll heals only)
# ═══════════════════════════════════════════════════════════════════════════
# Run-24 att2 lesson: never put a scrollUntilVisible inside a runFlow
# guard — its failure propagates and kills the flow. Plain scrolls move
# the list and can never fail; the EWU below is the single fatal gate.
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      notVisible:
        text: ".*Available:.*|.*Insufficient balance.*"
    commands:
      - scroll
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    visible:
      text: ".*Available:.*|.*Insufficient balance.*"
    timeout: 45000

# Tap the back button (testID) to return to stock detail
- tapOn:
    id: "backBtn"
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible:
    text: "RELIANCE"
