# =============================================================================
# Order Edge Cases Flow
# =============================================================================
# Tests the order form edge cases:
#   1. Login with test credentials
#   2. Markets → search RELIANCE → Stock Detail
#   3. Buy → "Buy Securities" form
#   4. Max quick-qty with empty balance → error / clamp behaviour
#   5. Order Summary, order types, balance info
#   6. Back to stock detail
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# Cold-start can be slow on the cloud emulator — wait up to 60s
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- assertVisible:
    id: "home-greeting"

# ═══════════════════════════════════════════════════════════════════════════
# 1. Navigate to Markets → Stock Detail
# ═══════════════════════════════════════════════════════════════════════════
- tapOn:
    id: "tab-markets"
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible:
    id: "markets-title"

# RELIANCE is always in the markets list but may sit below the fold —
# scroll it in and tap (same proven path as placeOrder; the search-focused
# suggestion dashboard races the tap on slow emulators, so avoid it).
- scrollUntilVisible:
    element:
      text: "RELIANCE"
    direction: DOWN
    speed: 20
    timeout: 30000
- tapOn:
    text: "RELIANCE"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    text: "RELIANCE"

# ═══════════════════════════════════════════════════════════════════════════
# 2. Open Buy Order Form
# ═══════════════════════════════════════════════════════════════════════════
# Bottom action bar Buy button (testID stock-buy-btn)
- tapOn:
    id: "stock-buy-btn"
- waitForAnimationToEnd:
    timeout: 10000

# Verify the order form screen loaded
- assertVisible:
    text: "Buy Securities"

# ═══════════════════════════════════════════════════════════════════════════
# 3. Verify Order-Type Chips FIRST (form-top, before ANY scroll)
# ═══════════════════════════════════════════════════════════════════════════
# Order-type chips carry stable testIDs (orderType_MARKET/LIMIT/SL/SL-M).
# Run-24/25 dumps proved the form VIRTUALIZES sections away: scrolled
# down, the chips vanish (run-24 att2, run-25 att1); scrolled back up,
# the Order Summary card vanishes (run-25 att2 — hierarchy showed NO
# order-summary-title at all, so a bare scroll then moved nothing). The
# chips are always mounted at FORM-TOP, so assert them here, before any
# scrolling has happened. Heal is a bare swipe (a downward drag reveals
# content above the viewport and can never fail); the bounded EWU is the
# only fatal step.
- runFlow:
    when:
      notVisible:
        id: "orderType_MARKET"
    commands:
      - swipe:
          start: "50%, 40%"
          end: "50%, 80%"
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: "orderType_MARKET"
    timeout: 30000
- assertVisible:
    id: "orderType_MARKET"

# ═══════════════════════════════════════════════════════════════════════════
# 4. Max quantity → Order Summary → balance line (one downward pass)
# ═══════════════════════════════════════════════════════════════════════════
# Quick quantity chips: 10 / 50 / 100 / Max (testID quickQty_Max)
- tapOn:
    id: "quickQty_Max"
- waitForAnimationToEnd:
    timeout: 10000

# The Order Summary card appears when qty is set — one bare scroll (can
# never fail), then the bounded gate. scrollUntilVisible is banned in
# this flow: run-22/23 proved a fatal first scroll turns every later
# heal into dead code, and run-24 proved its failure propagates out of
# runFlow guards.
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      text: "Order Summary"
    timeout: 30000
- assertVisible:
    text: "Order Summary"

# Balance line ("Available: ₹…" / "Insufficient balance — need ₹… more")
# sits below the summary rows. Run-25 att2 evidence: if the form scrolled
# back to the top the summary card UNMOUNTS (virtualized) and plain
# scrolls then move nothing — the heal re-taps Max (no-op on qty, forces
# the card to re-mount) and scrolls once more. Every heal action here is
# unfailable; the EWU is the single fatal gate.
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      notVisible:
        text: ".*Available:.*|.*Insufficient balance.*"
    commands:
      - tapOn:
          id: "quickQty_Max"
          optional: true
      - waitForAnimationToEnd:
          timeout: 5000
      - scroll
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    visible:
      text: ".*Available:.*|.*Insufficient balance.*"
    timeout: 45000

# Tap the back button (testID) to return to stock detail
- tapOn:
    id: "backBtn"
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible:
    text: "RELIANCE"
