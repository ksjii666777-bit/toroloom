# =============================================================================
# Order Edge Cases Flow
# =============================================================================
# Tests the order form edge cases:
#   1. Login with test credentials
#   2. Markets → search RELIANCE → Stock Detail
#   3. Buy → "Buy Securities" form
#   4. Max quick-qty with empty balance → error / clamp behaviour
#   5. Order Summary, order types, balance info
#   6. Back to stock detail
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# Cold-start can be slow on the cloud emulator — wait up to 60s
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- assertVisible:
    id: "home-greeting"

# ═══════════════════════════════════════════════════════════════════════════
# 1. Navigate to Markets → Stock Detail
# ═══════════════════════════════════════════════════════════════════════════
- tapOn:
    id: "tab-markets"
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible:
    id: "markets-title"

# RELIANCE is always in the markets list but may sit below the fold —
# scroll it in and tap (same proven path as placeOrder; the search-focused
# suggestion dashboard races the tap on slow emulators, so avoid it).
- scrollUntilVisible:
    element:
      text: "RELIANCE"
    direction: DOWN
    speed: 20
    timeout: 30000
- tapOn:
    text: "RELIANCE"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    text: "RELIANCE"

# ═══════════════════════════════════════════════════════════════════════════
# 2. Open Buy Order Form
# ═══════════════════════════════════════════════════════════════════════════
# Bottom action bar Buy button (testID stock-buy-btn)
- tapOn:
    id: "stock-buy-btn"
- waitForAnimationToEnd:
    timeout: 10000

# Verify the order form screen loaded
- assertVisible:
    text: "Buy Securities"

# ═══════════════════════════════════════════════════════════════════════════
# 3. Test Max Quantity Button
# ═══════════════════════════════════════════════════════════════════════════
# Quick quantity chips: 10 / 50 / 100 / Max (testID quickQty_Max)
- tapOn:
    id: "quickQty_Max"
- waitForAnimationToEnd:
    timeout: 10000

# The Order Summary card appears when qty is set — scroll to it
- scrollUntilVisible:
    element:
      text: "Order Summary"
    direction: DOWN
- assertVisible:
    text: "Order Summary"

# Verify the balance indicator ("Available: ₹...") — it sits BELOW the
# summary rows inside the card, so scroll it into view explicitly (the
# bottom bar shows "Total" once qty > 0, not "Available")
# The balance line is "Available: ₹…" when the Max order fits the balance
# and "Insufficient balance — need ₹… more" when it does not (live backend
# user balance decides) — scroll once, accept whichever variant rendered.
# The balance line sits below the summary rows. Run-16 att2 rendered the
# summary WITHOUT the balance line (live-data race on a slow emulator) —
# the bare scroll exhausted its 20s and killed the flow. Retry once after
# a settle window instead of a fatal bare assert: if the line truly never
# renders, the NEXT gate (chip scroll) fails visibly with the dump.
# Run-22 (36546192421) att1 evidence: the FIRST scrollUntilVisible here
# was TOP-LEVEL FATAL — its 20s exhaustion killed the flow instantly and
# the "retry" below never ran (log shows the failure right after Order
# Summary with no retry attempt; att2 passed, so the line does render —
# it is a slow-scroll race, not a missing element). Non-fatal lattice,
# same shape as placeOrder's proven one: plain scrolls to move the list,
# settle, then ONE guarded scroll for the still-missing case. The balance
# gate becomes the bounded EWU further down; a persistent miss now fails
# visibly at the next gate (chip scroll) with the dump.
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      notVisible:
        text: ".*Available:.*|.*Insufficient balance.*"
    commands:
      - scroll
      - waitForAnimationToEnd:
          timeout: 5000
- runFlow:
    when:
      notVisible:
        text: ".*Available:.*|.*Insufficient balance.*"
    commands:
      - scrollUntilVisible:
          element:
            text: ".*Available:.*|.*Insufficient balance.*"
          direction: DOWN
          speed: 20
          timeout: 20000
# Bounded fatal gate AFTER all heals: a persistently missing balance line
# is a real regression and must fail — but only here, never inside a heal.
- extendedWaitUntil:
    visible:
      text: ".*Available:.*|.*Insufficient balance.*"
    timeout: 45000

# ═══════════════════════════════════════════════════════════════════════════
# 4. Verify Order Form Shows Order Types
# ═══════════════════════════════════════════════════════════════════════════
# Order-type chips carry stable testIDs (orderType_MARKET/LIMIT/SL/SL-M) —
# use them instead of the text "Market": the chip renders UPPERCASE
# ("MARKET") and run-16's case-sensitive text scroll hunted the wrong
# string for the full 20s in BOTH attempts. The balance scroll pushed the
# chips ABOVE the viewport, so scroll UP to them, then assert via testID.
# Run-23 (109398415444) att1 evidence: the FIRST UP-scroll here is
# top-level FATAL — its 30s exhaustion killed the flow instantly and the
# run-20 guarded retry below never ran (same trap run-22 proved for the
# balance line: a fatal first attempt turns every later heal into dead
# code). att2 passed, so the chips DO render — the 100%-visibility
# criterion flakes against the form layout. Non-fatal lattice: two
# guarded swipe-heals first (a downward drag reveals content ABOVE the
# viewport and, being a bare gesture, can never fail), then ONE guarded
# scroll, then a bounded gate before the honest assert.
- runFlow:
    when:
      notVisible:
        id: "orderType_MARKET"
    commands:
      - swipe:
          start: "50%, 40%"
          end: "50%, 80%"
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      notVisible:
        id: "orderType_MARKET"
    commands:
      - swipe:
          start: "50%, 40%"
          end: "50%, 80%"
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      notVisible:
        id: "orderType_MARKET"
    commands:
      - scrollUntilVisible:
          element:
            id: "orderType_MARKET"
          direction: UP
          speed: 20
          timeout: 20000
- extendedWaitUntil:
    visible:
      id: "orderType_MARKET"
    timeout: 30000
- assertVisible:
    id: "orderType_MARKET"

# Tap the back button (testID) to return to stock detail
- tapOn:
    id: "backBtn"
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible:
    text: "RELIANCE"
