# =============================================================================
# Course Detail Flow
# =============================================================================
# Tests the Learn hub → Course detail → Lesson flow:
#   1. Login with test credentials
#   2. Navigate to the Learn tab
#   3. Verify Learning Hub header + All Courses section
#   4. Open a real course ("Stock Market Basics")
#   5. Verify Course Progress + About this Course
#   6. Open lesson 01 → verify lesson header, Key Takeaways, Summary
#   7. Navigate back to Learning Hub
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 1. Login ───────────────────────────────────────────────────────────────
- assertVisible:
    id: "login-welcome-back"
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "home-greeting"

# ── 2. Navigate to the Learn tab ───────────────────────────────────────────
# Learn is reached via More → Courses (no dedicated tab)
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Courses"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    text: "Courses"
- waitForAnimationToEnd

# ── 3. Verify Learning Hub ─────────────────────────────────────────────────
- assertVisible:
    text: "Learning Hub"
- assertVisible:
    text: "Master the markets, one lesson at a time"
- assertVisible:
    text: "All Courses"

# ── 4. Open a Real Course ──────────────────────────────────────────────────
- scrollUntilVisible:
    element:
      text: "Stock Market Basics"
    direction: DOWN
- tapOn:
    text: "Stock Market Basics"
- waitForAnimationToEnd

# ── 5. Verify Course Detail ────────────────────────────────────────────────
- assertVisible:
    text: "Course Progress"
- assertVisible:
    text: "Completed"
- assertVisible:
    text: "Remaining"
- assertVisible:
    text: "About this Course"

# ── 6. Open Lesson 01 ──────────────────────────────────────────────────────
- scroll
- waitForAnimationToEnd

- tapOn:
    text: "01"
- waitForAnimationToEnd:
    timeout: 5000

# Lesson header: "Lesson 1 of N" / "Key Takeaways" / "Summary"
- assertVisible:
    text: "Lesson 1 of"
- assertVisible:
    text: "Key Takeaways"
- assertVisible:
    text: "Summary"

- scroll
- waitForAnimationToEnd

- assertVisible:
    text: "Mark as Complete"

# ── 7. Navigate Back to Learning Hub ───────────────────────────────────────
- tapOn:
    text: "Go back"
- waitForAnimationToEnd

- assertVisible:
    text: "Course Progress"

- tapOn:
    text: "Go back"
- waitForAnimationToEnd

- assertVisible:
    text: "Learning Hub"
