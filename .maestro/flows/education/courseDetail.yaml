# =============================================================================
# Course Detail Flow
# =============================================================================
# Tests the Learn hub → Course detail → Lesson flow:
#   1. Login with test credentials
#   2. Navigate to the Learn tab
#   3. Verify Learning Hub header + All Courses section
#   4. Open a real course ("Stock Market Basics")
#   5. Verify Course Progress + About this Course
#   6. Open lesson 01 → verify lesson header, Key Takeaways, Summary
#   7. Navigate back to Learning Hub
# =============================================================================

appId: com.toroloom.app
---
- clearState
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
# ── 1. Login ───────────────────────────────────────────────────────────────
# Cold-start can be slow on the cloud emulator — wait up to 60s
- extendedWaitUntil:
    visible:
      id: "login-welcome-back"
    timeout: 60000
- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-btn"
- waitForAnimationToEnd:
    timeout: 30000

# Fresh installs show the onboarding walkthrough after login — skip it
# (idempotent: skipped when already completed)
- runFlow:
    when:
      visible:
        text: "Skip"
    commands:
      - tapOn:
          text: "Skip"
      - waitForAnimationToEnd:
          timeout: 5000

# If the backend health check fails (no local backend), dismiss the
# offline modal so the Home screen is reachable (idempotent).
- runFlow:
    when:
      visible:
        text: "You're offline"
    commands:
      - tapOn:
          text: "Close"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "home-greeting"

# ── 2. Navigate to the Learn tab ───────────────────────────────────────────
# Learn is reached via More → Courses (no dedicated tab)
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Courses"
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn:
    text: "Courses"
- waitForAnimationToEnd

# ── 3. Verify Learning Hub ────────────────────────────────────────────────
- assertVisible:
    text: "Learning Hub"
- assertVisible:
    text: "Master the markets, one lesson at a time"
# "All Courses" section sits below the fold — scroll to it (a plain assert
# races the scroll and fails on slower emulators)
- scrollUntilVisible:
    element:
      text: "All Courses"
    direction: DOWN
    speed: 20
    timeout: 30000

# ── 4. Open a Real Course ──────────────────────────────────────────────────
- scrollUntilVisible:
    element:
      text: "Stock Market Basics"
    direction: DOWN
- tapOn:
    text: "Stock Market Basics"
- waitForAnimationToEnd

# ── 5. Verify Course Detail ────────────────────────────────────────────────
- assertVisible:
    text: "Course Progress"
- assertVisible:
    text: "Completed"
- assertVisible:
    text: "Remaining"
# "About this Course" is a Card header below the hero — scroll to it
- scrollUntilVisible:
    element:
      text: "About this Course"
    direction: DOWN
    speed: 20
    timeout: 30000

# ── 6. Open Lesson 01 ──────────────────────────────────────────────────────
# Lessons list is below the fold — scroll the first lesson card in and tap
# it via its stable testID (the number badge "01" only renders while the
# lesson is INCOMPLETE; a completed lesson shows a checkmark instead, so
# text-targeting is state-dependent).
- scrollUntilVisible:
    element:
      id: "lesson-card-1"
    direction: DOWN
    speed: 20
    timeout: 30000
- tapOn:
    id: "lesson-card-1"
- waitForAnimationToEnd:
    timeout: 10000

# Lesson header: "Lesson 1 of N" / "Key Takeaways" / "Summary".
# LessonView is a lazy chunk — give the navigation a settle window. The
# tap can fire while the lazy CourseDetail chunk is STILL mounting
# (pressables not yet wired), landing nowhere; detect that and re-tap.
- runFlow:
    when:
      notVisible:
        text: "Lesson 1 of"
    commands:
      - runFlow:
          when:
            visible:
              id: "lesson-card-1"
          commands:
            - tapOn:
                id: "lesson-card-1"
            - waitForAnimationToEnd:
                timeout: 5000
- extendedWaitUntil:
    visible:
      text: "Lesson 1 of"
    timeout: 60000
- assertVisible:
    text: "Key Takeaways"
- assertVisible:
    text: "Summary"

- scroll
- waitForAnimationToEnd

# "Mark as Complete" renders only while the lesson is INCOMPLETE — a
# previously completed lesson shows the header checkmark instead.
- assertVisible:
    text: "Mark as Complete"
    optional: true

# ── 7. Navigate Back to Learning Hub ───────────────────────────────────────
# LessonView and CourseDetail are root-stack screens — hardware BACK pops
# one level each time
- pressKey: BACK
- waitForAnimationToEnd

- assertVisible:
    text: "Course Progress"

- pressKey: BACK
- waitForAnimationToEnd

- assertVisible:
    text: "Learning Hub"
