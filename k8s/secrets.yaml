# ═══════════════════════════════════════════════════════════════════════════
# Toroloom — Kubernetes Secrets TEMPLATE
# ═══════════════════════════════════════════════════════════════════════════
#
# ⚠️  DO NOT apply this file as-is and DO NOT commit real secrets to Git.
#     All values below are intentionally EMPTY placeholders.
#
# ✅  Preferred way — generate + apply with real secrets (nothing committed):
#
#     kubectl create secret generic toroloom-secrets \
#       --namespace toroloom \
#       --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#       --from-literal=SNAPTRADE_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
#       --from-literal=DATABASE_URL='postgresql://toroloom:CHANGE_ME@pgbouncer:6432/toroloom' \
#       --from-literal=REDIS_URL='redis://:CHANGE_ME@redis:6379'
#
# ✅  Alternative — Kustomize secretGenerator from a git-ignored .env file
#     (kustomization.yaml already has this wired up):
#
#     1. cp k8s/.env.secret.example k8s/.env.secret   (fresh clone par)
#     2. Real values fill karo (git-ignored — commit mat karo)
#     3. kubectl apply -k k8s/
#
# 🏭  Production scale: use External Secrets Operator (AWS Secrets Manager),
#     sealed-secrets (Bitnami), or SOPS + age instead of committed manifests.
#
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: toroloom-secrets
  namespace: toroloom
  labels:
    app.kubernetes.io/name: toroloom
    app.kubernetes.io/part-of: toroloom
type: Opaque
stringData:
  # ── Required — MUST SET before apply ───────────────────────────────────
  JWT_SECRET: ""            # openssl rand -hex 32
  SNAPTRADE_ENCRYPTION_KEY: ""  # openssl rand -hex 32

  # ── Storage (choose one) ───────────────────────────────────────────────
  # Point DATABASE_URL to PgBouncer (port 6432) for connection pooling.
  # For direct PostgreSQL (dev): use port 5432.
  DATABASE_URL: ""          # postgresql://toroloom:PASSWORD@pgbouncer:6432/toroloom
  # DATABASE_URL_READER: ""

  # ── Redis (pub/sub + caching) ──────────────────────────────────────────
  REDIS_URL: ""             # redis://:PASSWORD@redis:6379

  # ── Payments (set when ready) ──────────────────────────────────────────
  # RAZORPAY_KEY_ID: ""
  # RAZORPAY_KEY_SECRET: ""
  # RAZORPAY_WEBHOOK_SECRET: ""

  # ── AI providers (set when ready) ──────────────────────────────────────
  # OPENROUTER_API_KEY: ""
  # GOOGLE_GEMINI_API_KEY: ""

  # ── Error tracking (optional) ──────────────────────────────────────────
  # SENTRY_DSN: ""

  # ── Broker credentials (optional, set when ready) ──────────────────────
  # ANGEL_CLIENT_ID: ""
  # ANGEL_API_KEY: ""
  # ANGEL_ACCESS_TOKEN: ""
  # ZERODHA_API_KEY: ""
  # ZERODHA_API_SECRET: ""
  # ZERODHA_ACCESS_TOKEN: ""
