<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toroloom — i18n Live Toggle Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #05070d;
        --bg-card: #0e111a;
        --border: rgba(255, 255, 255, 0.08);
        --text: #f8fafc;
        --text-muted: #64748b;
        --cell-bg: rgba(255, 255, 255, 0.02);
        --header-grad: linear-gradient(135deg, rgba(59,130,246,0.12), rgba(34,197,94,0.06));
        --primary: #3b82f6;
        --green: #22c55e;
        --red: #ef4444;
      }
      /* Light theme — flipped via data-theme on <html> by the real ThemeProvider */
      html[data-theme='light'] {
        --bg: #f4f6fb;
        --bg-card: #ffffff;
        --border: #e2e8f0;
        --text: #0f172a;
        --text-muted: #64748b;
        --cell-bg: rgba(15, 23, 42, 0.03);
        --header-grad: linear-gradient(135deg, rgba(59,130,246,0.10), rgba(34,197,94,0.05));
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', 'Noto Sans Devanagari', system-ui, sans-serif;
        min-height: 100vh;
        padding: 24px;
        transition: background 0.2s ease, color 0.2s ease;
      }
      .wrap { max-width: 860px; margin: 0 auto; }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        padding: 16px 20px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--header-grad);
        margin-bottom: 20px;
      }
      .logo { font-weight: 800; font-size: 20px; letter-spacing: -0.3px; }
      .logo span { color: var(--primary); }
      .badge {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1px;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        text-transform: uppercase;
      }
      .badge.en { color: var(--primary); background: rgba(59,130,246,0.12); }
      .badge.hi { color: var(--green); background: rgba(34,197,94,0.12); }
      .toggle-btn {
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        color: #fff;
        border: none;
        font-family: inherit;
        font-weight: 700;
        font-size: 15px;
        padding: 12px 22px;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
        box-shadow: 0 4px 18px rgba(59, 130, 246, 0.35);
      }
      .toggle-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(59, 130, 246, 0.45); }
      .toggle-btn:active { transform: translateY(0) scale(0.97); }
      .toggle-btn.secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
        box-shadow: none;
      }
      .toggle-btn.secondary:hover {
        border-color: var(--primary);
        color: var(--primary);
        box-shadow: none;
      }
      section { margin-bottom: 24px; }
      h2 {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 12px;
      }
      .card {
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--bg-card);
        padding: 16px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 10px;
      }
      .cell {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        background: var(--cell-bg);
      }
      .cell .key {
        font-size: 11px;
        color: var(--text-muted);
        font-family: monospace;
        margin-bottom: 4px;
      }
      .cell .val { font-size: 14px; line-height: 1.5; }
      .cell .val .hi { color: #7ee787; }
      .foot {
        text-align: center;
        color: var(--text-muted);
        font-size: 12px;
        margin-top: 28px;
        line-height: 1.7;
      }
      .hint {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--text-muted);
        border: 1px dashed var(--border);
        padding: 6px 12px;
        border-radius: 999px;
        margin-bottom: 14px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div id="root"></div>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
